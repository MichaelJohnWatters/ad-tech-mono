# Publisher-side direct-sold line items. Consumed by cmd/publisher-adserver
# for arbitration against programmatic. See docs/PLAN.md →
# "Publisher-Side Ad Server" for the arbitration ladder.
#
# Each line item is owned by the publisher's account (not the buyer's).
# `demand_source` is just a string — the brand or agency the publisher sold
# to. Direct deals routinely involve advertisers who never log into our DSP,
# so we don't try to link demand_source to an internal account.
#
# Priority tiers: sponsorship > guaranteed > preferred > house.
# Tier semantics:
#   - sponsorship: always wins when active. Use for site/section takeovers.
#   - guaranteed: contractual delivery; pacer keeps it on track.
#   - preferred: negotiated rate floor, no commitment (deferred — not in
#     starting scope).
#   - house: free fill for unsold inventory.
name: standard

line_items:
  - id: pli-news-sponsorship-acme
    publisher: pub-daily-news
    name: "Acme Homepage Takeover"
    demand_source: "Acme Corp"
    priority_tier: sponsorship
    placements: [pl-news-leaderboard]
    delivery_start: "2026-06-01T00:00:00Z"
    delivery_end: "2026-06-30T23:59:59Z"
    cpm: 25.00
    landing_url: "http://localhost:8080/dev/landing/acme"
    creative_html: '<div style="width:728px;height:90px;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;">ACME · Sponsorship · <a href="${CLICK_URL}" style="color:#4cc9f0;margin-left:8px;">Learn more</a><img src="${IMP_PIXEL}" width="1" height="1" style="position:absolute;"></div>'

  - id: pli-news-guaranteed-globex
    publisher: pub-daily-news
    name: "Globex Q2 Guaranteed"
    demand_source: "Globex Industries"
    priority_tier: guaranteed
    # No placement allowlist = applies to every pub-daily-news placement.
    placements: []
    impressions_committed: 100000
    delivery_start: "2026-06-01T00:00:00Z"
    delivery_end: "2026-06-30T23:59:59Z"
    cpm: 8.00
    pacing_mode: even
    landing_url: "http://localhost:8080/dev/landing/globex"
    creative_html: '<a href="${CLICK_URL}" style="text-decoration:none;color:inherit;display:block;"><div style="width:300px;height:250px;background:#0a0a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">GLOBEX · Guaranteed<img src="${IMP_PIXEL}" width="1" height="1" style="position:absolute;"></div></a>'

  - id: pli-news-house-newsletter
    publisher: pub-daily-news
    name: "Daily News Newsletter Promo"
    demand_source: "Daily News (house)"
    priority_tier: house
    placements: []
    cpm: 0
    landing_url: "http://localhost:8080/dev/landing/daily-news"
    creative_html: '<div style="width:300px;height:250px;background:#f5f5f5;border:1px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;"><h3 style="margin:0 0 8px;color:#1a1a2e;">Subscribe</h3><p style="margin:0 0 12px;color:#666;font-size:13px;">Daily News in your inbox</p><a href="${CLICK_URL}" style="background:#4361ee;color:white;padding:8px 20px;border-radius:4px;text-decoration:none;font-size:13px;">Sign up</a><img src="${IMP_PIXEL}" width="1" height="1" style="position:absolute;"></div>'
