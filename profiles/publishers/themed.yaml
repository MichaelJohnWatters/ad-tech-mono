# Themed publishers — the READABLE core of the two-tier demo world
# (operator design decision, 2026-08-07). Each publisher is a single-topic
# site whose placements carry a human-checkable category slug ("dogs",
# "cats", "coffee", "fitness"). The SSP stamps those categories onto every
# consented request's behaviour signal, the hourly profile-builder's seeded
# category rules (cmd/seed seedThemedSegments) turn repeat visits into
# segment membership, and the themed campaigns in profiles/dsps/internal.yaml
# target the resulting segments. Verification reads like English: the dog
# food ad wins on waggy-tails.blog for dog personas and never shows to pure
# cat people.
#
# The slugs are deliberately NOT IAB codes — they are matched verbatim by
# both the profile-builder rule (behaviour_signals.categories) and the
# simulator's persona Interests (pkg/simulator/request.ThemedPersonas).
name: themed

publishers:
  - id: pub-waggy-tails
    name: "Waggy Tails Daily"
    domain: "waggy-tails.blog"
    currency: USD
    revshare_pct: 20
    placements:
      - id: pl-dog-blog-mpu
        name: "Dog Blog MPU"
        format: display
        width: 300
        height: 250
        floor_price: 0.60
        page_url: "https://waggy-tails.blog/training-tips"
        categories: [dogs, pets]
      - id: pl-dog-blog-leader
