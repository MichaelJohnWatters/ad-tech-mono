# Internal DSP - our platform's advertisers.
# Bids are deterministic (no randomisation). We control these campaigns.
name: internal
competitor: false

campaigns:
  - id: li-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - UK Mobile"
    creative_domain: acme-shoes.com
    base_bid: 6.00
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        geo: [GBR]
        device: [mobile]
    # Mobile-first campaign — mobile banner + MPU + half-page.
    creatives:
      - { id: cr-shoes-001, width: 300, height: 250 }
      - { id: cr-shoes-001-mobile, width: 320, height: 50 }
      - { id: cr-shoes-001-halfpage, width: 300, height: 600 }

  - id: li-native-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - Native In-Feed"
    creative_domain: acme-shoes.com
    base_bid: 6.00
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    format: native
    targeting:
      include:
        geo: [GBR, USA]
    # Native in-feed creative: the DSP fills an OpenRTB Native response from
    # these assets when the SSP sends a native request (channel=native).
    creatives:
      - id: cr-shoes-native-001
        format: native
        # Images point at seed-generated local theme SVGs (served via the
        # gateway /v1/creatives proxy from Minio) rather than an external CDN,
        # so the native ad renders in local dev. acme-shoes.com → "retail" theme.
        native:
          title: "Acme Running Shoes — 20% Off"
          main_image: "http://localhost:8080/v1/creatives/themes/retail-1200x627.svg"
          main_image_w: 1200
          main_image_h: 627
          icon: "http://localhost:8080/v1/creatives/themes/retail-300x250.svg"
          sponsored: "Acme"
          body: "Lightweight, all-day comfort. Free returns on every pair."
          cta: "Shop now"

  - id: li-audio-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - Audio Podcast Spot"
    creative_domain: acme-shoes.com
    base_bid: 6.60
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    format: audio
    targeting:
      include:
        geo: [GBR, USA]
    # Audio spot: the DSP bids when the SSP sends an audio request
    # (channel=audio) and ships the media URL + duration; the
    # publisher-adserver assembles the audio VAST (audio/mpeg MediaFile).
    creatives:
      - { id: cr-shoes-audio-30s, format: audio, duration: 30,
          media_url: "http://localhost:8080/v1/creatives/media/ad-audio.mp3" }

  - id: li-002
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - US All Devices"
    creative_domain: acme-shoes.com
    base_bid: 6.90
    currency: USD
    daily_budget: 1000
    total_budget: 25000
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        geo: [USA]
    modifiers:
      device:
        mobile: 15
        tablet: -10
      # USA boost keeps the flagship demo advertiser competitive on its home
      # market: without it Initech RON (mobile+25, USA+15 ≈ 9.2 effective) and
      # VPN (USA+50 ≈ 8.0) outbid Acme's 7.9 on EVERY US-mobile auction and
      # the demo portal shows zero delivery (2026-08-05 investigation).
      geo_country:
        USA: 40
    # Run of network US — every common size.
    creatives:
