      - { id: cr-shoes-002-leader, width: 728, height: 90 }
      - { id: cr-shoes-002-mobile, width: 320, height: 50 }
      - { id: cr-shoes-002-halfpage, width: 300, height: 600 }

  # Globex runs MODERATE bid shading (the only seeded advertiser that does), so
  # the advertiser portal's Bid Shading page shows the feature live: per-placement
  # "you paid vs the market", the shading-mode control, and any realized saving
  # (DSP win-notice → adtech.auction.shade → auction_shades in ClickHouse). Log in
  # as advertiser@adtech.local / admin. NOTE: realized savings are modest in the
  # local market because our win-rate curve only learns from OUR wins/losses, not
  # competitors' bids, so it can't shade far below the (competitive) clearing
  # without losing — see docs on the curve-calibration follow-up. Nothing faked.
  - id: li-003
    account_id: adv-globex
    advertiser_id: adv-globex
    io_id: io-002
    name: "Globex Tech - Desktop Worldwide"
    creative_domain: globex-tech.com
    base_bid: 10.00
    currency: USD
    daily_budget: 500
    total_budget: 5000
    bid_model: cpm
    pacing_mode: even
    status: live
    shading_mode: moderate
    modifiers:
      geo_country:
        USA: 20
        GBR: 10
    # Tech brand — MPU + leaderboard + sky, plus native +
    # instream video so Globex competes across formats (not display only).
    creatives:
      - { id: cr-tech-001, width: 300, height: 250 }
      - { id: cr-tech-001-leader, width: 728, height: 90 }
      - { id: cr-tech-001-sky, width: 160, height: 600 }
      - id: cr-tech-001-native
        format: native
        native:
          title: "Globex Cloud — Ship faster"
          main_image: "http://localhost:8080/v1/creatives/themes/tech-300x250.svg"
          main_image_w: 300
          main_image_h: 250
          icon: "http://localhost:8080/v1/creatives/themes/tech-300x250.svg"
          sponsored: "Globex"
          body: "The developer platform trusted by 10,000 teams."
          cta: "Start free"
      - { id: cr-tech-001-video-15s, format: video, width: 640, height: 360, duration: 15,
          media_url: "http://localhost:8080/v1/creatives/media/ad-video-globex.mp4" }

