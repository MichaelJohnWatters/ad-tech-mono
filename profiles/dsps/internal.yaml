# Internal DSP - our platform's advertisers.
# Bids are deterministic (no randomisation). We control these campaigns.
name: internal
competitor: false

campaigns:
  - id: li-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - UK Mobile"
    creative_domain: acme-shoes.com
    base_bid: 3.20
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        geo: [GBR]
        device: [mobile]
    # Mobile-first campaign — mobile banner + MPU + half-page.
    creatives:
      - { id: cr-shoes-001, width: 300, height: 250 }
      - { id: cr-shoes-001-mobile, width: 320, height: 50 }
      - { id: cr-shoes-001-halfpage, width: 300, height: 600 }

  - id: li-native-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - Native In-Feed"
    creative_domain: acme-shoes.com
    base_bid: 3.50
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    format: native
    targeting:
      include:
        geo: [GBR, USA]
    # Native in-feed creative: the DSP fills an OpenRTB Native response from
    # these assets when the SSP sends a native request (channel=native).
    creatives:
      - id: cr-shoes-native-001
        format: native
        native:
          title: "Acme Running Shoes — 20% Off"
          main_image: "https://cdn.acme-shoes.com/native/runner-1200x627.jpg"
          main_image_w: 1200
          main_image_h: 627
          icon: "https://cdn.acme-shoes.com/native/icon-128.png"
          sponsored: "Acme"
          body: "Lightweight, all-day comfort. Free returns on every pair."
          cta: "Shop now"

  - id: li-audio-001
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - Audio Podcast Spot"
    creative_domain: acme-shoes.com
    base_bid: 4.00
    currency: USD
    daily_budget: 500
    total_budget: 10000
    bid_model: cpm
    pacing_mode: even
    status: live
    format: audio
    targeting:
      include:
        geo: [GBR, USA]
    # Audio spot: the DSP bids when the SSP sends an audio request
    # (channel=audio) and ships the media URL + duration; the
    # publisher-adserver assembles the audio VAST (audio/mpeg MediaFile).
    creatives:
      - { id: cr-shoes-audio-30s, format: audio, duration: 30,
          media_url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }

  - id: li-002
    account_id: adv-acme
    advertiser_id: adv-acme
    io_id: io-001
    name: "Acme Shoes - US All Devices"
    creative_domain: acme-shoes.com
    base_bid: 3.00
    currency: USD
    daily_budget: 1000
    total_budget: 25000
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        geo: [USA]
    modifiers:
      device:
        mobile: 15
        tablet: -10
    # Run of network US — every common size.
    creatives:
      - { id: cr-shoes-002, width: 300, height: 250 }
      - { id: cr-shoes-002-leader, width: 728, height: 90 }
      - { id: cr-shoes-002-mobile, width: 320, height: 50 }
      - { id: cr-shoes-002-halfpage, width: 300, height: 600 }

  - id: li-003
    account_id: adv-globex
    advertiser_id: adv-globex
    io_id: io-002
    name: "Globex Tech - Desktop Worldwide"
    creative_domain: globex-tech.com
    base_bid: 3.80
    currency: USD
    daily_budget: 300
    total_budget: 5000
    bid_model: cpm
    pacing_mode: even
    status: live
    modifiers:
      geo_country:
        USA: 20
        GBR: 10
    # Desktop-leaning tech brand — MPU + leaderboard + sky.
    creatives:
      - { id: cr-tech-001, width: 300, height: 250 }
      - { id: cr-tech-001-leader, width: 728, height: 90 }
      - { id: cr-tech-001-sky, width: 160, height: 600 }

  - id: li-004
    account_id: adv-initech
    advertiser_id: adv-initech
    io_id: io-003
    name: "Initech SaaS - Run of Network"
    creative_domain: initech.io
    base_bid: 3.40
    currency: USD
    daily_budget: 200
    total_budget: 3000
    bid_model: cpm
    pacing_mode: asap
    status: live
    modifiers:
      device:
        mobile: 25
      geo_country:
        USA: 15
        GBR: 10
        DEU: 5
    # Pure RoN — MPU + leaderboard + half-page + mobile banner.
    creatives:
      - { id: cr-saas-001, width: 300, height: 250 }
      - { id: cr-saas-001-leader, width: 728, height: 90 }
      - { id: cr-saas-001-halfpage, width: 300, height: 600 }
      - { id: cr-saas-001-mobile, width: 320, height: 50 }
