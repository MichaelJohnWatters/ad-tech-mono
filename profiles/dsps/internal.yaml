  # The retargeting payoff: chases dog-food cart abandoners (enrolled by
  # audience-rt within seconds of the /v1/t/rt?tag=dogfood-cart pixel).
  - id: li-dogfood-cart-rt
    account_id: adv-barkbox
    advertiser_id: adv-barkbox
    io_id: io-barkbox
    name: "Premium Dog Food Co - Cart Retargeting"
    creative_domain: premium-dog-food.co
    base_bid: 22.00
    currency: USD
    daily_budget: 100
    total_budget: 1500
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        segments: [seg-dogfood-cart, seg-shop-checkout, seg-shop-product]
    # Dynamic Product Ads: the chase creative is assembled at render time from
    # the barkbox catalog + the shopper's carted SKUs (recorded by the SKU-aware
    # /v1/t/rt pixel). A visitor with no SKU context gets the static fallback.
    creatives:
      - { id: cr-dogfood-cart-001, width: 300, height: 250, format: dynamic_product }
      - { id: cr-dogfood-cart-001-leader, width: 728, height: 90, format: dynamic_product }
