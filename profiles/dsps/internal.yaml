  # Targets the COMPOSITE segment (dog-lovers AND coffee-browsers) — the
  # dog-cafe-regular persona is its natural audience.
  - id: li-dogcafe-aud
    account_id: adv-barkbox
    advertiser_id: adv-barkbox
    io_id: io-barkbox
    name: "Premium Dog Food Co - Cafe Crossover"
    creative_domain: premium-dog-food.co
    base_bid: 13.00
    currency: USD
