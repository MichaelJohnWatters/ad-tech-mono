# Competitor 3 - The competitive market maker (scenario: HEALTHY).
# One of the three SmartRouter scenario DSPs (see competitor1 = slowpoke,
# competitor2 = deadbeat): this one bids fast and often, so the router keeps
# it in every fan-out — the control against which the skip behaviour of the
# other two is visible. Catalog cloned from competitor2's original
# performance book (distinct accounts, -x3 suffix) so competitor fill
# survives the other two being scenario'd out.
