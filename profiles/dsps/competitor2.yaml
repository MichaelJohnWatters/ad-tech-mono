      include:
        device: [mobile]
    modifiers:
      geo_country:
        USA: 20
        JPN: 35
        GBR: 10
    # Mobile-only display + a 15s video for in-app instream demos.
    creatives:
      - { id: c2-cr-003, width: 300, height: 250 }
      - { id: c2-cr-003-mobile, width: 320, height: 50 }
      - { id: c2-cr-003-halfpage, width: 300, height: 600 }
