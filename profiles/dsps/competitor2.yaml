# Competitor 2 - Performance-focused DSP.
# Mix of cheap high-volume and expensive niche campaigns.
# More volatile bidding: ±40% noise, 15% no-bid rate.
name: competitor2
competitor: true
noise_pct: 40       # ±40% random bid noise (more volatile)
no_bid_rate: 0.15   # 15% chance of random no-bid

campaigns:
  - id: c2-001
    account_id: dsp-perf-media
    advertiser_id: adv-vpn-plus
    io_id: c2-io-001
    name: "VPN Plus - Global RON"
    creative_domain: vpnplus.com
    base_bid: 3.30
    currency: USD
    daily_budget: 10000
    total_budget: 200000
    bid_model: cpm
    pacing_mode: asap
    status: live
    modifiers:
      device:
        mobile: 10
        desktop: 5
      geo_country:
        USA: 50
        GBR: 30
        DEU: 20
        FRA: 15
        JPN: 10
    # Run of network — every common size.
    creatives:
      - { id: c2-cr-001, width: 300, height: 250 }
      - { id: c2-cr-001-leader, width: 728, height: 90 }
      - { id: c2-cr-001-mobile, width: 320, height: 50 }
      - { id: c2-cr-001-halfpage, width: 300, height: 600 }
      - { id: c2-cr-001-sky, width: 160, height: 600 }
      - { id: c2-cr-001-billboard, width: 970, height: 250 }

  - id: c2-002
    account_id: dsp-perf-media
    advertiser_id: adv-crypto-ex
    io_id: c2-io-002
    name: "CryptoEx - High Value Geo"
    creative_domain: cryptoex.io
    base_bid: 4.10
    currency: USD
    daily_budget: 1000
    total_budget: 20000
    bid_model: cpm
    pacing_mode: even
    status: live
    targeting:
      include:
        geo: [USA, GBR]
    modifiers:
      device:
        desktop: 20
    # Desktop-leaning finance — MPU + leaderboard + sky + billboard.
    creatives:
      - { id: c2-cr-002, width: 300, height: 250 }
      - { id: c2-cr-002-leader, width: 728, height: 90 }
      - { id: c2-cr-002-sky, width: 160, height: 600 }
      - { id: c2-cr-002-billboard, width: 970, height: 250 }

  - id: c2-003
    account_id: dsp-perf-media
