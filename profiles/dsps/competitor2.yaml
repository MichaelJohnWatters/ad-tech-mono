# Competitor 2 - SmartRouter scenario: DEADBEAT.
# Almost never bids (97% random no-bid) so its per-channel bid rate sits
# far below exchange.routing_min_bid_rate (5%) — after the 20-call warm-up
# the router skips it, with only the ε-probe trickle keeping stats alive.
# Its catalog stays intact: flip dsp.no_bid_rate down live (or reseed) and
# the EWMA window rehabilitates it within minutes — the visible
# skip→probe→recover cycle. (Original competitive book now lives on as
# competitor3.)
name: competitor2
competitor: true
noise_pct: 40
no_bid_rate: 0.99  # deadbeat: measured bid rate must sit CLEARLY below
                   # routing_min_bid_rate (5%) — at 0.97 it measured 6.2%
                   # (eligibility mix) and legitimately stayed in the fan-out

