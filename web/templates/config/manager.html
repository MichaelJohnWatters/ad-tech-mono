<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTech Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: { brand: { DEFAULT: '#4361ee', hover: '#3a56d4' }, surface: { dark: '#1a1a2e', page: '#0f0f1a' } } } }
    }
    </script>
    <script>
    (function(){var s=localStorage.getItem('theme');if(s)document.documentElement.className=s})();
    function toggleTheme(){var h=document.documentElement,n=h.classList.contains('dark')?'light':'dark';h.className=n;localStorage.setItem('theme',n)}
    </script>
</head>
<body class="bg-gray-50 dark:bg-surface-page text-gray-900 dark:text-gray-200 min-h-screen">

<nav class="bg-white dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex items-center gap-4">
    <a href="/" class="font-semibold text-lg text-gray-900 dark:text-white">Ad Tech</a>
    <div class="flex gap-3 text-sm">
        <a href="/dev/publisher-simulator" class="text-gray-500 dark:text-gray-400 hover:text-brand">Simulator</a>
        <a href="/dev/trace-explorer" class="text-gray-500 dark:text-gray-400 hover:text-brand">Traces</a>
        <a href="/dev/console" class="text-brand font-medium">Console</a>
        <a href="/docs" class="text-gray-500 dark:text-gray-400 hover:text-brand">API Docs</a>
    </div>
    <button onclick="toggleTheme()" class="ml-auto text-lg px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800">&#9728;&#65039;</button>
</nav>

<main class="max-w-5xl mx-auto px-5 py-6">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-semibold">AdTech Console</h1>
        <div class="flex gap-2">
            <button onclick="loadData()" class="px-3 py-1.5 text-sm bg-brand text-white rounded hover:bg-brand-hover">Refresh</button>
        </div>
    </div>

    <!-- Top-level tabs. URL hash (#config / #services / etc.) controls which
         pane is visible. Hash sync means deep links work. -->
    <div class="border-b border-gray-200 dark:border-gray-800 mb-4">
        <nav id="tabBar" class="flex gap-1 -mb-px">
            <button data-tab="overview" onclick="selectTab('overview')" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Overview</button>
            <button data-tab="services" onclick="selectTab('services')" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Services</button>
            <button data-tab="pods" onclick="selectTab('pods')" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Pods</button>
            <button data-tab="config" onclick="selectTab('config')" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Config</button>
            <button data-tab="audit" onclick="selectTab('audit')" class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Audit</button>
        </nav>
    </div>

    <!-- Overview tab — platform health summary + recent activity. Empty
         placeholder for now; rendered by renderOverviewTab() once we wire
         it to the metrics + audit endpoints. -->
    <section data-tab-pane="overview" class="tab-pane hidden">
        <div id="overviewContent" class="text-gray-400 text-sm py-12 text-center">
            Overview coming soon — will show platform health, recent alerts,
            recent config changes, and quick-link tiles.
        </div>
    </section>

    <!-- Services tab — services grouped with their pods + action buttons
         (logs/traces/metrics/config) that open Grafana, Jaeger, Prometheus
         with the right filter applied. -->
    <section data-tab-pane="services" class="tab-pane hidden">
        <div id="servicesContent"></div>
    </section>

    <!-- Pods tab — flat per-pod listing. The alerts + pod overview that
         currently live above the config table moves here. -->
    <section data-tab-pane="pods" class="tab-pane hidden">
        <div id="alerts" class="mb-4"></div>
        <div id="podOverview" class="mb-4"></div>
    </section>

    <!-- Config tab — the current key-table workflow. Contains search,
         filter pills (tier + service), and the grouped config rows. -->
    <section data-tab-pane="config" class="tab-pane hidden">
        <!-- Search -->
        <div class="mb-4 flex gap-2">
            <input id="searchInput" type="text" placeholder="Search keys, services, descriptions..."
                oninput="filterConfig()"
                class="flex-1 px-3 py-2 text-sm font-mono bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:border-brand focus:outline-none">
            <button id="searchModeBtn" onclick="toggleSearchMode()"
                class="px-3 py-2 text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 hover:bg-gray-50 dark:hover:bg-gray-800 whitespace-nowrap">
                Fuzzy
            </button>
        </div>

        <!-- Tier filter pills (defaults to Live — operators rarely need to see
             static infra or secrets, and we lock them anyway) -->
        <div id="tierPills" class="flex flex-wrap gap-2 mb-2"></div>

        <!-- Service filter pills -->
        <div id="servicePills" class="flex flex-wrap gap-2 mb-4"></div>

        <!-- Stats bar -->
        <div id="statsBar" class="text-xs text-gray-400 mb-4"></div>

        <!-- Config table -->
        <div id="configTable"></div>
    </section>

    <!-- Audit tab — cross-key change log. Loads /v1/config?history=true
         which returns the platform-wide tail of the audit_log. -->
    <section data-tab-pane="audit" class="tab-pane hidden">
        <div class="flex items-center justify-between mb-3 gap-2">
            <input id="auditSearch" type="text" placeholder="Filter by key / actor / value..."
                oninput="renderAuditTab()"
                class="flex-1 max-w-md px-3 py-2 text-sm font-mono bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:border-brand focus:outline-none">
            <button onclick="loadAudit()" class="px-3 py-1.5 text-sm bg-brand text-white rounded hover:bg-brand-hover">Refresh</button>
        </div>
        <div id="auditContent"></div>
    </section>

    <!-- Toast container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

    <!-- History modal -->
    <div id="historyModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="bg-white dark:bg-surface-dark rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto border border-gray-200 dark:border-gray-800">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Change History</h2>
                <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div id="historyContent"></div>
        </div>
    </div>
</main>

<script>
const GW = '';
let services = [];
let schema = [];
let selectedService = 'all';
let selectedPod = null;
let selectedTier = 'live'; // default: hide static/secret which can't be edited anyway

// Tab navigation. The hash in the URL is the source of truth so deep
// links and refreshes land on the right tab. Default = 'config' since
// that's the most-used view today.
const VALID_TABS = ['overview', 'services', 'pods', 'config', 'audit'];

function selectTab(name) {
    if (!VALID_TABS.includes(name)) name = 'config';
    document.querySelectorAll('.tab-pane').forEach(el => {
        el.classList.toggle('hidden', el.dataset.tabPane !== name);
    });
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === name;
        // Active tab gets a brand-coloured border + bold; others fall back
        // to the muted hover style.
        btn.classList.toggle('border-brand', active);
        btn.classList.toggle('text-brand', active);
        btn.classList.toggle('font-medium', active);
        btn.classList.toggle('border-transparent', !active);
        btn.classList.toggle('text-gray-500', !active);
    });
    if (location.hash !== '#' + name) {
        history.replaceState(null, '', '#' + name);
    }
}

function initTabsFromHash() {
    const hash = location.hash.replace('#', '');
    selectTab(VALID_TABS.includes(hash) ? hash : 'config');
}

window.addEventListener('hashchange', () => {
    initTabsFromHash();
    // Lazy-load Audit data on first visit so the console page-load stays
    // cheap when no one's viewing audit.
    if (location.hash === '#audit' && !auditLoaded) loadAudit();
});
window.addEventListener('DOMContentLoaded', initTabsFromHash);

// Audit log state — fetched on demand.
let auditEntries = [];
let auditLoaded = false;

async function loadAudit() {
    const resp = await fetch(GW + '/v1/config?history=true');
    auditEntries = await resp.json() || [];
    auditLoaded = true;
    renderAuditTab();
}

function renderAuditTab() {
    const el = document.getElementById('auditContent');
    if (!auditLoaded) {
        el.innerHTML = '<div class="text-gray-400 text-sm py-12 text-center">Click Refresh to load audit log.</div>';
        return;
    }
    if (!auditEntries.length) {
        el.innerHTML = '<div class="text-gray-400 text-sm py-12 text-center">No config changes recorded yet.</div>';
        return;
    }
    const q = (document.getElementById('auditSearch').value || '').toLowerCase();
    const filtered = auditEntries.filter(e => {
        if (!q) return true;
        const hay = (e.key + ' ' + (e.actor || '') + ' ' + (e.action || '') + ' ' + (e.old_value || '') + ' ' + (e.new_value || '')).toLowerCase();
        return hay.includes(q);
    });
    el.innerHTML = `
    <div class="text-xs text-gray-400 mb-2">${filtered.length} of ${auditEntries.length} entries</div>
    <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 dark:bg-gray-900/50 text-xs uppercase tracking-wider text-gray-400">
                <tr>
                    <th class="px-3 py-2 text-left">When</th>
                    <th class="px-3 py-2 text-left">Action</th>
                    <th class="px-3 py-2 text-left">Key</th>
                    <th class="px-3 py-2 text-left">Change</th>
                    <th class="px-3 py-2 text-left">Actor</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                ${filtered.map(e => {
                    const ago = timeAgo(e.timestamp);
                    const action = (e.action || 'unknown').replace('config_', '');
                    const actionCls = e.action === 'config_reset'
                        ? 'text-red-500'
                        : e.action === 'config_rollback'
                            ? 'text-amber-500'
                            : e.action === 'config_seed'
                                ? 'text-gray-400'
                                : 'text-emerald-500';
                    return `
                    <tr>
                        <td class="px-3 py-2 text-xs text-gray-500 whitespace-nowrap">${ago}</td>
                        <td class="px-3 py-2 text-xs ${actionCls}">${action}</td>
                        <td class="px-3 py-2 font-mono text-xs">${escHtml(e.key)}</td>
                        <td class="px-3 py-2 text-xs">
                            <span class="text-gray-400 line-through">${escHtml(e.old_value || '∅')}</span>
                            <span class="mx-1">→</span>
                            <span>${escHtml(e.new_value || '∅')}</span>
                        </td>
                        <td class="px-3 py-2 text-xs text-gray-400">${escHtml(e.actor || '-')}</td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    </div>`;
}

// Tier classification: drives badges, lock state, default filter.
// Mirrors pkg/config/schema.go TierLive/TierStatic/TierSecret constants.
const TIER_LIVE = 'live';
const TIER_STATIC = 'static';
const TIER_SECRET = 'secret';
function tierClass(tier) {
    switch (tier) {
        case TIER_LIVE: return 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600';
        case TIER_STATIC: return 'bg-gray-200 dark:bg-gray-700 text-gray-500';
        case TIER_SECRET: return 'bg-amber-100 dark:bg-amber-900/40 text-amber-600';
        default: return 'bg-gray-100 dark:bg-gray-800 text-gray-400';
    }
}
// sourceBadge renders the provenance of a key's effective value as a
// short coloured tag. Helps operators answer "why is this value X?"
// without reading code. Hidden when source is empty (older API response).
function sourceBadge(k) {
    if (!k.source) return '';
    const labels = {
        'postgres-pod':    {text: 'pod row', cls: 'bg-brand/20 text-brand'},
        'postgres-global': {text: 'global row', cls: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500'},
        'env':             {text: 'env var', cls: 'bg-sky-100 dark:bg-sky-900/30 text-sky-500'},
        'default':         {text: 'schema default', cls: 'bg-gray-100 dark:bg-gray-800 text-gray-400'},
    };
    const meta = labels[k.source] || {text: k.source, cls: 'bg-gray-100 dark:bg-gray-800 text-gray-400'};
    const tip = k.source_pod ? `from pod ${k.source_pod}` : k.source;
    return `<span class="px-1.5 py-0.5 text-[10px] rounded ${meta.cls}" title="${tip}">${meta.text}</span>`;
}

function tierTooltip(tier) {
    switch (tier) {
        case TIER_LIVE: return 'Live — runtime-tunable, persists in Postgres';
        case TIER_STATIC: return 'Static — boot-time only, change in YAML/env and redeploy';
        case TIER_SECRET: return 'Secret — sourced from K8s Secret env var; rotate via secret pipeline';
        default: return 'Unknown tier';
    }
}

async function loadData() {
    const [svcResp, schemaResp] = await Promise.all([
        fetch(GW + '/v1/services?grouped=true'),
        fetch(GW + '/v1/config?schema=true')
    ]);
    services = await svcResp.json() || [];
    schema = await schemaResp.json() || [];
    storeOriginalValues();
    renderAlerts();
    renderTierPills();
    renderPills();
    renderPodOverview();
    renderServicesTab();
    renderOverviewTab();
    filterConfig();
    reopenHistories();
}

// Action-link URL builders. All three observability tools live on the
// developer's host (port-forwarded out of K8s by Tilt), so these are
// absolute http://localhost URLs the browser opens in a new tab.
const GRAFANA_URL = 'http://localhost:3000';
const JAEGER_URL = 'http://localhost:16686';
const PROMETHEUS_URL = 'http://localhost:9090';

function grafanaLogsURL(service, pod) {
    const expr = pod ? `{service="${service}", pod="${pod}"}` : `{service="${service}"}`;
    const left = encodeURIComponent(JSON.stringify({
        datasource: 'Loki',
        queries: [{refId: 'A', expr, queryType: 'range'}],
        range: {from: 'now-15m', to: 'now'},
    }));
    return `${GRAFANA_URL}/explore?left=${left}`;
}
function jaegerTracesURL(service) {
    return `${JAEGER_URL}/search?service=${encodeURIComponent(service)}&lookback=15m&limit=50`;
}
function prometheusURL(service) {
    const expr = `rate(adtech_http_requests_total{service="${service}"}[1m])`;
    return `${PROMETHEUS_URL}/graph?g0.expr=${encodeURIComponent(expr)}&g0.tab=0&g0.range_input=15m`;
}

function renderServicesTab() {
    const el = document.getElementById('servicesContent');
    if (!services.length) {
        el.innerHTML = '<div class="text-gray-400 text-sm py-12 text-center">No services registered yet.</div>';
        return;
    }
    el.innerHTML = services.map(g => {
        const runningPods = g.pods.filter(p => p.status === 'running').length;
        const totalPods = g.pods.length;
        const healthClass = runningPods === totalPods
            ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600'
            : runningPods === 0
                ? 'bg-red-100 dark:bg-red-900/30 text-red-500'
                : 'bg-amber-100 dark:bg-amber-900/30 text-amber-600';
        return `
        <div class="mb-6 bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800">
            <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="font-medium">${g.service}</span>
                    <span class="px-1.5 py-0.5 text-[10px] rounded ${healthClass}">${runningPods}/${totalPods} up</span>
                </div>
                <div class="flex gap-1 text-xs">
                    <a href="${grafanaLogsURL(g.service)}" target="_blank" class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">logs</a>
                    <a href="${jaegerTracesURL(g.service)}" target="_blank" class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">traces</a>
                    <a href="${prometheusURL(g.service)}" target="_blank" class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">metrics</a>
                    <button onclick="jumpToConfig('${g.service}')" class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">config</button>
                </div>
            </div>
            <div class="divide-y divide-gray-100 dark:divide-gray-800">
                ${g.pods.map(p => {
                    const ago = timeAgo(p.last_ping_at);
                    const podClass = p.status === 'running' ? 'text-emerald-500' : 'text-red-500';
                    return `
                    <div class="px-4 py-2 flex items-center justify-between gap-2 text-sm">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="${podClass} text-xs">●</span>
                            <span class="font-mono truncate">${p.pod_id}</span>
                            <span class="text-xs text-gray-400">v${p.version}</span>
                            <span class="text-xs text-gray-400">ping ${ago}</span>
                        </div>
                        <div class="flex gap-1 text-xs flex-shrink-0">
                            <a href="${grafanaLogsURL(g.service, p.pod_id)}" target="_blank" class="px-2 py-0.5 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">logs</a>
                            <button onclick="jumpToConfigForPod('${g.service}','${p.pod_id}')" class="px-2 py-0.5 rounded border border-gray-200 dark:border-gray-700 hover:border-brand hover:text-brand">config</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }).join('');
}

function jumpToConfig(service) {
    selectedService = service;
    selectedPod = null;
    renderPills();
    renderPodOverview();
    filterConfig();
    selectTab('config');
}
function jumpToConfigForPod(service, podID) {
    selectedService = service;
    selectedPod = podID;
    renderPills();
    renderPodOverview();
    filterConfig();
    selectTab('config');
}

function renderOverviewTab() {
    const el = document.getElementById('overviewContent');
    if (!services.length) {
        el.innerHTML = '<div class="text-sm py-12 text-center">No services registered.</div>';
        return;
    }
    const totalPods = services.reduce((n, g) => n + g.pods.length, 0);
    const runningPods = services.reduce((n, g) => n + g.pods.filter(p => p.status === 'running').length, 0);
    const stalePods = services.flatMap(g => g.pods).filter(p =>
        p.status === 'running' && (Date.now() - new Date(p.last_ping_at).getTime() > 2 * 60 * 1000));
    const orphans = schema.filter(k => k.status === 'orphaned').length;
    el.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-left">
        <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4">
            <div class="text-xs uppercase tracking-wider text-gray-400 mb-1">Services</div>
            <div class="text-2xl font-semibold">${services.length}</div>
        </div>
        <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4">
            <div class="text-xs uppercase tracking-wider text-gray-400 mb-1">Pods up</div>
            <div class="text-2xl font-semibold ${runningPods === totalPods ? 'text-emerald-500' : 'text-amber-500'}">${runningPods}/${totalPods}</div>
        </div>
        <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4">
            <div class="text-xs uppercase tracking-wider text-gray-400 mb-1">Stale (&gt;2m)</div>
            <div class="text-2xl font-semibold ${stalePods.length ? 'text-amber-500' : ''}">${stalePods.length}</div>
        </div>
        <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4">
            <div class="text-xs uppercase tracking-wider text-gray-400 mb-1">Orphan keys</div>
            <div class="text-2xl font-semibold ${orphans ? 'text-red-500' : ''}">${orphans}</div>
        </div>
    </div>
    <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3">
        <a href="${GRAFANA_URL}" target="_blank" class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4 hover:border-brand transition-colors">
            <div class="font-medium">Grafana</div>
            <div class="text-xs text-gray-400">logs, metrics, dashboards</div>
        </a>
        <a href="${JAEGER_URL}" target="_blank" class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4 hover:border-brand transition-colors">
            <div class="font-medium">Jaeger</div>
            <div class="text-xs text-gray-400">distributed traces</div>
        </a>
        <a href="${PROMETHEUS_URL}" target="_blank" class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 p-4 hover:border-brand transition-colors">
            <div class="font-medium">Prometheus</div>
            <div class="text-xs text-gray-400">raw metrics</div>
        </a>
    </div>`;
}

function renderTierPills() {
    const el = document.getElementById('tierPills');
    const tiers = [
        {key: 'live', label: 'Live', desc: 'runtime-tunable'},
        {key: 'static', label: 'Static', desc: 'redeploy to change'},
        {key: 'secret', label: 'Secret', desc: 'env-only, redacted'},
        {key: 'all', label: 'All', desc: 'show every key'},
    ];
    el.innerHTML = tiers.map(t => {
        const active = selectedTier === t.key;
        const count = t.key === 'all' ? schema.length : schema.filter(e => (e.Tier || 'live') === t.key).length;
        const cls = active
            ? 'bg-brand text-white border-brand'
            : 'bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:border-brand';
        return `<button onclick="selectTier('${t.key}')" title="${t.desc}"
            class="px-2.5 py-1 text-xs rounded-full border ${cls} transition-colors">
            ${t.label} <span class="text-[10px] opacity-70">${count}</span>
        </button>`;
    }).join('');
}

function selectTier(t) {
    selectedTier = t;
    renderTierPills();
    filterConfig();
}

function renderPills() {
    const svcNames = [...new Set(schema.map(e => e.Service))].sort();
    const el = document.getElementById('servicePills');
    el.innerHTML = `
        <button onclick="selectService('all')"
            class="px-3 py-1 text-xs rounded-full transition-colors ${selectedService === 'all' ? 'bg-brand text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}">
            All (${schema.length})
        </button>
        ${svcNames.map(s => {
            const count = schema.filter(e => e.Service === s).length;
            const group = services.find(g => g.service === s);
            const podCount = group ? group.pods.length : 0;
            const runningCount = group ? group.pods.filter(p => p.status === 'running').length : 0;
            const dot = runningCount > 0 ? '●' : '○';
            return `<button onclick="selectService('${s}')"
                class="px-3 py-1 text-xs rounded-full transition-colors ${selectedService === s ? 'bg-brand text-white' : 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}">
                ${dot} ${s} (${count} keys, ${podCount} pod${podCount !== 1 ? 's' : ''})
            </button>`;
        }).join('')}
    `;
}

function renderPodOverview() {
    const el = document.getElementById('podOverview');
    if (!services.length) { el.innerHTML = ''; return; }

    const filtered = selectedService === 'all' ? services : services.filter(g => g.service === selectedService);
    if (!filtered.length) { el.innerHTML = ''; return; }

    el.innerHTML = `
        <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-2">Running Pods</h2>
        <div class="bg-white dark:bg-surface-dark rounded-lg border border-gray-200 dark:border-gray-800 divide-y divide-gray-100 dark:divide-gray-800 mb-6">
            ${filtered.map(g => `

                    <div class="font-medium text-sm mb-1">${g.service} <span class="text-xs text-gray-400">(${g.pods.length} pod${g.pods.length !== 1 ? 's' : ''})</span></div>
                    <div class="flex flex-wrap gap-2">

                            const ago = timeAgo(p.last_ping_at);

function renderAlerts() {
    const el = document.getElementById('alerts');
    const allPods = services.flatMap(g => g.pods || []);
    const staleTimeout = 120000; // 2 minutes

    const stalePods = allPods.filter(p =>
        p.status === 'running' && (Date.now() - new Date(p.last_ping_at).getTime()) > staleTimeout
    );
    const stoppedPods = allPods.filter(p => p.status === 'stopped');
    const orphanedKeys = schema.filter(k => k.status === 'orphaned');

    if (stalePods.length === 0 && stoppedPods.length === 0 && orphanedKeys.length === 0) {
        el.innerHTML = '';
        return;
    }

    el.innerHTML = `
        ${stalePods.length > 0 ? `
            <div class="px-4 py-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-sm mb-2">
                <div class="text-red-500 font-medium mb-1">&#9888; ${stalePods.length} stale pod${stalePods.length > 1 ? 's' : ''} (not polling)</div>
                <div class="flex flex-wrap gap-1">
                    ${stalePods.map(p => `<button onclick="viewPodConfig('${p.service}','${p.pod_id}')" class="px-2 py-0.5 rounded bg-red-100 dark:bg-red-900/40 text-red-500 text-xs font-mono hover:ring-1 hover:ring-red-400 cursor-pointer">${p.service}/${p.pod_id} (${timeAgo(p.last_ping_at)})</button>`).join('')}
                </div>
            </div>
        ` : ''}
        ${stoppedPods.length > 0 ? `
            <div class="px-4 py-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-sm mb-2">
                <div class="text-amber-500 font-medium mb-1">&#9724; ${stoppedPods.length} stopped pod${stoppedPods.length > 1 ? 's' : ''}</div>
                <div class="flex flex-wrap gap-1">
                    ${stoppedPods.map(p => `<button onclick="viewPodConfig('${p.service}','${p.pod_id}')" class="px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900/40 text-amber-500 text-xs font-mono hover:ring-1 hover:ring-amber-400 cursor-pointer">${p.service}/${p.pod_id}</button>`).join('')}
                </div>
            </div>
        ` : ''}
        ${orphanedKeys.length > 0 ? `
            <div class="px-4 py-3 rounded-lg bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 text-sm mb-2">
                <div class="text-purple-500 font-medium">&#128268; ${orphanedKeys.length} orphaned config key${orphanedKeys.length > 1 ? 's' : ''} from previous versions</div>
            </div>
        ` : ''}
    `;
}

function viewPodConfig(service, podId) {
    // Show pod-specific overrides alongside service config
    selectedService = service;
    selectedPod = podId;
    renderPills();
    renderPodOverview();
    filterConfig();
}

function selectService(name) {
    selectedService = name;
    selectedPod = null;
    renderPills();
    renderPodOverview();
    filterConfig();
}

let searchMode = 'fuzzy'; // 'fuzzy' or 'strict'

function toggleSearchMode() {
    searchMode = searchMode === 'fuzzy' ? 'strict' : 'fuzzy';
    document.getElementById('searchModeBtn').textContent = searchMode === 'fuzzy' ? 'Fuzzy' : 'Strict';
    filterConfig();
}

function matchSearch(text, query) {
    if (!query) return true;
    if (searchMode === 'strict') {
        return text.toLowerCase().includes(query.toLowerCase());
    }
    // Fuzzy: all chars of query appear in order
    const lower = text.toLowerCase();
    const q = query.toLowerCase();
    let qi = 0;
    for (let i = 0; i < lower.length && qi < q.length; i++) {
        if (lower[i] === q[qi]) qi++;
    }
    return qi === q.length;
}

function filterConfig() {
    const query = document.getElementById('searchInput').value;
    let filtered = schema;

    // Tier filter — applied first because "all" still has a tier. Missing
    // Tier field on a key (e.g. orphan from older schema) defaults to live.
    if (selectedTier !== 'all') {
        filtered = filtered.filter(e => (e.Tier || 'live') === selectedTier);
    }

    // Service/pod filter: show keys this service uses (service-specific + platform)
    if (selectedService !== 'all') {
        const group = services.find(g => g.service === selectedService);
        // Use the pod's config_keys if available (includes platform keys)
        const pod = selectedPod
            ? group?.pods?.find(p => p.pod_id === selectedPod)
            : group?.pods?.[0]; // any pod has the same key list
        if (pod?.config_keys?.length) {
            filtered = filtered.filter(e => pod.config_keys.includes(e.Key));
        } else {
            // Fallback: show service + platform keys
            filtered = filtered.filter(e => e.Service === selectedService || e.Service === 'platform');
        }
    }

    // Fuzzy search across key, description, service, value, type
    if (query) {
        filtered = filtered.filter(e =>
            matchSearch(e.Key + ' ' + e.Description + ' ' + e.Service + ' ' + e.current_value + ' ' + e.Type, query)
        );
    }

    document.getElementById('statsBar').innerHTML =
        `Showing ${filtered.length} of ${schema.length} keys` +
        (query ? ` matching "${query}"` : '') +
        (selectedService !== 'all' ? ` in ${selectedService}` : '') +
        (selectedPod ? ` <span class="text-brand font-medium">pod: ${selectedPod.substring(0, 20)}</span> <button onclick="selectedPod=null;filterConfig();renderPodOverview()" class="text-xs text-gray-400 hover:text-red-400">✕ clear</button>` : '');

    renderTable(filtered);
}

                            </div>

async function saveKey(key, forceAllPods) {
    const input = document.getElementById('input-' + cssId(key));
    const value = input.value != null ? input.value : input.selectedOptions?.[0]?.value;
    const original = originalValues[key] || '';
    const checkboxes = document.querySelectorAll(`.pod-checkbox[data-key="${key}"]`);
    const hasSubRows = checkboxes.length > 0;

    if (value === original && !hasSubRows && !selectedPod) {
        toast('No changes to save', 'info');
        return;
    }

    // Single-pod scope: when the user has drilled into a pod, Save writes
    // only that pod's row. Save All from the same view fans out to every
    // running pod of the service.
    if (selectedPod && !forceAllPods) {
        const resp = await putConfig(key, value, selectedPod);
        if (resp.ok) {
            clearDirty(key);
            toast(`${key} → "${value}" (pod ${selectedPod.substring(0, 15)})`, 'success');
        } else {
            const r = await resp.json();
            toast(`Failed: ${r.error || 'unknown'}`, 'error');
        }
    } else {
        // Service-scope view: either fan out to checkbox-selected pods, or
        // (when no checkboxes / Save All) target every running pod of the
        // current service. "Running" = service_registry.status='running'
        // with a fresh last_ping_at (the backend tracks this).
        const checked = [...checkboxes].filter(cb => cb.checked);
        const unchecked = [...checkboxes].filter(cb => !cb.checked);

        let targets;
        if (unchecked.length > 0 && checkboxes.length > 0) {
            targets = checked.map(cb => cb.dataset.pod);
        } else {
            targets = runningPodsForKey(key);
        }

        if (targets.length === 0) {
            toast('No running pods to update', 'error');
            return;
        }

        const results = await Promise.all(targets.map(pod => putConfig(key, value, pod)));
        const okCount = results.filter(r => r.ok).length;
        const failCount = results.length - okCount;
        if (failCount === 0) {
            toast(`${key} → "${value}" (${okCount} pod${okCount !== 1 ? 's' : ''})`, 'success');
        } else {
            toast(`${okCount} ok, ${failCount} failed`, 'error');
        }
        clearDirty(key);
    }

    setTimeout(() => loadData(), 500);
}

// putConfig posts to the gateway's /v1/config endpoint with the new
// per-pod write shape. Empty podID is allowed (writes the legacy global
// row); the UI never uses that path today but kept for backward compat.
async function putConfig(key, value, podID) {
    return fetch(GW + '/v1/config', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key, value, pod_id: podID || ''}),
    });
}

// runningPodsForKey returns the pod_ids that are currently RUNNING for
// the service that owns this key. "Save All" fans out to these only —
// dead pods are skipped (their rows linger but we don't update them).
function runningPodsForKey(key) {
    const entry = schema.find(e => e.Key === key);
    if (!entry) return [];
    const svcName = entry.Service === 'platform' ? selectedService : entry.Service;
    // Platform keys are owned by no single service — fall back to every
    // running pod across the whole registry.
    const groups = svcName && svcName !== 'all'
        ? services.filter(g => g.service === svcName)
        : services;
    const pods = [];
    for (const g of groups) {
        for (const p of (g.pods || [])) {
            if (p.status === 'running') pods.push(p.pod_id);
        }
    }
    return pods;
}

async function rollbackKey(key) {
    if (selectedPod) {
        // Undo for specific pod
        const podKey = podScopedKey(key, selectedPod);
        const resp = await fetch(GW + '/v1/config?rollback=' + encodeURIComponent(podKey));
        if (resp.ok) {
            toast(`${key} reverted for pod ${selectedPod}`, 'info');
        } else {
            // No pod override to undo, try service-level
            const resp2 = await fetch(GW + '/v1/config?rollback=' + encodeURIComponent(key));
            if (resp2.ok) toast(`${key} reverted (service-level)`, 'info');
            else toast('No history to undo', 'error');
        }
    } else {
        // Check which pods are ticked
        const checkboxes = document.querySelectorAll(`.pod-checkbox[data-key="${key}"]`);
        const unchecked = [...checkboxes].filter(cb => !cb.checked);

        if (unchecked.length > 0 && checkboxes.length > 0) {
            // Some unticked: only undo for checked pods
            const checked = [...checkboxes].filter(cb => cb.checked);
            if (checked.length === 0) {
                toast('No pods selected to undo', 'info');
                return;
            }
            for (const cb of checked) {
                const podKey = podScopedKey(key, cb.dataset.pod);
                await fetch(GW + '/v1/config?rollback=' + encodeURIComponent(podKey));
            }
            toast(`${key} reverted for ${checked.length} pod(s)`, 'info');
        } else {
            // All ticked or no sub-rows: undo service-level
            const resp = await fetch(GW + '/v1/config?rollback=' + encodeURIComponent(key));
            if (resp.ok) toast(`${key} reverted (all pods)`, 'info');
            else toast('No history to undo', 'error');
        }
    }
    clearDirty(key);
    loadData();
}

async function toggleKeyHistory(key) {
    const el = document.getElementById('history-' + cssId(key));
    if (!el) return;

    if (!el.classList.contains('hidden')) {
        el.classList.add('hidden');
        openHistories.delete(key);
        return;
    }
    openHistories.add(key);

    el.innerHTML = '<span class="text-gray-400">Loading...</span>';
    el.classList.remove('hidden');

    // Fetch service-level history
    const resp = await fetch(GW + '/v1/config?history=true&key=' + encodeURIComponent(key));
    let history = await resp.json() || [];

    // Also fetch pod-specific history if pods exist for this service
    const svc = schema.find(s => s.Key === key)?.Service;
    const group = services.find(g => g.service === svc);
    if (group?.pods?.length > 0) {
        for (const p of group.pods) {
            const podKey = podScopedKey(key, p.pod_id);
            const podResp = await fetch(GW + '/v1/config?history=true&key=' + encodeURIComponent(podKey));
            const podHistory = await podResp.json() || [];
            // Tag each entry with the pod
            podHistory.forEach(h => { h._pod = p.pod_id; h.key = podKey; });
            history = history.concat(podHistory);
        }
    }

    // Sort all entries by timestamp descending
    history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    if (history.length === 0) {
        el.innerHTML = '<span class="text-gray-400">No changes recorded</span>';
        return;
    }

    // Get unique targets for filter pills
    const targets = ['all', ...new Set(history.map(h => h._pod || 'all pods'))];

    el.innerHTML = `
        <div class="flex gap-1 mb-2 flex-wrap">
            ${targets.map(t => `<button onclick="filterHistory('${cssId(key)}','${t}')"
                class="history-filter-${cssId(key)} px-2 py-0.5 text-[10px] rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-brand/20 hover:text-brand"
                data-target="${t}">${t}</button>`).join('')}
        </div>
        <table class="w-full text-xs">
            <thead><tr class="text-gray-400">
                <td class="pr-2 py-1">ID</td>
                <td class="pr-2 py-1">Target</td>
                <td class="pr-2 py-1">Action</td>
                <td class="pr-2 py-1">When</td>
                <td class="pr-2 py-1">Old</td>
                <td class="pr-2 py-1">New</td>
                <td class="py-1">By</td>
            </tr></thead>
            <tbody>
                ${history.map(h => {
                    const target = h._pod || 'all pods';
                    return `<tr class="border-t border-gray-100 dark:border-gray-800 history-row-${cssId(key)}" data-target="${target}">
                    <td class="pr-2 py-1 text-gray-400 font-mono" title="${h.id}">${(h.id || '').substring(0, 8)}</td>
                    <td class="pr-2 py-1">${h._pod
                        ? `<span class="px-1 py-0.5 text-[9px] rounded bg-brand/20 text-brand font-mono">${h._pod}</span>`
                        : '<span class="px-1 py-0.5 text-[9px] rounded bg-gray-100 dark:bg-gray-800 text-gray-500">all pods</span>'
                    }</td>
                    <td class="pr-2 py-1">${actionBadge(h.action)}</td>
                    <td class="pr-2 py-1 text-gray-400 whitespace-nowrap">${new Date(h.timestamp).toLocaleString()}</td>
                    <td class="pr-2 py-1 font-mono text-red-400">${escHtml(h.old_value || '(empty)')}</td>
                    <td class="pr-2 py-1 font-mono text-green-400">${escHtml(h.new_value)}</td>
                    <td class="py-1 text-gray-500">${h.actor}</td>
                </tr>`;}).join('')}
            </tbody>
        </table>
    `;
}

function reopenHistories() {
    openHistories.forEach(key => {
        const el = document.getElementById('history-' + cssId(key));
        if (el) {
            el.classList.add('hidden'); // reset so toggleKeyHistory fetches fresh
            toggleKeyHistory(key);
        }
    });
}

async function resetKey(key) {
    const entry = schema.find(e => e.Key === key);
    const defaultVal = entry ? entry.Default : '';

    if (selectedPod) {
        // Reset pod override by deleting the pod-scoped key
        const podKey = podScopedKey(key, selectedPod);
        const resp = await fetch(GW + '/v1/config', { method: 'DELETE', headers: {'Content-Type':'application/json'} });
        // Actually just reset the pod key via the reset endpoint
        await fetch(GW + '/v1/config?reset=' + encodeURIComponent(podKey));
        toast(`${key} reset for pod ${selectedPod}`, 'info');
    } else {
        const checkboxes = document.querySelectorAll(`.pod-checkbox[data-key="${key}"]`);
        const unchecked = [...checkboxes].filter(cb => !cb.checked);

        if (unchecked.length > 0 && checkboxes.length > 0) {
            const checked = [...checkboxes].filter(cb => cb.checked);
            if (checked.length === 0) {
                toast('No pods selected to reset', 'info');
                return;
            }
            for (const cb of checked) {
                const podKey = podScopedKey(key, cb.dataset.pod);
                await fetch(GW + '/v1/config?reset=' + encodeURIComponent(podKey));
            }
            toast(`${key} reset for ${checked.length} pod(s)`, 'info');
        } else {
            const resp = await fetch(GW + '/v1/config?reset=' + encodeURIComponent(key));
            if (resp.ok) {
                toast(`${key} reset to default: ${defaultVal}`, 'info');
            } else {
                const r = await resp.json();
                toast(r.error || 'Reset failed', 'error');
            }
        }
    }
    clearDirty(key);
    loadData();
}

async function showHistory() {
    const resp = await fetch(GW + '/v1/config?history=true');
    const history = (await resp.json() || []).reverse();

    document.getElementById('historyContent').innerHTML = history.length === 0
        ? '<div class="py-4 text-center text-gray-400">No changes yet</div>'
        : `<div class="divide-y divide-gray-100 dark:divide-gray-800 text-sm">
            ${history.map(h => `
                <div class="py-2">
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-xs">${h.key}</span>
                        <span class="text-[10px] text-gray-400">${h.source} &middot; ${new Date(h.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="text-xs mt-1 font-mono">
                        <span class="text-red-400">${escHtml(h.old_value || '(empty)')}</span>
                        <span class="text-gray-500 mx-1">&rarr;</span>
                        <span class="text-green-400">${escHtml(h.new_value)}</span>
                    </div>
                </div>
            `).join('')}
        </div>`;
    document.getElementById('historyModal').classList.remove('hidden');
}

// Type-appropriate input controls
function inputForType(k, locked) {
    const id = 'input-' + cssId(k.Key);
    const onChange = locked ? '' : `markDirty('${k.Key}')`;
    const onEnter = locked ? '' : `onkeydown="if(event.key==='Enter')saveKey('${k.Key}')"`;
    // Static-tier rows still show the value (so operators can see what the
    // pod is using) but the control is disabled — visually greyed and not
    // tab-stoppable. Secret-tier rows skip this function entirely.
    const disabled = locked ? 'disabled' : '';
    const lockedClass = locked ? 'cursor-not-allowed bg-gray-100 dark:bg-gray-800' : 'bg-gray-50 dark:bg-gray-900';

    switch (k.Type) {
    case 'bool':
        return `<select id="${id}" onchange="${onChange}" ${disabled}
            class="px-2 py-1 text-sm font-mono ${lockedClass} border border-gray-200 dark:border-gray-700 rounded focus:border-brand focus:outline-none">
            <option value="true" ${k.current_value === 'true' ? 'selected' : ''}>true</option>
            <option value="false" ${k.current_value === 'false' ? 'selected' : ''}>false</option>
        </select>`;
    case 'int':
        return `<input id="${id}" type="number" step="1" value="${escHtml(k.current_value)}" ${disabled}
            oninput="${onChange}" ${onEnter}
            class="w-32 px-2 py-1 text-sm font-mono ${lockedClass} border border-gray-200 dark:border-gray-700 rounded focus:border-brand focus:outline-none">`;
    case 'float':
        return `<input id="${id}" type="number" step="0.01" value="${escHtml(k.current_value)}" ${disabled}
            oninput="${onChange}" ${onEnter}
            class="w-32 px-2 py-1 text-sm font-mono ${lockedClass} border border-gray-200 dark:border-gray-700 rounded focus:border-brand focus:outline-none">`;
    case 'duration':
        return `<input id="${id}" type="text" value="${escHtml(k.current_value)}" placeholder="e.g. 100ms, 5s, 1m" ${disabled}
            oninput="${onChange}" ${onEnter}
            class="w-40 px-2 py-1 text-sm font-mono ${lockedClass} border border-gray-200 dark:border-gray-700 rounded focus:border-brand focus:outline-none">`;
    default:
        return `<input id="${id}" type="text" value="${escHtml(k.current_value)}" ${disabled}
            oninput="${onChange}" ${onEnter}
            class="flex-1 px-2 py-1 text-sm font-mono ${lockedClass} border border-gray-200 dark:border-gray-700 rounded focus:border-brand focus:outline-none">`;
    }
}

// Dirty tracking - only show unsaved if value differs from what's in the DB
const originalValues = {};
const dirtyKeys = new Set();
const openHistories = new Set();
const uncheckedPods = JSON.parse(localStorage.getItem('configUncheckedPods') || '{}'); // {key: [podId, ...]}

function storeOriginalValues() {
    schema.forEach(k => { originalValues[k.Key] = k.current_value; });
}

function markDirty(key) {
    const input = document.getElementById('input-' + cssId(key));
    if (!input) return;
    const current = input.value || input.selectedOptions?.[0]?.value || '';
    const original = originalValues[key] || '';
    const el = document.getElementById('dirty-' + cssId(key));
    const row = document.getElementById('row-' + cssId(key));

    if (current !== original) {
        if (el) el.classList.remove('hidden');
        if (row) row.classList.add('border-l-2', 'border-l-amber-400');
        dirtyKeys.add(key);
    } else {
        if (el) el.classList.add('hidden');
        if (row) row.classList.remove('border-l-2', 'border-l-amber-400');
        dirtyKeys.delete(key);
    }
}

function clearDirty(key) {
    const el = document.getElementById('dirty-' + cssId(key));
    const row = document.getElementById('row-' + cssId(key));
    if (el) el.classList.add('hidden');
    if (row) row.classList.remove('border-l-2', 'border-l-amber-400');
    dirtyKeys.delete(key);
}

// Toast notifications
function toast(message, type) {
    const container = document.getElementById('toastContainer');
    const t = document.createElement('div');
    const colors = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        info: 'bg-brand'
    };
    t.className = `${colors[type] || colors.info} text-white text-sm px-4 py-2 rounded-lg shadow-lg transition-all transform translate-y-2 opacity-0`;
    t.textContent = message;
    container.appendChild(t);
    requestAnimationFrame(() => {
        t.classList.remove('translate-y-2', 'opacity-0');
    });
    setTimeout(() => {
        t.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => t.remove(), 300);
    }, 3000);
}

function renderPodSubRows(k, svc) {
    // Find all pods for this service
    const group = services.find(g => g.service === svc);
    if (!group || !group.pods || group.pods.length <= 1) return '';

    const pods = group.pods;
    return `
        <div class="mt-2 border-t border-gray-100 dark:border-gray-800 pt-2">
            <div class="text-[10px] text-gray-400 mb-1">Per-pod values (${pods.length} pods)</div>
            ${pods.map(p => {
                const hasKey = p.config_keys?.includes(k.Key);
                const podKey = podScopedKey(k.Key, p.pod_id);
                const podOverride = schema.find(s => s.Key === podKey);
                const effectiveValue = podOverride ? podOverride.current_value : k.current_value;
                const isOverridden = !!podOverride;

                if (!hasKey) {
                    return `<div class="flex items-center gap-2 py-0.5 text-xs text-gray-400 italic">
                        <span class="w-2 h-2 rounded-full ${p.status === 'running' ? 'bg-green-500' : 'bg-red-400'}"></span>
                        <span class="font-mono">${p.pod_id}</span>
                        <span>does not use this key</span>
                    </div>`;
                }

                const isUnchecked = (uncheckedPods[k.Key] || []).includes(p.pod_id);
                return `<div class="flex items-center gap-2 py-0.5 text-xs">
                    <input type="checkbox" ${isUnchecked ? '' : 'checked'} data-pod="${p.pod_id}" data-key="${k.Key}"
                        onchange="togglePodCheck('${k.Key}','${p.pod_id}', this.checked)"
                        class="pod-checkbox rounded border-gray-300 dark:border-gray-600 text-brand focus:ring-brand w-3 h-3"
                        title="Include ${p.pod_id} in save">
                    <span class="w-2 h-2 rounded-full ${p.status === 'running' ? 'bg-green-500' : 'bg-red-400'}"></span>
                    <button onclick="viewPodConfig('${svc}','${p.pod_id}')" class="font-mono text-brand hover:underline">${p.pod_id}</button>
                    <span class="font-mono ${isOverridden ? 'text-brand font-medium' : 'text-gray-500'}">${escHtml(effectiveValue)}</span>
                    ${isOverridden ? '<span class="px-1 py-0.5 text-[9px] rounded bg-brand/20 text-brand">override</span>' : ''}
                </div>`;
            }).join('')}
        </div>
    `;
}

function filterHistory(keyCssId, target) {
    // Highlight selected filter
    document.querySelectorAll(`.history-filter-${keyCssId}`).forEach(btn => {
        if (btn.dataset.target === target) {
            btn.classList.add('bg-brand', 'text-white');
            btn.classList.remove('bg-gray-100', 'dark:bg-gray-800', 'text-gray-500');
        } else {
            btn.classList.remove('bg-brand', 'text-white');
            btn.classList.add('bg-gray-100', 'dark:bg-gray-800', 'text-gray-500');
        }
    });

    // Show/hide rows - "all pods" entries always show (they affect every pod)
    document.querySelectorAll(`.history-row-${keyCssId}`).forEach(row => {
        if (target === 'all' || row.dataset.target === target || row.dataset.target === 'all pods') {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
}

function togglePodCheck(key, podId, checked) {
    if (!uncheckedPods[key]) uncheckedPods[key] = [];
    if (checked) {
        uncheckedPods[key] = uncheckedPods[key].filter(id => id !== podId);
        if (uncheckedPods[key].length === 0) delete uncheckedPods[key];
    } else {
        if (!uncheckedPods[key].includes(podId)) uncheckedPods[key].push(podId);
    }
    localStorage.setItem('configUncheckedPods', JSON.stringify(uncheckedPods));
}

function podScopedKey(key, podId) {
    const dotIdx = key.indexOf('.');
    if (dotIdx > -1) {
        return key.substring(0, dotIdx) + '.pod-' + podId + key.substring(dotIdx);
    }
    return 'pod-' + podId + '.' + key;
}

function timeAgo(ts) {
    if (!ts) return 'never';
    const ms = Date.now() - new Date(ts).getTime();
    if (ms < 1000) return 'just now';
    if (ms < 60000) return Math.floor(ms / 1000) + 's ago';
    if (ms < 3600000) return Math.floor(ms / 60000) + 'm ago';
    if (ms < 86400000) return Math.floor(ms / 3600000) + 'h ago';
    return Math.floor(ms / 86400000) + 'd ago';
}

function actionBadge(action) {
    const map = {
        'config_update':   '<span class="px-1.5 py-0.5 text-[10px] rounded bg-blue-100 dark:bg-blue-900/30 text-blue-500">update</span>',
        'config_rollback': '<span class="px-1.5 py-0.5 text-[10px] rounded bg-amber-100 dark:bg-amber-900/30 text-amber-500">undo</span>',
        'config_reset':    '<span class="px-1.5 py-0.5 text-[10px] rounded bg-purple-100 dark:bg-purple-900/30 text-purple-500">reset</span>',
    };
    return map[action] || `<span class="px-1.5 py-0.5 text-[10px] rounded bg-gray-100 dark:bg-gray-800 text-gray-500">${action || '?'}</span>`;
}
function cssId(key) { return key.replace(/[.\s]/g, '-'); }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadData();
</script>
