<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>adtech.js SDK smoke test</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.lede { color: #666; margin-top: 0; font-size: 14px; }
  pre { background: #f5f5f7; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
  #ad-slot-1 { margin: 24px 0; position: relative; min-height: 250px; }
  button { padding: 8px 16px; background: #4361ee; color: white; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
  <h1>adtech.js SDK — pubad route smoke test</h1>
  <p class="lede">Mimics a real publisher embed: load the SDK, init, request an ad. Click the ad to verify the click flow.</p>

  <button id="load">Request ad</button>

  <div id="ad-slot-1"></div>

  <h2 style="font-size: 14px;">SDK state</h2>
  <pre id="state">(not initialised)</pre>

  <script src="/static/adtech.js"></script>
  <script>
    adtech.init({ publisherId: 'pub-daily-news', siteId: 'demo-site', debug: true });
    document.getElementById('state').textContent = JSON.stringify(adtech.getState(), null, 2);

    document.getElementById('load').addEventListener('click', function() {
      adtech.requestAd({ placementId: 'pl-sport-mpu', elementId: 'ad-slot-1' });
    });
  </script>
</body>
</html>
