      summary: List team members
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "List of team members (id, email, name, role, status)" } }
    post:
      tags: [Team]
      summary: Invite a team member (returns a one-time temp password)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
