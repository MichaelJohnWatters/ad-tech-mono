          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string }
                name: { type: string }
                role: { type: string, enum: [owner, manager, analyst, finance, viewer, ad_ops], default: viewer }
      responses: { "201": { description: "Created; response includes temp_password (shown once)" } }

  # ============================================================
  # Operator API - Secrets (X-API-Key)
  # ============================================================
  /v1/api/secrets:
    get:
      tags: [Secrets]
      summary: List secrets (values previewed only)
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: include_revoked, in: query, schema: { type: string } }
      responses: { "200": { description: List; value_preview only, never the full value } }
    post:
      tags: [Secrets]
      summary: Create/store a secret (full value returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, purpose]
              properties:
                name: { type: string }
                purpose: { type: string }
                owner: { type: string, default: platform }
                status: { type: string, enum: [active, rotating, revoked], default: active }
                value: { type: string, description: auto-generated when absent }
      responses: { "201": { description: "Created; response value shown ONCE" } }
  /v1/api/secrets/{id}:
    patch:
      tags: [Secrets]
      summary: Update secret status (rotate/revoke)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, rotating, revoked] } } } } }
      responses: { "204": { description: Updated } }
    delete:
      tags: [Secrets]
      summary: Delete a revoked secret
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Deleted } }

  # ============================================================
  # Public API - Webhooks
  # ============================================================
  /v1/api/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "List of webhooks (id, url, events, status)" } }
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription (returns HMAC secret once)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string }
                events: { type: array, items: { type: string } }
      responses: { "201": { description: "Created; response includes secret (shown once)" } }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted } }

  # ============================================================
  # Staff API - Audit / Moderation / Quality / Fraud
  # ============================================================
  /v1/api/audit:
    get:
      tags: [Audit]
      summary: Query the audit log (staff)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: account_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses: { "200": { description: List of audit entries } }
  /v1/api/audiences:
    get:
      tags: [Audiences]
      summary: List the account's audience segments (member counts + match rate)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "[{ id, name, type, visibility, members, match_rate?, last_upload_at?, updated_at, taxonomy_id?, taxonomy_path?, data_fee_micros? }] — taxonomy_* is the optional IAB Audience Taxonomy label; data_fee_micros the optional data fee (CPM, micro-dollars)" } }
    post:
      tags: [Audiences]
      summary: Upload a segment + members (JSON ids, or multipart CSV/TSV)
      description: >-
        Binds to the authenticated account. Every upload is staged to object
        storage and recorded as one audience_ingest_jobs row (ADR 0007). Small,
        due-now files are processed INLINE by the shared ingest processor and
        return 200 with the segment match rate (fraction of ids resolvable via
        the identity graph). Larger files (above gateway.ingest_inline_max_rows)
        return 202 with a job id — matching runs asynchronously in the pipeline
        ingest worker; poll GET /v1/api/audiences/ingest/{id}.
        Validation is STRICT/atomic (ADR 0008): any failing row — validation OR
        unparsable — rejects the WHOLE file with 422 + a reason (tunable via
        pipeline.ingest_max_reject_pct). Headers are lowercased (case-insensitive).
        Files may be PGP-encrypted to the platform public key (GET
        /v1/api/audiences/pgp-key) — decrypted on ingest. mapping_id applies a
        saved custom field mapping (connector). run_at holds the file until a
        future time (licensing/embargo). additional_emails add recipients to the
        completion email (the uploader is always notified).
        Uploads above gateway.ingest_max_upload_bytes (100MB default) are rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, user_ids]
              properties:
                name: { type: string }
                type: { type: string, enum: [first_party, behavioral, lookalike, suppression, retargeting, composite, predictive, cdp_imported], default: first_party }
                visibility: { type: string, enum: [public, dsp_private], default: dsp_private }
                user_ids: { type: array, items: { type: string } }
                mapping_id: { type: string, description: "Optional saved custom-mapping id (GET /mappings)" }
                provider_id: { type: string, description: "Optional data-provider id (GET /providers, ADR 0009) — snapshots the provider's party/licence/id_type/notify defaults" }
                run_at: { type: string, format: date-time, description: "Optional RFC3339 — hold the file until this time (ingest timing, not go-live)" }
                additional_emails: { type: array, items: { type: string }, description: "Optional extra completion-email recipients" }
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string }
                type: { type: string }
                visibility: { type: string }
                mapping_id: { type: string }
                provider_id: { type: string, description: "Optional data-provider id (ADR 0009)" }
                run_at: { type: string, description: "RFC3339" }
                additional_emails: { type: string, description: "Comma/space-separated extra recipients" }
                file: { type: string, format: binary, description: "CSV/TSV/Parquet (zip/gzip ok), optionally PGP-encrypted, with an id column (id_value/user_id/id/hashed_email/uid2/device_id) or a saved mapping" }
      responses:
        "200": { description: "Inline (small file): { segment_id, members_added, members_sent, matched, match_rate }" }
        "202": { description: "Queued (large file / held): { job_id, status, run_at? }. Poll GET /v1/api/audiences/ingest/{id}." }
        "422": { description: "File rejected (bad shape / undecodable / PGP-undecryptable / all-or-nothing threshold): { error } with the reason" }
  /v1/api/products:
    get:
      tags: [Audiences]
      summary: List the account's product catalog (Dynamic Product Ads)
      description: >-
        The advertiser's product catalog — the rows a dynamic creative assembles
        at render time and the per-SKU purchase burn list keys on. Tenant-scoped.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ products: [{ sku, title, description?, image_url?, price_micros, currency, availability, product_url?, category? }], count } — price_micros is micro-dollars; availability ∈ {in_stock, out_of_stock, preorder, discontinued}" }
    post:
      tags: [Audiences]
      summary: Upload a product feed (multipart CSV/TSV)
      description: >-
        A product feed is a second feed TYPE on the unified ingestion path (ADR
        0007, kind=product): the same staging, audience_ingest_jobs queue,
        inline-vs-202 threshold, and STRICT all-or-nothing validation as an
        audience upload — but the rows upsert into the products table (keyed on
        account + sku) instead of segment memberships. No PII hashing (a catalog
        has none). Small feeds process inline (200 with products_written);
        larger feeds return 202 with a job id — poll GET
        /v1/api/audiences/ingest/{id}. Columns: sku (or id/item_id/offer_id),
        title (or name/product_name), price ("38.99" or "38.99 EUR" or "$38.99"),
        and optionally image_url (image_link/image), product_url (link/url),
        availability, category (google_product_category), description, currency —
        Google Merchant headers work as-is.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string }
                additional_emails: { type: string, description: "Comma/space-separated extra completion-email recipients" }
                run_at: { type: string, description: "RFC3339 — hold the feed until this time (ingest timing)" }
                file: { type: string, format: binary, description: "CSV/TSV product feed with sku+title+price columns" }
      responses:
        "200": { description: "Inline (small feed): { products_written, total_rows, valid_rows, rejected_rows }" }
        "202": { description: "Queued (large feed / held): { job_id, status, run_at? }. Poll GET /v1/api/audiences/ingest/{id}." }
        "422": { description: "Feed rejected (bad shape / all-or-nothing threshold): { error } naming the failing column" }
  /v1/api/marketplace/listings:
    get:
      tags: [Audiences]
      summary: Browse the data marketplace catalog (or your own listings)
      description: >-
        The data marketplace (PLAN Phase 10). Default: the cross-tenant catalog
        of ACTIVE listings other data owners have published (each shows aggregate
        reach + the CPM surcharge + the seller, never individual members).
        `?scope=mine` returns the caller's own listings (seller view).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [mine] }, required: false, description: "mine = your own listings; omitted = browse the catalog" }
      responses:
        "200": { description: "[{ id, account_id, segment_id, name, description?, size_estimate, cpm_surcharge_micros, preview?, status, seller_name?, created_at, updated_at }]" }
    post:
      tags: [Audiences]
      summary: List one of your PUBLIC segments on the marketplace
      description: >-
        Publishes a PUBLIC audience segment you own for other tenants to
        discover + (later) buy targeting access to. Only public segments can be
        listed (a dsp_private segment can't be shared cross-tenant). Re-listing a
        segment upserts. The advertised reach snapshots the segment's live member
        count. Requires marketplace:list.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id, name]
              properties:
                segment_id: { type: string, description: "One of your own PUBLIC segments" }
                name: { type: string }
                description: { type: string }
                cpm_surcharge: { type: number, description: "USD CPM a buyer pays per impression served using this data; converted to micros" }
                preview: { type: object, description: "Aggregate-only shop window (top IAB categories, geo/device split). Never individual users." }
                status: { type: string, enum: [active, paused, withdrawn], default: active }
      responses:
        "200": { description: "{ id } — the listing id" }
        "400": { description: "segment not public / missing fields" }
        "404": { description: "segment not found (not one of yours)" }
  /v1/api/marketplace/listings/{id}/purchase:
    post:
      tags: [Audiences]
      summary: Purchase targeting access to a marketplace listing
      description: >-
        Buys the right to target the listing's segment (PLAN Phase 10, slice 2) —
        writes a grant (buyer = caller, seller = listing owner, surcharge snapshot
        frozen at purchase). Because listed segments are PUBLIC they already ride
        every bid request, so no bid-path change is needed; the grant is the
        authorization + the settlement key (the CPM surcharge is billed per
        impression the buyer wins using the segment). Re-purchase renews.
        You cannot buy your own listing. Requires marketplace:buy.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: "listing id" }
      responses:
        "200": { description: "{ grant_id, segment_id }" }
        "400": { description: "can't buy your own listing" }
        "404": { description: "listing not found or not active" }
  /v1/api/marketplace/listings/{id}/estimate:
    post:
      tags: [Audiences]
      summary: Expansion estimate against a listing (clean-room-lite)
      description: >-
        Estimates the overlap + incremental reach between YOUR audience and the
        listing's segment BEFORE purchasing (PLAN Phase 10, slice 4). Aggregate-
        only — never a member list — with a min-aggregation privacy floor: an
        overlap below the threshold is suppressed (you learn it's small, not the
        exact number). The overlap is a real set intersection of the two member
        sets. NOTE: this computes in-process; the full clean-room guarantee
        (isolated job, no raw data leaves) is a documented deferred boundary.
        Requires marketplace:read.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: "listing id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [my_audience_id]
              properties:
                my_audience_id: { type: string, description: "One of YOUR OWN segments to compare against the listing" }
      responses:
        "200": { description: "{ listing_name, your_audience_size, listing_size, overlap?, overlap_pct?, overlap_suppressed, new_reachable_users, expansion_factor, min_aggregation }" }
        "404": { description: "listing not found, or my_audience_id is not one of yours" }
  /v1/api/marketplace/grants:
    get:
      tags: [Audiences]
      summary: The caller's marketplace grants (purchased data, or sales)
      description: >-
        Default: the buyer's grants (segments they've purchased access to, with
        listing + seller names). `?scope=sales`: the seller's grants (who bought
        their data). Requires marketplace:read.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [sales] }, required: false, description: "sales = who bought your data; omitted = your purchases" }
      responses:
        "200": { description: "[{ id, listing_id, segment_id, seller_account_id, buyer_account_id, cpm_surcharge_micros, status, granted_at, expires_at?, listing_name?, seller_name?, buyer_name? }]" }
  /v1/api/marketplace/earnings:
    get:
      tags: [Audiences]
      summary: The caller's settled marketplace revenue (seller view)
      description: >-
        The seller's CPM-surcharge revenue that has actually SETTLED through the
        money loop, aggregated per segment they've sold (impressions, gross
        surcharge, net earned, distinct buyers, last-settled time) plus roll-up
        totals. Distinct from `grants?scope=sales` (which lists WHO bought): this
        is HOW MUCH has settled. Requires marketplace:read.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ total_net_micros, total_gross_micros, total_impressions, by_segment: [{ segment_id, listing_name?, impressions, gross_micros, net_micros, margin_micros, buyers, last_settled_at }] }" }
  /v1/api/account/close:
    get:
      tags: [Account]
      summary: The caller's active account-closure status
      description: >-
        Returns the account's in-grace closure request, or null. Owner-only
        (account:close). Part of the Account Closure and Data Export workflow
        (PLAN Phase 11 item 105).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ closure: { id, account_id, status, reason?, requested_at, grace_ends_at, paused_line_items, deactivated_placements } | null }" }
    post:
      tags: [Account]
      summary: Initiate account closure (starts a 30-day grace period)
      description: >-
        Opens a 30-day grace-period closure: the account is suspended, its live
        campaigns are paused and its placements deactivated (no new spend, no new
        auctions). The owner can still sign in and cancel during the grace window
        — the pause is exactly reversible. Owner-only (account:close).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "Optional free-text reason, recorded on the request + audit log" }
      responses:
        "200": { description: "The created closure request { id, account_id, status: grace, grace_ends_at, paused_line_items, deactivated_placements }" }
        "409": { description: "A closure is already in progress" }
        "403": { description: "Requires the account:close permission (owner)" }
  /v1/api/account/close/cancel:
    post:
      tags: [Account]
      summary: Cancel an in-grace account closure
      description: >-
        Reverses an open grace-period closure: reactivates the account and
        restores exactly the campaigns / placements this closure paused. Owner-only
        (account:close).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "The cancelled closure request { id, status: cancelled, cancelled_at }" }
        "404": { description: "No closure in progress" }
  /v1/api/account/export:
    get:
      tags: [Account]
      summary: Poll the account data-export status
      description: >-
        Returns the status of the caller's most recent data-export job (or
        status=none). When done and unexpired, download_url points at the
        streamed archive. Owner-only (account:export). Part of the Account Closure
        and Data Export workflow (PLAN Phase 11 item 105).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ status: none|queued|running|done|failed, artifact_bytes?, download_url?, error?, requested_at?, expires_at? }" }
    post:
      tags: [Account]
      summary: Request an account data-export package
      description: >-
        Enqueues an export job (coalescing onto an in-flight one): the account's
        campaigns, creatives, audiences (aggregate counts only), invoice/payout
        history and audit log, materialized to CSV + metadata.json, zipped, and
        uploaded to the private reports bucket. The report-runner builds it
        asynchronously; poll GET for status, then stream via the download URL.
        Owner-only (account:export).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "The export job status { status: queued|running|done, requested_at, expires_at }" }
  /v1/api/account/sso:
    get:
      tags: [Account]
      summary: Get the account's OIDC SSO configuration (owner)
      description: >-
        Owner-only (sso:manage). Returns the account's OIDC SSO config for its login
        (PLAN Phase 11 item 110). The client_secret is NEVER returned — has_client_secret
        indicates whether one is set. start_url is the /v1/auth/sso/start link for this account.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ enabled, issuer, client_id, allowed_domains, default_role, has_client_secret, start_url }" }
    put:
      tags: [Account]
      summary: Configure the account's OIDC SSO (owner)
      description: >-
        Owner-only (sso:manage). Upserts the OIDC config. When enabled, issuer (URL),
        client_id and a non-empty allowed_domains are required. client_secret is
        write-only: an empty value on update keeps the existing secret. default_role is
        the least-privilege role JIT-provisioned SSO users receive.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                issuer: { type: string, example: "https://idp.example.com" }
                client_id: { type: string }
                client_secret: { type: string, description: "write-only; empty on update keeps existing" }
                allowed_domains: { type: array, items: { type: string }, example: ["example.com"] }
                default_role: { type: string, enum: [viewer, analyst, ad_ops, finance, manager] }
      responses:
        "200": { description: "{ status: saved }" }
        "400": { description: "invalid config (bad issuer/role, or enabled without client_id+allowed_domains)" }
        "403": { description: "not an owner (lacks sso:manage)" }
  /v1/auth/sso/start:
    get:
      tags: [Auth]
      summary: Begin OIDC SSO login (public)
      description: >-
        PUBLIC. Redirects (302) the browser to the account's IdP for the OIDC
        auth-code flow (PKCE + state + nonce). Requires ?account=<uuid> whose SSO is
        enabled; otherwise redirects to /login.
      parameters:
        - { name: account, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: redirect to the IdP (or /login when SSO is not enabled) }
        "400": { description: invalid account }
  /v1/auth/sso/callback:
    get:
      tags: [Auth]
      summary: OIDC SSO callback (public)
      description: >-
        PUBLIC. The IdP redirect target. Verifies state (CSRF) + the id_token
        (signature/iss/aud/exp/nonce), gates on email_verified + allowed_domains +
        eligible account type, JIT-provisions a least-privilege team_member, and mints
        the standard session cookie. Never provisions staff/admin/partner accounts and
        never logs a user into an account their email doesn't belong to.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: redirect to the portal on success }
        "400": { description: "state mismatch / no flow / missing code" }
        "401": { description: "id_token verification failed or email not verified" }
        "403": { description: "domain not permitted / account not eligible / user belongs to another account" }
  /v1/api/support/tickets:
    get:
      tags: [Account]
      summary: List support tickets
      description: >-
        A customer's own tickets (support:contact), or the full staff queue with
        `?scope=all` (staff, support:read). Part of the Customer Support and
        Dispute Resolution workflow (PLAN Phase 11 item 108).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [all] }, required: false, description: "all = staff queue across tenants" }
      responses:
        "200": { description: "[{ id, account_id, kind, subject, status, amount_disputed_micros?, currency, resolution?, created_at, account_name? }]" }
    post:
      tags: [Account]
      summary: Open a support ticket or billing dispute
      description: "Customer opens a ticket (support:contact). kind=billing_dispute may carry amount_disputed."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                kind: { type: string, enum: [question, technical, billing_dispute] }
                subject: { type: string }
                body: { type: string, description: "opening message" }
                amount_disputed: { type: number, description: "dollars (billing_dispute)" }
                currency: { type: string }
      responses:
        "200": { description: "{ id }" }
  /v1/api/support/tickets/{id}:
    get:
      tags: [Account]
      summary: Support ticket detail + message thread
      description: "A customer's own ticket (support:contact) or any ticket for staff (support:read), including the message thread."
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ...ticket, messages: [{ id, author_type, body, created_at }] }" }
        "404": { description: "not found" }
  /v1/api/support/tickets/{id}/messages:
    post:
      tags: [Account]
      summary: Reply on a support ticket
      description: "Customer reply (support:contact, reopens the ticket) or staff reply (support:update, marks pending)."
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses:
        "200": { description: "{ status: ok }" }
  /v1/api/support/tickets/{id}/resolve:
    post:
      tags: [Account]
      summary: Resolve a support ticket (staff)
      description: >-
        Staff-only (support:update). Sets status + resolution; a billing_dispute
        may resolve with credit_amount > 0, which issues a credit adjustment to
        the ticket's account.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, pending, resolved, closed] }
                resolution: { type: string }
                credit_amount: { type: number, description: "dollars; issues a credit adjustment (billing_dispute only)" }
      responses:
        "200": { description: "{ ticket, credited }" }
        "404": { description: "ticket not found" }
  /v1/api/status:
    get:
      tags: [Platform]
      summary: Public platform status (health + incidents)
      description: >-
        PUBLIC (no auth) — the JSON twin of the /status page (PLAN Phase 11 item
        107). Rolls each backing service's /readyz up into customer-facing
        components and folds in open staff-authored incidents to report one
        overall status.
      responses:
        "200": { description: "{ overall, overall_text, components: [{ name, status, healthy_services, total_services }], active_incidents: [...], recent_incidents: [...], generated_at }" }
  /v1/api/incidents:
    get:
      tags: [Platform]
      summary: List platform incidents (staff)
      description: "Staff-only (incidents:read). Lists all incidents newest-first for the status-page console."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, title, body?, impact, status, affected_components, started_at, resolved_at?, created_by?, updated_at }]" }
    post:
      tags: [Platform]
      summary: Create or update a platform incident (staff)
      description: >-
        Staff-only (incidents:write). Creates an incident when no id is supplied,
        or updates the given one. Setting status=resolved stamps resolved_at.
        Incidents surface on the public /status page.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                id: { type: string, description: "omit to create; supply to update" }
                title: { type: string }
                body: { type: string }
                impact: { type: string, enum: [none, minor, major, critical] }
                status: { type: string, enum: [investigating, identified, monitoring, resolved] }
                affected_components: { type: array, items: { type: string } }
      responses:
        "200": { description: "{ id } on create, or the updated incident object" }
        "404": { description: "incident id not found (update)" }
  /v1/api/glossary:
    get:
      tags: [Platform]
      summary: Ad-tech glossary reference (staff)
      description: >-
        Staff-only (support:read). Returns the static, code-grounded ad-tech
        term/definition set grouped by category — a read-only learning aid,
        platform-global (the same list for every staff caller), no DB.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "grouped term/definition set: [{ category, terms: [{ term, definition }] }]" }
  /v1/api/changelog:
    get:
      tags: [Platform]
      summary: Public API changelog feed
      description: >-
        PUBLIC (no auth) — the JSON twin of the /changelog page (PLAN Phase 11 item
        109). Staff-authored API-change entries, newest release first, breaking
        changes flagged. For external integrators.
      responses:
        "200": { description: "{ entries: [{ id, version, release_date, category, breaking, title, body, affected_endpoints, created_at, updated_at }] }" }
  /v1/api/changelog/entries:
    get:
      tags: [Platform]
      summary: List changelog entries (staff)
      description: "Staff-only (changelog:read). Lists entries newest-first for the changelog console."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, version, release_date, category, breaking, title, body, affected_endpoints, created_at, updated_at }]" }
    post:
      tags: [Platform]
      summary: Create or update a changelog entry (staff)
      description: "Staff-only (changelog:write). Creates when no id is supplied, else updates. Surfaces on the public /changelog feed."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, release_date, title]
              properties:
                id: { type: string, description: "omit to create; supply to update" }
                version: { type: string, example: "1.2.0" }
                release_date: { type: string, format: date, example: "2026-09-10" }
                category: { type: string, enum: [added, changed, deprecated, removed, fixed, security] }
                breaking: { type: boolean }
                title: { type: string }
                body: { type: string }
                affected_endpoints: { type: array, items: { type: string } }
      responses:
        "200": { description: "{ id }" }
        "400": { description: "invalid body (version/title required, bad category or release_date)" }
        "404": { description: "entry id not found (update)" }
    delete:
      tags: [Platform]
      summary: Delete a changelog entry (staff)
      description: "Staff-only (changelog:write). Deletes the entry given by ?id=."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ status: deleted }" }
        "404": { description: "entry id not found" }
  /v1/api/partners:
    get:
      tags: [Platform]
      summary: List / get external partners (staff)
      description: >-
        Staff-only (partners:read). Lists the external-partner onboarding registry
        newest-first; `?status=` filters by lifecycle status; `?id=` returns one
        partner. External partners are demand DSPs or supply SSPs integrating over
        OpenRTB (PLAN Phase 11, item 112).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, sandbox, certified, active, paused, terminated] } }
        - { name: id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "A partner, or [{ id, name, kind, status, endpoint_bid, seat?, channels, formats, timeout_ms, openrtb_version, created_at, ... }]" }
        "404": { description: "partner id not found" }
    post:
      tags: [Platform]
      summary: Register or edit an external partner (staff)
      description: >-
        Staff-only (partners:manage). Registers a partner (status starts pending)
        when no id is supplied, or edits the given one's metadata (not status —
        use /v1/api/partners/status).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string, description: "omit to register; supply to edit" }
                name: { type: string }
                kind: { type: string, enum: [dsp, ssp], default: dsp }
                endpoint_bid: { type: string }
                endpoint_nurl: { type: string }
                seat: { type: string }
                auth_method: { type: string, enum: [api_key, mtls, none] }
                channels: { type: array, items: { type: string } }
                formats: { type: array, items: { type: string } }
                timeout_ms: { type: integer }
                contact_tech: { type: string }
      responses:
        "201": { description: "the registered partner" }
        "200": { description: "the updated partner" }
        "400": { description: "name required / invalid kind" }
        "404": { description: "partner id not found (edit)" }
  /v1/api/partners/status:
    post:
      tags: [Platform]
      summary: Transition an external partner's onboarding status (staff)
      description: >-
        Staff-only (partners:manage). Advances the lifecycle
        pending → sandbox → certified → active, with paused/terminated off-ramps.
        Invalid transitions are rejected 409. Going active stamps onboarded_at.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: { type: string }
                status: { type: string, enum: [pending, sandbox, certified, active, paused, terminated] }
      responses:
        "200": { description: "the updated partner" }
        "400": { description: "id + valid status required" }
        "404": { description: "partner not found" }
        "409": { description: "invalid transition from the current status" }
  /v1/api/partners/provision:
    post:
      tags: [Platform]
      summary: Provision a partner's self-serve login (staff)
      description: >-
        Staff-only (partners:manage). Creates the partner's login account (type
        'partner') + an owner user, and links the registry row to it. Returns a
        ONE-TIME temp password (never stored/shown again) to hand to the partner.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, email]
              properties:
                id: { type: string, description: "partner registry id" }
                email: { type: string, format: email }
                name: { type: string, description: "defaults to the email" }
      responses:
        "201": { description: "{ account_id, login_email, temp_password, note }" }
        "400": { description: "valid id + email required" }
        "404": { description: "partner not found" }
        "409": { description: "already has a login, or the email is in use" }
  /v1/api/partner/me:
    get:
      tags: [Platform]
      summary: A partner reads its own onboarding record
      description: >-
        Partner accounts only (partner:self). Returns the caller partner's
        registry record (status, endpoint, channels) for the self-serve portal.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "the partner's own record" }
        "403": { description: "not a partner account" }
        "404": { description: "no partner record for this account" }
  /v1/api/partner/sandbox-keys:
    get:
      tags: [Platform]
      summary: List a partner's sandbox API keys (masked)
      description: >-
        Partner accounts only (apikeys:manage). Lists the caller partner's
        non-revoked sandbox keys with the value MASKED. Account-scoped.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, status, value_preview, created_at, rotated_at? }]" }
        "403": { description: "not a partner account" }
    post:
      tags: [Platform]
      summary: Generate / rotate a partner sandbox API key
      description: >-
        Partner accounts only (apikeys:manage). Mints a new sandbox key (X-API-Key)
        and demotes any current active key to 'rotating' (grace window). Returns
        the FULL value ONCE — never shown again.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: "{ id, value, note }" }
        "403": { description: "not a partner account" }
  /v1/api/partner/sandbox-keys/revoke:
    post:
      tags: [Platform]
      summary: Revoke a partner sandbox API key
      description: "Partner accounts only (apikeys:manage). Revokes one of the caller's own keys."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        "200": { description: "{ id, status: revoked }" }
        "400": { description: "invalid id" }
        "404": { description: "key not found (or not this partner's)" }
  /v1/api/partner/validate:
    post:
      tags: [Platform]
      summary: Validate a pasted OpenRTB BidResponse for conformance
      description: >-
        Partner accounts only (partner:self). Body = the partner's sample OpenRTB
        BidResponse JSON; it is checked against a golden request for spec
        conformance (impid match, price>floor, adm present, blocked adomains, etc.).
        A no-bid is valid. No outbound call.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, description: "an OpenRTB 2.x BidResponse" } }
      responses:
        "200": { description: "{ valid, findings: [{ severity, field, message }] }" }
        "403": { description: "not a partner account" }
  /v1/api/partner/test-bid:
    post:
      tags: [Platform]
      summary: Live test-bid against the partner's registered endpoint
      description: >-
        Partner accounts only (partner:self). Sends a golden OpenRTB BidRequest to
        the partner's REGISTERED http(s) bid endpoint, then validates the response.
        Returns conformance findings + latency + the endpoint's HTTP status. An
        unreachable or malformed endpoint is reported gracefully (never a 500).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ valid, findings, latency_ms, http_status, note? }" }
        "400": { description: "no endpoint registered, or a non-http(s) endpoint" }
        "403": { description: "not a partner account" }
  /v1/api/partner/certify:
    get:
      tags: [Platform]
      summary: Certification scenarios + this partner's run history
      description: "Partner accounts only (partner:self). Returns the golden scenarios to answer + past runs + current status."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ scenarios: [{ name, description, request }], history: [...], status }" }
        "403": { description: "not a partner account" }
    post:
      tags: [Platform]
      summary: Run the certification suite (scored)
      description: >-
        Partner accounts only (partner:self). Body = the partner's responses to
        each golden scenario ({responses:{scenario:BidResponse}}). Each is scored
        for OpenRTB conformance; a PASS while the partner is in sandbox advances it
        to certified (staff still gates certified → active). The run is recorded.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { responses: { type: object, additionalProperties: { type: object } } } }
      responses:
        "200": { description: "{ result: { passed, score, total, checks }, record, promoted, status }" }
        "403": { description: "not a partner account" }
  /v1/api/taxonomy:
    get:
      tags: [Audiences]
      summary: IAB Audience Taxonomy reference nodes (global, for the segment-label picker)
      description: >-
        The platform's IAB Audience Taxonomy 1.1 reference table (migration
        062). Global reference data — identical for every account. The portal
        fuzzy-filters client-side; there is no server-side search.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, parent_id?, name, path }] — path is the full breadcrumb, e.g. \"Interest | Automotive | Auto Body Styles | SUV\"" }
  /v1/api/audiences/taxonomy:
    put:
      tags: [Audiences]
      summary: Set or clear a segment's IAB Audience Taxonomy label
      description: >-
        Labels one of the account's segments with a standard taxonomy node
        (taxonomy_id from GET /v1/api/taxonomy), or clears the label when
        taxonomy_id is null/omitted. PUBLIC segments carrying a label are
        expressed to external bidders on bid requests as OpenRTB user.data
        with ext.segtax=4 (consent-gated at the SSP); unlabelled or
        dsp_private segments never ride user.data.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id]
              properties:
                segment_id: { type: string }
                taxonomy_id: { type: integer, nullable: true, description: "Node id, or null to clear" }
      responses:
        "204": { description: "Label updated" }
        "404": { description: "Segment not found for this account" }
  /v1/api/audiences/fee:
    put:
      tags: [Audiences]
      summary: Set or clear a segment's data fee (data monetization, ADR 0009)
      description: >-
        The CPM (micro-dollars) the owning account earns per DELIVERED
        impression when an external buyer wins an auction whose bid request
        carried this segment. Only public, IAB-labelled segments ride to
        external buyers, so only they can earn. The owner is credited the fee
        net of reporting.data_fee_margin_pct; the buyer's seat accrues a
        receivable (invoiced out-of-band). null clears the fee.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segment_id]
              properties:
                segment_id: { type: string }
                data_fee_micros: { type: integer, nullable: true, minimum: 0, description: "CPM in micro-dollars (500000 = $0.50 CPM), or null to clear" }
      responses:
        "204": { description: "Fee updated" }
        "404": { description: "Segment not found for this account" }
  /v1/api/audiences/earnings:
    get:
      tags: [Audiences]
      summary: Accrued data-fee earnings per segment (data monetization)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ segment_id, segment_name, impressions, fee_micros, owner_net_micros, margin_micros, last_earned_at? }] — summed per-impression micro-dollars, biggest earner first" }
  /v1/api/audiences/ingest/:
    get:
      tags: [Audiences]
      summary: Upload history — the account's recent ingest jobs (ADR 0007/0008)
      description: >-
        Tenant-scoped list of the account's audience uploads with each one's
        outcome (done | failed | queued | running), counts, match rate, and the
        failure reason. Pre-flight 422 rejects do not create a job row (they are
        the immediate upload error); all staged jobs appear here.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ jobs: [{ id, name, source, status, valid_rows, rejected_rows, match_rate, error?, created_at, finished_at? }] }" }
  /v1/api/audiences/members/:
    get:
      tags: [Audiences]
      summary: Member sample for a segment (per-row match report)
      description: >-
        GET /v1/api/audiences/members/{segment_id}?limit=N (default 25, max
        200) — newest members first, each with the hashed id, the writer that
        enrolled it (api | dropzone:provider | identity-expansion |
        retargeting…), when, and graph_known: whether the identity graph can
        resolve the id. graph_known is the row-level truth behind the
        segment's aggregate match_rate. Tenant-scoped — another account's
        segment id returns an empty list.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ members: [{ user_id, source, added_at, graph_known }] }" }
        "400": { description: "invalid segment id" }
  /v1/api/audiences/check:
    get:
      tags: [Audiences]
      summary: Test a hash — membership + identity-graph reachability
      description: >-
        GET /v1/api/audiences/check?user_id=H — which of the CALLER'S OWN
        segments contain this id, and whether the identity graph has ever
        observed it (i.e. would a CRM row with this hash be matchable).
        Clients hash emails before calling (hash-before-transmission — the
        portal does this automatically for @-inputs). Max 256 chars.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ segments: [names…], graph_known: bool }" }
        "400": { description: "user_id required (max 256 chars)" }
  /v1/api/audiences/sync:
    get:
      tags: [Audiences]
      summary: Serving-cache freshness — pending membership changes
      description: >-
        Tenant-scoped depth of the membership change-log outbox still queued
        for the serving-cache writer. 0 = every upload/delete is live in
        serving; >0 = syncing (drains within seconds under normal operation).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ pending: int }" }
  /v1/api/audiences/pgp-key:
    get:
      tags: [Audiences]
      summary: Platform PGP public key for encrypting audience files (ADR 0008)
      description: >-
        The platform public key providers encrypt audience files to; files
        encrypted to it are decrypted on ingest. Derived from the active
        pgp_private secret.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ public_key (armored), fingerprint }" }
        "404": { description: No PGP key configured }
  /v1/api/audiences/mappings:
    get:
      tags: [Audiences]
      summary: List the account's custom field mappings ("connectors", ADR 0008)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, name, mappings, id_type, created_at, updated_at }]" }
    post:
      tags: [Audiences]
      summary: Create/update a custom field mapping (tenant-scoped)
      description: >-
        Maps a provider's columns to our canonical fields. Targets are limited to
        the fields we consume (id_value, id_type) — at least one column must map
        to id_value; other targets are rejected (422). Upsert on (account, name).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mappings]
              properties:
                name: { type: string }
                mappings: { type: object, additionalProperties: { type: string }, description: "their lowercased column -> id_value | id_type" }
                id_type: { type: string, default: user_id }
      responses:
        "200": { description: "{ id }" }
        "422": { description: "Invalid mapping (non-consumed target, or no id_value): { error }" }
  /v1/api/audiences/mappings/{id}:
    delete:
      tags: [Audiences]
      summary: Delete a custom field mapping (tenant-scoped)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Deleted } }
  /v1/api/audiences/mappings/sample:
    post:
      tags: [Audiences]
      summary: Detect columns from a sample file to build a mapping (ADR 0008)
      description: >-
        Decodes a small sample (≤1MB) with the strict parser and returns its
        detected (lowercased) columns plus a suggested id_value mapping, to drive
        the mapping-builder UI. 422 if the sample is unparsable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: "{ columns: [..], suggested: { <col>: id_value } }" }
        "422": { description: Unparsable sample }
  /v1/api/audiences/providers:
    get:
      tags: [Audiences]
      summary: List the account's data providers (DMP entity, ADR 0009)
      description: >-
        Tenant-scoped data providers. A provider classifies who supplies audience
        data (party 1st/2nd/3rd, licence) and carries format/encryption/notify
        defaults an upload snapshots when it selects the provider (provider_id).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, name, kind, default_party, default_licence, default_id_type, encryption_expected, notify_emails, status }]" }
    post:
      tags: [Audiences]
      summary: Create/update a data provider (tenant-scoped, ADR 0009)
      description: >-
        Upsert on (account, name). Omitted enum fields are defaulted from kind
        (crm/other -> 1st party, agency -> 2nd, dmp/cdp -> 3rd; party -> licence).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                kind: { type: string, enum: [crm, dmp, cdp, agency, other], default: other }
                default_party: { type: string, enum: [first, second, third], description: "defaulted from kind when omitted" }
                default_licence: { type: string, enum: [first_party, purchased, barter], description: "defaulted from party when omitted" }
                default_id_type: { type: string, default: user_id }
                encryption_expected: { type: boolean, default: false, description: "reject cleartext files from this provider (enforced from ADR 0009 Phase 4)" }
                notify_emails: { type: array, items: { type: string } }
                status: { type: string, enum: [active, paused], default: active }
      responses:
        "200": { description: "{ id }" }
        "422": { description: "Invalid provider (bad enum / missing name): { error }" }
  /v1/api/audiences/providers/{id}:
    get:
      tags: [Audiences]
      summary: Get one data provider (tenant-scoped, ADR 0009)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ id, name, kind, default_party, ... }" }
        "404": { description: Not found }
    delete:
      tags: [Audiences]
      summary: Delete a data provider (tenant-scoped, ADR 0009)
      description: >-
        Detaches (SET NULL) the provider from its ingest/segment history rather
        than cascading it away.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Deleted } }
  /v1/api/audiences/ingest/{id}:
    get:
      tags: [Audiences]
      summary: Audience-ingest job status (ADR 0007)
      description: >-
        Tenant-scoped status of a staged/enqueued audience upload. Returns the
        job's lifecycle state (queued | running | done | failed) plus terminal
        counts and match rate once complete.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ id, status, segment_id?, total_rows, valid_rows, rejected_rows, matched_rows, match_rate, error? }" }
        "404": { description: No such job for this account }
  /v1/api/profiles/{id}:
    get:
      tags: [Profiles]
      summary: Staff profile transparency lookup (support:read)
      description: >-
        Everything the platform knows about an identifier — identity cluster
        (person + members), direct graph links, segment memberships with
        provenance across the cluster, and the lake signal summary. Also the
        GDPR access-request answer surface. Platform-wide (staff only).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{ id, person_id?, cluster_members, identity_links, memberships, lake? }" } }
  /v1/api/onboarding/runs:
    get:
      tags: [Profiles]
      summary: Staff drop-zone monitor (support:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: query, schema: { type: string } }
      responses: { "200": { description: "{ runs: [...], providers: [rollups] } — recent onboarding_runs + per-provider health" } }
  /v1/api/batch/runs:
    get:
      tags: [Batch]
      summary: Staff batch-conductor monitor (support:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ runs: [{ run_id, started_at, steps: [{ seq, step, status, critical, detail?, error?, started_at, finished_at? }] }] } — last 20 chain runs" } }
  /v1/api/batch/lake:
    get:
      tags: [Batch]
      summary: Staff lake-state snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "per-table { version, total_rows, total_bytes, active_files } — proxied live from the pipeline" } }
  /v1/api/ops/pods:
    get:
      tags: [Ops]
      summary: Staff ops console — pod matrix (ops:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ namespace, pods: [{ name, app, phase, ready, restart_count, start_time?, image }] }" }
        "503": { description: Gateway is not running in-cluster (no serviceaccount) or the k8s API is unreachable }
  /v1/api/ops/readyz-grid:
    get:
      tags: [Ops]
      summary: Staff ops console — per-service /readyz fan-out (ops:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ services: [{ service, url, ok, status?, body?, latency_ms, error? }] } — each service probed in-cluster with a 2s timeout" } }
  /v1/api/ops/nats:
    get:
      tags: [Ops]
      summary: Staff ops console — NATS JetStream lag summary (ops:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ streams: [{ name, messages, bytes, consumers }], lagging: [{ stream, name, num_pending, num_ack_pending, num_redelivered }], totals } — proxied summary of the NATS monitor's /jsz" }
        "503": { description: NATS monitoring endpoint unreachable }
  /v1/api/ops/cronjobs:
    get:
      tags: [Ops]
      summary: Staff ops console — cronjob list (ops:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ cronjobs: [{ name, schedule, suspend, last_schedule_time? }] }" } }
  /v1/api/ops/cronjobs/trigger:
    post:
      tags: [Ops]
      summary: Staff ops console — run a cronjob now (ops:deploy, audit-logged)
      description: Creates a one-off Job from the cronjob's jobTemplate, named <cronjob>-manual-<unixts> and labelled adtech.dev/manual-trigger.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses: { "200": { description: "{ cronjob, job } — the created Job's name" } }
  /v1/api/ops/jobs:
    get:
      tags: [Ops]
      summary: Staff ops console — job list (ops:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: label_selector, in: query, schema: { type: string }, description: "defaults to adtech.dev/manual-trigger (manual cron runs)" }
      responses: { "200": { description: "{ jobs: [{ name, succeeded, failed, active, start_time? }] }" } }
  /v1/api/ops/pvcs:
    get:
      tags: [Ops]
      summary: Staff ops console — persistent volume claims (ops:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ pvcs: [{ name, phase, requested }] }" } }
  /v1/api/ops/logs:
    get:
      tags: [Ops]
      summary: Staff ops console — pod log tail (ops:read)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: pod, in: query, required: true, schema: { type: string } }
        - { name: container, in: query, schema: { type: string } }
        - { name: tail, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses: { "200": { description: Plain-text log tail } }
  /v1/api/ops/restart:
    post:
      tags: [Ops]
      summary: Staff ops console — rollout-restart a deployment (ops:deploy, audit-logged)
      description: The kubectl rollout-restart mechanism — patches the pod template's restartedAt annotation so the Deployment rolls new pods.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [deployment], properties: { deployment: { type: string } } }
      responses: { "200": { description: "{ deployment, restarted: true }" } }
  /v1/api/my-revshare:
    get:
      tags: [Billing]
      summary: The caller's own revenue-share terms (publisher, earnings:view)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ model, rate/tiers, payment_terms } — read-only; staff edit via /v1/api/revshare" } }
  /v1/api/publishers:
    get:
      tags: [Inventory]
      summary: List publishers (tenant-scoped via forwarded identity)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "[{ id, name, domain, status }] — a publisher session sees its own; platform users all" } }
  /v1/api/accounts:
    get:
      tags: [Staff]
      summary: List accounts for the staff impersonation picker (support:read)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "[{ id, name, type, residency_region }]" } }
  /v1/api/accounts/residency:
    put:
      tags: [Staff]
      summary: Set an account's data-residency region (support:update, staff-only)
      description: >
        Pins an account to a data-residency region (PLAN Phase 11 #111). An account
        whose region differs from a deployment's home region (platform.region) has
        its mutations rejected there and its out-of-region bid-time user data not
        stored. Takes effect on the account's next login (the region rides the JWT).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, residency_region]
              properties:
                account_id: { type: string, format: uuid }
                residency_region: { type: string, example: eu, description: "region token [a-z0-9-]{2,32}" }
      responses:
        "200": { description: "{ account_id, residency_region }" }
        "400": { description: invalid account_id or residency_region }
        "403": { description: not staff / lacks support:update }
        "404": { description: account not found }
  /v1/api/moderation:
    get:
      tags: [Moderation]
      summary: Creative review queue (staff)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Pending creatives } }
    post:
      tags: [Moderation]
      summary: Approve or reject a creative (staff)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creative_id, action]
              properties:
                creative_id: { type: string, format: uuid }
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, description: required when action=reject }
      responses: { "200": { description: "{ id, review_status }" } }
  /v1/api/quality-controls:
    get:
      tags: [Quality]
      summary: List publisher quality controls (allow/blocklists)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: List } }
    post:
      tags: [Quality]
      summary: Upsert a quality control list
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher_id, type, values]
              properties:
                publisher_id: { type: string, format: uuid }
                type: { type: string, enum: [advertiser_blocklist, category_blocklist, creative_blocklist, advertiser_allowlist, domain_blocklist] }
                values: { type: array, items: { type: string } }
      responses: { "200": { description: Upserted } }
    delete:
      tags: [Quality]
      summary: Delete a quality control list
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted } }
  /v1/api/fraud/blocklists:
    get:
      tags: [Fraud]
      summary: List fraud blocklist entries (staff)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: List } }
    post:
      tags: [Fraud]
      summary: Add a fraud blocklist entry (staff)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [ip, ua, domain, app_bundle] }
                value: { type: string }
                reason: { type: string }
      responses: { "201": { description: Created } }
    delete:
      tags: [Fraud]
      summary: Remove a fraud blocklist entry (staff)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted } }

  # ============================================================
  # Publisher API - Ad tag generator + saved reports
  # ============================================================
  /v1/api/adtag:
    get:
      tags: [Placements]
      summary: Generate an embed ad tag for a placement
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: placement_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: tag_type, in: query, schema: { type: string, enum: [js, prebid, vast], default: js } }
      responses: { "200": { description: "{ placement_id, format, tag_type, tag }" } }
  /v1/api/reports/saved:
    get:
      tags: [Reports]
      summary: List saved / scheduled reports
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "[{ id, name, query_config, schedule, delivery }] — schedule empty for manual reports; delivery one of email/webhook/none" } }
    post:
      tags: [Reports]
      summary: Save a report (optionally scheduled)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query_config]
              properties:
                name: { type: string }
                query_config: { type: object, description: report query specification }
                schedule: { type: string, description: "interval keyword (@hourly/@daily/@weekly/@monthly), a 5-field cron expression (calendar-aligned), or empty for manual" }
                delivery: { type: string, enum: [email, webhook, none], default: none }
      responses: { "201": { description: Created } }
    delete:
      tags: [Reports]
      summary: Delete a saved report
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Deleted } }

  /v1/api/reports/jobs:
    get:
      tags: [Reports]
      summary: List the account's async report jobs (newest first)
      description: Requires reports:read. Tenant-scoped; supports X-Act-As-Account.
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Job list with status + artifact metadata } }
    post:
      tags: [Reports]
      summary: Submit a report as an async job
      description: >
        Requires reports:export. From a saved-report template (saved_report_id)
        or ad-hoc (name + query_config). Tenant scope filters are resolved
        server-side at enqueue; the worker stores the result as a downloadable
        CSV/JSON/Parquet artifact. delivery=email additionally mails the account
        owner a download link; delivery=webhook relies on the account's
        report.completed webhook subscriptions (the completion event publishes
        for every job).
        owner a download link when the job completes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                saved_report_id: { type: string, format: uuid, description: template to run (mutually exclusive with name/query_config) }
                name: { type: string }
                query_config: { type: object, description: report query specification (ad-hoc submissions) }
                format: { type: string, enum: [csv, json, parquet], default: csv }
                delivery: { type: string, enum: [email, none], default: none }
      responses:
        "201": { description: "Queued — {id, status}" }
        "400": { description: Validation or tenant-scope failure }
  /v1/api/reports/jobs/{id}:
    get:
      tags: [Reports]
      summary: Report job status
      description: Requires reports:read. 404 for jobs outside the caller's account.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Job with status/error/artifact metadata }
        "404": { description: Not found (or not the caller's) }
  /v1/api/reports/jobs/{id}/download:
    get:
      tags: [Reports]
      summary: Download the finished report artifact
      description: >
        Requires reports:export. Streams the artifact through the gateway with
        Content-Disposition attachment — the artifact bucket is private and has
        no direct URL. 409 until the job is done.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Artifact bytes (text/csv, application/json or parquet) }
        "409": { description: Job not finished }
        "404": { description: Not found (or not the caller's) }

  # ============================================================
  # Publisher Ad Server - audio + VMAP
  # ============================================================
  /v1/pubad/audio:
    get:
      tags: [Ad Serving]
      summary: Serve an audio ad (VAST 4.2, audio MediaFile)
      description: Runs an SSP auction (channel=audio) and returns VAST with an audio/mpeg MediaFile and signed impression/click/quartile beacons. Falls back to a house creative on no-bid.
      parameters:
        - { name: placement_id, in: query, schema: { type: string }, description: "default pl-sim-audio" }
        - { name: geo, in: query, schema: { type: string } }
        - { name: consent, in: query, schema: { type: string } }
        - { name: uid2, in: query, schema: { type: string } }
      responses: { "200": { description: VAST 4.2 audio XML, content: { text/xml: { schema: { type: string } } } } }
  /v1/pubad/video/vmap:
    get:
      tags: [Ad Serving]
      summary: Serve a VMAP ad schedule (pre/mid/post breaks)
      parameters:
        - { name: placement_id, in: query, schema: { type: string } }
      responses: { "200": { description: VMAP 1.0 XML, content: { application/xml: { schema: { type: string } } } } }

  # ============================================================
  # SSAI - server-side ad insertion
  # ============================================================
  /v1/ssai/manifest.m3u8:
    get:
      tags: [SSAI]
      summary: Stitched HLS manifest (ads spliced into content)
      description: >
        Runs a per-break auction, conditions winning ads to the content profile,
        and returns an HLS playlist with ad segments spliced in. Ad segments point
        at /v1/ssai/seg (server-side beacons). ?channel=audio serves the audio path.
      parameters:
        - { name: origin, in: query, schema: { type: string }, description: origin content manifest URL (else built-in sample) }
        - { name: placement_id, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [video, audio], default: video } }
        - { name: geo, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string } }
        - { name: rung, in: query, schema: { type: string }, description: ABR rung height to condition ads to }
      responses: { "200": { description: HLS media playlist, content: { application/vnd.apple.mpegurl: { schema: { type: string } } } } }
  /v1/ssai/manifest.mpd:
    get:
      tags: [SSAI]
      summary: Stitched MPEG-DASH manifest (multi-period MPD over CMAF)
      description: DASH counterpart of manifest.m3u8; multi-period MPD (content + ad periods). ssai.dash_multi_rung emits one Representation per rung.
      parameters:
        - { name: origin, in: query, schema: { type: string }, description: CMAF content master/media URL }
        - { name: placement_id, in: query, schema: { type: string } }
        - { name: geo, in: query, schema: { type: string } }
        - { name: device, in: query, schema: { type: string } }
      responses: { "200": { description: DASH MPD, content: { application/dash+xml: { schema: { type: string } } } } }
  /v1/ssai/seg:
    get:
      tags: [SSAI]
      summary: Per-ad-segment beacon + redirect
      description: Fires the embedded pre-signed tracker beacon(s) server-side, then 302-redirects to the conditioned media segment.
      parameters:
        - { name: beacon, in: query, schema: { type: array, items: { type: string } }, description: pre-signed tracker URLs to fire }
        - { name: redir, in: query, required: true, schema: { type: string }, description: media segment to redirect to }
        - { name: session, in: query, schema: { type: string } }
        - { name: ad, in: query, schema: { type: string } }
        - { name: break, in: query, schema: { type: integer } }
        - { name: seg, in: query, schema: { type: integer } }
      responses: { "302": { description: Redirect to the media segment (beacons fired) } }

  # ============================================================
  # Simulator - single source of truth for realism params
  # ============================================================
  /v1/sim/realism:
    get:
      tags: [Dev Tools]
      summary: Encode a consent regime + identity type as signed query params
      parameters:
        - { name: consent, in: query, schema: { type: string, enum: [us_clear, gdpr_consented, gdpr_no_consent, ccpa_opt_out, gpc, coppa, gpp_opt_out] } }
        - { name: identity, in: query, schema: { type: string, enum: [anonymous, publisher_id, uid2, hashed_email] } }
        - { name: seed, in: query, schema: { type: string } }
      responses: { "200": { description: "{ query: <url-encoded consent/identity params> }", content: { application/json: { schema: { type: object, properties: { query: { type: string } } } } } } }
  /v1/sim/personas:
    get:
      tags: [Dev Tools]
      summary: List simulator personas (weighted registry)
      responses: { "200": { description: JSON array of personas } }

  # ============================================================
  # Transcoder - runtime ad conditioning (internal, SSAI-only)
  # ============================================================
  /v1/transcode/condition:
    post:
      tags: [Ad Serving]
      summary: "[Internal] Condition an ad to a content profile (cache-first)"
      description: Transcodes + segments an ad to a byte-compatible HLS/CMAF profile and caches it. ?cache_only=1 returns a hit or 404 (never transcodes) — the SSAI serving path.
      parameters: [{ name: cache_only, in: query, schema: { type: string }, description: "'1' = cache-only (404 on miss)" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creative_id, media_url]
              properties:
                creative_id: { type: string }
                media_url: { type: string }
                profile: { $ref: "#/components/schemas/TranscodeProfile" }
      responses:
        "200": { description: Conditioned, content: { application/json: { schema: { $ref: "#/components/schemas/Conditioned" } } } }
        "404": { description: cache_only miss (not conditioned yet) }
        "502": { description: Conditioning failed }

  # ============================================================
  # Tracker - video/audio/conversion events
  # ============================================================
  /v1/t/video:
    get:
      tags: [Tracker]
      summary: Video quartile / error event
      description: >-
        tid/event/attribution/sig are HMAC-signed by the server. ec/cb/ts/pos
        are UNSIGNED, player-substituted IAB bracket macros (VAST 4.2 §6)
        appended after signing — the tracker excludes exactly these four from
        signature validation. ec (VAST error code) is honored only on
        event=error: a valid table code is stored, a literal "[ERRORCODE]"
        records 900 (macro-incapable player), anything else records 0.
      parameters:
        - { name: tid, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { type: string, enum: [start, firstQuartile, midpoint, thirdQuartile, complete, mute, unmute, pause, resume, skip, fullscreen, error] } }
        - { name: sig, in: query, schema: { type: string } }
        - { name: ec, in: query, schema: { type: string }, description: "VAST 4.2 error code, player-substituted [ERRORCODE]; unsigned" }
        - { name: cb, in: query, schema: { type: string }, description: "player-substituted [CACHEBUSTING]; unsigned, not stored" }
        - { name: ts, in: query, schema: { type: string }, description: "player-substituted [TIMESTAMP] (ISO 8601); unsigned, not stored" }
        - { name: pos, in: query, schema: { type: string }, description: "player-substituted [ADPLAYHEAD] (HH:MM:SS.mmm) → position_ms; unsigned" }
      responses: { "204": { description: Recorded } }
  /v1/t/audio:
    get:
      tags: [Tracker]
      summary: Audio quartile / error event
      description: Same contract as /v1/t/video, including the unsigned ec/cb/ts/pos bracket-macro params.
      parameters:
        - { name: tid, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { type: string } }
        - { name: sig, in: query, schema: { type: string } }
        - { name: ec, in: query, schema: { type: string }, description: "VAST error code on event=error; unsigned" }
        - { name: cb, in: query, schema: { type: string }, description: "cache buster; unsigned, not stored" }
        - { name: ts, in: query, schema: { type: string }, description: "ISO 8601 timestamp; unsigned, not stored" }
        - { name: pos, in: query, schema: { type: string }, description: "playhead HH:MM:SS.mmm → position_ms; unsigned" }
      responses: { "204": { description: Recorded } }
  /v1/t/rt:
    get:
      tags: [Tracking]
      summary: Retargeting pixel (embedded on advertiser sites)
      description: >-
        Records a consent-gated site_visit behaviour row attributed to the
        advertiser account (aid) and its self-chosen tag. No HMAC (third-party
        pages can't sign); consent params (gdpr/gdpr_consent/us_privacy/gpp/
        gpc/coppa) are evaluated at capture, and the 1x1 pixel always renders
        so the page can't observe the decision. Behavioural rules
        {event: site_visit, tag, min_count} turn visits into retargeting
        segments.
      parameters:
        - { name: aid, in: query, required: true, schema: { type: string, format: uuid }, description: advertiser account id }
        - { name: tag, in: query, schema: { type: string }, description: advertiser-chosen pixel label }
        - { name: uid, in: query, required: true, schema: { type: string }, description: hashed user id (hash client-side; no raw PII) }
      responses: { "200": { description: 1x1 GIF (always) } }
  /v1/t/conv:
    get:
      tags: [Tracker]
      summary: Conversion event (CPA billing trigger — signature always enforced)
      parameters:
        - { name: tid, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: rev, in: query, schema: { type: string } }
        - { name: cur, in: query, schema: { type: string, default: USD } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Recorded (1x1 GIF) }
        "403": { description: Invalid signature }
        "410": { description: Expired }

  # ============================================================
  # Public API - Auth (session login / signup / bootstrap)
  # ============================================================
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Browser login (form POST → session cookie)
      description: >-
        Validates email + password against team_members and sets a signed JWT
        in an httpOnly `session` cookie (SameSite=Lax, 12h expiry), then 303
        redirects to the caller's portal (advertiser / publisher / staff by
        account type). Unknown email and wrong password return the same 401
        message (no user enumeration). Agencies get their managed-account list
        embedded in the session claims (drives act-as).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "303": { description: Logged in — redirect to the portal, session cookie set }
        "400": { description: email and password required }
        "401": { description: Invalid email or password }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clears the session cookie)
      responses:
        "303": { description: Session cookie cleared — redirect to /login }
  /v1/auth/revoke-sessions:
    post:
      tags: [Auth]
      summary: Revoke all sessions (log out everywhere / stolen token; staff can target another user)
      description: >-
        Kills every outstanding token for a user by stamping a revocation
        checkpoint at now. Any token issued before this instant — including any
        copy held elsewhere — is rejected on its next request. With no body the
        AUTHENTICATED CALLER revokes their own sessions (their cookie is cleared
        too). A STAFF caller (platform user with support:update) may pass
        {"user_id":"<team-member-uuid>"} to revoke ANOTHER user's sessions — the
        help-desk response for a user whose device was lost/stolen. A non-staff
        caller supplying user_id is forbidden.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: Team-member id of the user to revoke (staff only). Omit to revoke your own sessions.
      responses:
        "200": { description: Sessions revoked (caller's cookie cleared on self-revoke) }
        "400": { description: user_id present but not a valid UUID }
        "401": { description: Not authenticated }
        "403": { description: Non-staff caller supplied user_id }
        "500": { description: Revocation store unavailable — sessions not revoked }
  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Self-serve account signup (advertiser or publisher)
      description: >-
        Creates an account + owner team member and auto-logs in (session
        cookie + 303 redirect to the portal). Password minimum 8 characters.
        Staff/agency accounts are provisioned internally, not via signup.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, email, password, account_type]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                account_type: { type: string, enum: [advertiser, publisher] }
      responses:
        "303": { description: Account created — logged in, redirect to the portal }
        "400": { description: Missing fields, short password, or invalid account_type }
        "409": { description: An account with that email already exists }
  /v1/auth/bootstrap:
    post:
      tags: [Auth]
      summary: One-shot operator API key mint (fresh deploy)
      description: >-
        Gated by the PLATFORM_ROOT_PASSWORD env var (constant-time compare).
        On success mints the `bootstrap-admin-key` secrets row and returns the
        key value ONCE. Self-disables — once the row exists every subsequent
        call returns 410 regardless of password. Rotate/revoke via the
        secrets UI thereafter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: must equal PLATFORM_ROOT_PASSWORD }
      responses:
        "200": { description: "{ name, value, note } — value shown ONCE" }
        "401": { description: Incorrect password }
        "410": { description: Bootstrap already used — rotate via the secrets UI }
        "503": { description: Bootstrap not configured (no PLATFORM_ROOT_PASSWORD) or secrets store unavailable }

  # ============================================================
  # Operator API - Live config + service registry
  # ============================================================
  /v1/config:
    get:
      tags: [Config]
      summary: Read live config (config:read)
      description: >-
        One endpoint, mode-switched by query param. Plain GET lists every live
        key→value; ?key= returns one. ?schema=true returns the registered
        schema (key, type, default, description, service, tier, deprecated)
        merged with current values + source provenance (?service= filters,
        ?pod= resolves per-pod). ?resolved=true&key=&pod= returns the full
        resolution record { key, tier, value, source
        (postgres-pod|postgres-global|env|default), pod_id, env_key, default,
        redacted }. ?history=true returns the change audit trail (per-key with
        ?key=, else the platform-wide tail). Per-pod rows SHADOW the global
        row for the same key.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: query, schema: { type: string } }
        - { name: schema, in: query, schema: { type: string, enum: ["true"] } }
        - { name: resolved, in: query, schema: { type: string, enum: ["true"] } }
        - { name: history, in: query, schema: { type: string, enum: ["true"] } }
        - { name: service, in: query, schema: { type: string }, description: "with ?schema=true — filter to one service" }
        - { name: pod, in: query, schema: { type: string }, description: pod id to resolve source/value for }
      responses:
        "200": { description: "Key→value map, single { key, value }, schema array, resolved record, or history array per the mode params" }
    put:
      tags: [Config]
      summary: Set a live config key (config:update)
      description: >-
        Writes the value (schema-validated) and fans the change out via NATS
        so every pod's poller picks it up sub-second. Empty pod_id writes the
        GLOBAL row; a non-empty pod_id writes a per-pod override, which
        shadows the global value on that pod.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string }
                value: { type: string }
                pod_id: { type: string, description: "empty = global; else per-pod override" }
      responses:
        "200": { description: "{ key, value, status: updated }" }
        "201": { description: "{ key, value, status: updated } — the row did not exist before" }
        "400": { description: Schema validation failed }
    delete:
      tags: [Config]
      summary: Delete a live config row (config:update)
      description: Deleting a row reverts the key to env-var/default resolution on the next poll; the DELETE is broadcast so pods revert immediately.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: pod, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ key, status: deleted }" }
        "400": { description: key required }
  /v1/services:
    get:
      tags: [Config]
      summary: Service registry — every running pod + its config schema (config:read)
      description: >-
        Flat pod list by default — [{ pod_id, service, version, host, port,
        schema_entries, status, started_at, last_ping_at }]. ?grouped=true
        groups by service with the per-service schema union (what the config
        manager UI reads).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: grouped, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: Pod list, or service groups with schema unions }

  # ============================================================
  # Public API - Conversion setup (advertiser)
  # ============================================================
  /v1/api/conversions:
    get:
      tags: [Conversions]
      summary: List conversion-event configs (campaigns:read)
      description: Tenant-scoped. Each config includes the ready-to-embed tracker pixel `<img>` + JS snippet pointing at /v1/t/conv, and an optional Privacy Sandbox ARA trigger beacon (`ara_beacon`) pointing at /v1/t/ara/trigger (reporting-only, never bills).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, name, event_type, default_value, currency, status, created_at, pixel, snippet, ara_beacon }]" }
    post:
      tags: [Conversions]
      summary: Create a conversion-event config (campaigns:create)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                event_type: { type: string, enum: [purchase, signup, lead, custom], default: custom }
                default_value: { type: number, minimum: 0 }
                currency: { type: string, default: USD }
      responses:
        "201": { description: "The created config incl. pixel + snippet + ara_beacon" }
        "400": { description: Missing name or invalid event_type }
    delete:
      tags: [Conversions]
      summary: Delete a conversion-event config (campaigns:delete)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ id, status: deleted }" }
        "404": { description: Not found (or not the caller's) }
  /v1/api/conversion-key:
    get:
      tags: [Conversions]
      summary: List the account's S2S conversion signing keys (campaigns:read)
      description: >-
        The per-advertiser HMAC keys that sign server-to-server /v1/t/conv
        postbacks (G7 — the tracker validates by advid so no other advertiser
        can forge a conversion billed to this account). Values are MASKED on
        GET (value_preview only).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, name, status (active|rotating), value_preview, created_at, rotated_at? }]" }
        "503": { description: Secrets store unavailable }
    post:
      tags: [Conversions]
      summary: Generate / rotate the conversion signing key (campaigns:create)
      description: >-
        Atomic rotation — the current active key (if any) demotes to
        `rotating` and keeps validating during the grace window; the new key
        becomes active. The full value is returned ONCE and never again.
        Publishes the tracker cache invalidate so validation picks up the new
        key immediately.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: "{ id, value (shown once), note }" }
        "503": { description: Secrets store unavailable }

  # ============================================================
  # Public API - Invoices (advertiser, read-only)
  # ============================================================
  /v1/api/invoices:
    get:
      tags: [Billing]
      summary: Invoice history (billing:view)
      description: Tenant-scoped, read-only — invoices are written by the monthly invoice-runner from billed committed spend. Totals are dollars (converted from micros at generation). Max 500, newest period first.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ invoices: [{ id, period_start, period_end, total, currency, status, due_date }] }" }
  /v1/api/invoices/{id}:
    get:
      tags: [Billing]
      summary: Invoice detail + per-campaign line items (billing:view)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "Invoice header + lines: [{ campaign_id, campaign_name, impressions, clicks, conversions, spend, bid_model }] ordered by spend desc" }
        "404": { description: Not found — a cross-tenant id is indistinguishable from missing }

  # ============================================================
  # Staff API - Billing terms (prepay/invoiced posture)
  # ============================================================
  /v1/api/billing/terms:
    get:
      tags: [Billing]
      summary: Read an advertiser's billing terms (staff, support:read)
      description: "Defaults to { payment_terms: prepay, credit_limit: 0 } for accounts that never topped up."
      security: [{ bearerAuth: [] }]
      parameters: [{ name: account_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ account_id, payment_terms (prepay|invoiced), credit_limit }" }
    put:
      tags: [Billing]
      summary: Set an advertiser's billing terms (staff, support:update, audit-logged)
      description: >-
        Invoiced accounts may bid on credit up to credit_limit; prepay
        normalises credit_limit to 0. Upserts the advertiser_balances row and
        publishes the balance cache-invalidate so the DSP funding gate
        re-reads the new terms within NATS RTT. Advertisers see their mode
        read-only via /v1/api/billing/topup — only staff change it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, payment_terms]
              properties:
                account_id: { type: string, format: uuid }
                payment_terms: { type: string, enum: [prepay, invoiced] }
                credit_limit: { type: number, minimum: 0 }
      responses:
        "200": { description: The stored terms (echoed) }
        "400": { description: Invalid account_id / payment_terms / negative credit_limit }

  # ============================================================
  # Publisher API - Payout method + ads.txt integration
  # ============================================================
  /v1/api/payout-method:
    get:
      tags: [Payouts]
      summary: Read the payout destination (earnings:view)
      description: Tenant-scoped. Raw destination details are stored but NEVER returned — reads expose only a masked tail.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ configured, method_type?, display_name?, masked_tail?, minimum_payout_cents?, currency, status? } — { configured: false, currency } when unset" }
    put:
      tags: [Payouts]
      summary: Upsert the payout destination (earnings:manage, audit-logged)
      description: >-
        One active method per account. Destination detail is required for the
        method_type on first-time config (paypal_email for paypal,
        account_number for bank_transfer, iban for payoneer/wire); a masked
        round-trip that omits details keeps the stored value. The audit entry
        records the masked tail, never the raw destination.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method_type]
              properties:
                method_type: { type: string, enum: [bank_transfer, paypal, payoneer, wire] }
                display_name: { type: string }
                details:
                  type: object
                  properties:
                    paypal_email: { type: string }
                    account_number: { type: string }
                    iban: { type: string }
                minimum_payout_cents: { type: integer, minimum: 0 }
                currency: { type: string, default: USD }
      responses:
        "200": { description: The stored method, masked (same shape as GET) }
        "400": { description: Invalid method_type or missing destination detail on first-time config }
  /v1/api/integration/adstxt:
    get:
      tags: [Placements]
      summary: The ads.txt line publishers should publish for this platform
      description: >-
        Read from the SAME live config the exchange enforces on
        (exchange.adstxt_seller_domain/id/enforcement), so the surfaced line
        always matches what strict mode checks. configured=false until the
        seller domain/id are set.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ configured, seller_domain, seller_id, relationship: DIRECT, line, enforcement (off|warn|strict), sellers_json_url }" }

  # ============================================================
  # Public API - Notifications (portal bell)
  # ============================================================
  /v1/api/notifications:
    get:
      tags: [Notifications]
      summary: Recent in-app notifications + unread count
      description: Tenant-scoped to the session account; rows are written by the notifications consumer from business events (budget/balance depleted, campaign state changes, report completed). Newest first, max 30.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ notifications: [{ id, account_id, kind, title, body?, ref_id?, read, created_at }], unread }" }
        "503": { description: Notification store unavailable }
  /v1/api/notifications/read:
    post:
      tags: [Notifications]
      summary: Mark one notification (or all) read
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: exactly one of id / all
              properties:
                id: { type: string, format: uuid }
                all: { type: boolean }
      responses:
        "200": { description: "{ status: ok, id? }" }
        "400": { description: Neither id nor all supplied }
        "404": { description: id not found for this account }

  # ============================================================
  # Operator API - Privacy opt-out intake (X-API-Key)
  # ============================================================
  /v1/api/privacy/optout:
    post:
      tags: [Privacy]
      summary: Record a user opt-out (levels 1-3)
      description: >-
        Operator-API-key auth. Upserts the opt_out_registry row (level 1 = no
        personalisation, 2 = no tracking, 3 = full deletion), publishes the
        OptOutEvent, and fans out the opt-out cache invalidate so the DSP
        stops bidding for the user within NATS RTT.
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, level]
              properties:
                user_id: { type: string }
                level: { type: integer, minimum: 1, maximum: 3 }
                source: { type: string, default: api, description: "e.g. dsar_portal, gpc, support" }
      responses:
        "200": { description: "{ user_id, level, status: recorded }" }
        "400": { description: Missing user_id or level outside 1-3 }

  # ============================================================
  # Public API - Retargeting audiences (advertiser)
  # ============================================================
  /v1/api/audiences/retargeting:
    get:
      tags: [Audiences]
      summary: List real-time retargeting audiences (audiences:read)
      description: Tenant-scoped. These segments are the targets of the /v1/t/rt pixel — enrollment happens within seconds via the audience-rt consumer. members is the live non-expired enrollment count.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, name, tag, window_days, members, updated_at }]" }
    post:
      tags: [Audiences]
      summary: Create a retargeting audience (audiences:create)
      description: "Creates the segment with rule { event: site_visit, tag, min_count: 1, window_days } for the caller's account (advertiser only; any account_id in the body is ignored)."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag]
              properties:
                name: { type: string }
                tag: { type: string, description: the pixel's tag label }
                window_days: { type: integer, default: 30 }
      responses:
        "201": { description: "{ id }" }
        "400": { description: Missing name or tag }

  # ============================================================
  # Staff API - Cross-tenant oversight (retargeting + channels)
  # ============================================================
  /v1/api/staff/retargeting:
    get:
      tags: [Staff]
      summary: Retargeting audiences across ALL advertisers (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ advertiser, segment, tag, window_days, members, updated_at }] — platform-wide" }
  /v1/api/staff/channels:
    get:
      tags: [Staff]
      summary: Platform-wide per-channel activity breakdown (support:read)
      description: Proxied to reporting's /v1/reporting/channels with staff scope — impressions + cost grouped by channel over the last 7 days.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "QueryResult { columns: [channel, count, sum_cost], rows }" }
        "502": { description: Reporting unreachable }
  /v1/api/staff/shading:
    get:
      tags: [Staff]
      summary: Per-placement bid-shading state, read-only (support:read)
      description: Proxied server-side to the DSP's internal /v1/dsp/shading. Body is the DSP's map keyed by placement_id; values use Go field names (no json tags) — TotalBids, Wins, Losses, WinRate, AvgClearing, BelowFloor, Outbid. Shading is model-driven; there are no knobs.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ <placement_id>: { TotalBids, Wins, Losses, WinRate, AvgClearing, BelowFloor, Outbid } }" }
        "502": { description: DSP unreachable }
  /v1/api/privacy/status:
    get:
      tags: [Privacy]
      summary: Staff opt-out lookup for one identity (support:read)
      description: Never-opted-out is a valid answer (opted_out false, level 0), not a 404. Levels — 1 no personalisation, 2 no tracking, 3 full GDPR/CCPA deletion.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: user / device / household id }
      responses:
        "200": { description: "{ user_id, opted_out, level, source?, requested_at?, completed_at?, verified_at? }" }
        "400": { description: id missing }
  /v1/api/privacy/optouts:
    get:
      tags: [Privacy]
      summary: Recent opt-outs, newest first, limit 100 (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ user_id, level, source, requested_at, completed_at?, verified_at? }]" }
    post:
      tags: [Privacy]
      summary: Staff opt-out intake on behalf of a user (support:update)
      description: Delegates to the same recorder as the operator-key /v1/api/privacy/optout (write + OptOutEvent + cache invalidate) so the two intakes can't drift. source is FORCED to staff:<actor user id> and the action is audit-logged — a staff-recorded opt-out (level 3 is irreversible erasure) is always attributable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, level]
              properties:
                user_id: { type: string }
                level: { type: integer, enum: [1, 2, 3] }
      responses:
        "200": { description: "{ user_id, level, status: recorded }" }
        "503": { description: Opt-out intake unavailable }

  # ============================================================
  # Staff API - House ads (no-bid fallback creatives)
  # ============================================================
  /v1/api/house-ads:
    get:
      tags: [House Ads]
      summary: List house ads (support:read)
      description: Platform-global (no tenant scope) — the platform's own fallback creatives served on a no-bid when the fill switch is on.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "[{ id, format, name, markup, landing_url, enabled, weight, created_at, updated_at }]" }
    post:
      tags: [House Ads]
      summary: Create a house ad (support:update, audit-logged)
      description: Markup is HTML for display/native, inline VAST XML for video/audio. Mutations publish the house-ads cache invalidate so the publisher ad server reloads sub-second.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, name, markup]
              properties:
                format: { type: string, enum: [display, video, native, audio] }
                name: { type: string }
                markup: { type: string }
                landing_url: { type: string }
                enabled: { type: boolean }
                weight: { type: integer, minimum: 0 }
      responses:
        "201": { description: "{ id, status: created }" }
        "400": { description: Invalid format/name/markup/weight }
  /v1/api/house-ads/{id}:
    put:
      tags: [House Ads]
      summary: Update a house ad (support:update, audit-logged)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, name, markup]
              properties:
                format: { type: string, enum: [display, video, native, audio] }
                name: { type: string }
                markup: { type: string }
                landing_url: { type: string }
                enabled: { type: boolean }
                weight: { type: integer, minimum: 0 }
      responses:
        "200": { description: "{ id, status: updated }" }
        "404": { description: Not found }
    delete:
      tags: [House Ads]
      summary: Delete a house ad (support:update, audit-logged)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: "{ id, status: deleted }" }
        "404": { description: Not found }
  /v1/api/house-ads/fill:
    get:
      tags: [House Ads]
      summary: Read the house-ad fill master switch (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ enabled }" }
    put:
      tags: [House Ads]
      summary: Toggle serving house ads on a no-bid (support:update, audit-logged)
      description: Sets the GLOBAL publisher_adserver.stub_on_nobid config row AND clears any per-pod override rows for the key (per-pod rows would otherwise shadow the global value), so the switch takes effect platform-wide.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: "{ enabled }" }

  # ============================================================
  # Staff API - Guided demos (isolated synthetic data)
  # ============================================================
  # All five demos share one response shape:
  #   { ran, account_id, steps: [{ n, title, narration, data }], summary, ran_at? }
  # GET returns the last-run snapshot (support:read; ran=false if never run);
  # POST .../run executes the demo against real platform machinery over an
  # isolated synthetic account (support:update) and returns the fresh
  # 5-step timeline. data is step-specific (documented per demo).
  /v1/api/demo/onboarding:
    get:
      tags: [Demos]
      summary: Onboarding & Expansion demo — last-run snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Demo snapshot — steps cover identity edges → CRM upload → profile before → cluster expansion → profile after" }
  /v1/api/demo/onboarding/run:
    post:
      tags: [Demos]
      summary: Run the Onboarding & Expansion demo (support:update)
      description: Resets the isolated demo account, re-seeds synthetic identity edges + the empty demo segment, runs the REAL ingest path and profile-builder, and returns the 5-step upload→cluster→expand timeline.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fresh demo timeline }
        "503": { description: Demo backend unavailable (Postgres down at boot) }
  /v1/api/demo/trace:
    get:
      tags: [Demos]
      summary: Auction Trace demo — last-run snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Demo snapshot — persona → request (trace_id) → auction (winner, clearing price) → serve+track → data destinations" }
  /v1/api/demo/trace/run:
    post:
      tags: [Demos]
      summary: Run the Auction Trace demo (support:update)
      description: Fires ONE fixed-persona request through the real SSP serve path, captures X-Trace-Id, polls the trace reader until the impression lands, and returns the 5-step timeline.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fresh demo timeline }
        "503": { description: Demo backend unavailable }
  /v1/api/demo/billing:
    get:
      tags: [Demos]
      summary: Billing / Money Flow demo — last-run snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Demo snapshot — winning impression → balance before → CPM/1000 math → ledger drawdown deltas → invoice tie-back" }
  /v1/api/demo/billing/run:
    post:
      tags: [Demos]
      summary: Run the Billing demo (support:update)
      description: Fires one real request so a real advertiser wins, snapshots prepay balance + committed spend, fires the REAL impression beacon (the billable event), polls until the drawdown lands, and returns the before→after money timeline.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fresh demo timeline }
        "503": { description: Demo backend unavailable }
  /v1/api/demo/rollups:
    get:
      tags: [Demos]
      summary: Rollups demo — last-run snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Demo snapshot — N impressions fired → raw rows landed → GROUP BY collapse (identical totals) → coarser = fewer → the retention ladder" }
  /v1/api/demo/rollups/run:
    post:
      tags: [Demos]
      summary: Run the Rollups demo (support:update)
      description: Fires N real impressions, waits for them to land, then queries raw count vs the same count grouped by the rollup dimensions to prove the collapse (fewer rows, identical totals).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fresh demo timeline }
        "503": { description: Demo backend unavailable }
  /v1/api/demo/retargeting:
    get:
      tags: [Demos]
      summary: Retargeting demo — last-run snapshot (support:read)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Demo snapshot — synthetic person + rule → real /v1/t/rt pixel + lake row → segment before → rule match + cluster expand → segment after" }
  /v1/api/demo/retargeting/run:
    post:
      tags: [Demos]
      summary: Run the Retargeting demo (support:update)
      description: Resets the isolated demo account, seeds identity edges + a site_visit rule segment, fires the REAL retargeting pixel AND writes the behaviour row to the lake, runs the real profile-builder, and returns the visit→enrollment timeline.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fresh demo timeline }
        "503": { description: Demo backend unavailable (no lake/object store) }

  # ============================================================
  # Public API - Attribution (multi-touch)
  # ============================================================
  /v1/api/attribution:
    get:
      tags: [Reports]
      summary: Multi-touch attribution chain for a conversion
      description: >-
        Requires reports:read. Proxied to reporting with the same
        scope-injection as /v1/api/trace — staff unscoped, advertiser scoped
        to its account (cross-tenant conversions 403), publisher sessions
        denied. Returns the conversion's exposure chain with per-touchpoint
        credit apportioned under the requested model.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversion_trace, in: query, required: true, schema: { type: string }, description: trace id of the conversion event }
        - { name: model, in: query, schema: { type: string, default: linear }, description: attribution model }
      responses:
        "200": { description: "{ conversion_trace_id, model, revenue, touchpoints: [{ trace_id, type (impression|click), at, credit_fraction, credit_revenue }] } — empty touchpoints when no chain" }
        "400": { description: conversion_trace required }
        "403": { description: Cross-tenant conversion, or publisher session }

  /healthz:
    get:
      tags: [Dev Tools]
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      tags: [Dev Tools]
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Operator API key from the secrets store (minted via /v1/auth/bootstrap, rotated via /v1/api/secrets). Used by the operator endpoints (secrets, identity-links, privacy opt-out).

  schemas:
    BidModifiers:
      type: object
      description: Per-signal bid adjustments (percentages, -100..1000).
      properties:
        device: { type: object, additionalProperties: { type: number } }
        geo_country: { type: object, additionalProperties: { type: number } }
        audience: { type: object, additionalProperties: { type: number }, description: "segment id → % adjustment, applied when the (consent-gated) bid request carries the segment" }
        time_of_day:
          type: array
          items:
            type: object
            properties:
              start_hour: { type: integer }
              end_hour: { type: integer }
              modifier: { type: number }
    FrequencyCap:
      type: object
      properties:
        limit: { type: integer, description: "<= 0 clears the cap" }
        window: { type: string, enum: [hour, day, week], default: day }
    CampaignInput:
      type: object
      required: [name]
      description: Create-campaign body (full targeting + modifiers + creatives).
      properties:
        name: { type: string }
        base_bid: { type: number, default: 2.50 }
        daily_budget: { type: number, default: 500 }
        total_budget: { type: number }
        format: { type: string, enum: [display, native, video, audio], default: display }
        bid_strategy: { type: string, enum: [cpm, cpc, cpa, vcpm, cpcv], default: cpm }
        pacing_mode: { type: string, enum: [even, asap, front_loaded], default: even }
        creative_rotation: { type: string, enum: [even, weighted, bandit, sequential], default: bandit }
        timezone: { type: string, description: IANA name, default: UTC }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        include_geo: { type: array, items: { type: string } }
        exclude_geo: { type: array, items: { type: string } }
        include_device: { type: array, items: { type: string } }
        exclude_device: { type: array, items: { type: string } }
        include_domains: { type: array, items: { type: string } }
        exclude_domains: { type: array, items: { type: string } }
        include_categories: { type: array, items: { type: string } }
        exclude_categories: { type: array, items: { type: string } }
        include_os: { type: array, items: { type: string } }
        include_keywords: { type: array, items: { type: string } }
        exclude_keywords: { type: array, items: { type: string } }
        include_inventory_type: { type: array, items: { type: string } }
        include_segments: { type: array, items: { type: string } }
        exclude_segments: { type: array, items: { type: string } }
        bid_modifiers: { $ref: "#/components/schemas/BidModifiers" }
        frequency_cap: { $ref: "#/components/schemas/FrequencyCap" }
        viewability_target_pct: { type: integer, minimum: 0, maximum: 100 }
    CampaignUpdate:
      type: object
      description: Partial update — omitted fields unchanged; empty arrays clear a list.
      properties:
        base_bid: { type: number }
        daily_budget: { type: number }
        status: { type: string, enum: [live, paused, archived, ended] }
        bid_strategy: { type: string, enum: [cpm, cpc, cpa, vcpm, cpcv] }
        pacing_mode: { type: string, enum: [even, asap, front_loaded] }
        timezone: { type: string }
        creative_rotation: { type: string, enum: [even, weighted, bandit, sequential] }
        creatives:
          type: array
          items:
            type: object
            properties:
              creative_id: { type: string, format: uuid }
              weight: { type: integer }
        include_geo: { type: array, items: { type: string } }
        exclude_geo: { type: array, items: { type: string } }
        include_device: { type: array, items: { type: string } }
        include_segments: { type: array, items: { type: string } }
        bid_modifiers: { $ref: "#/components/schemas/BidModifiers" }
        frequency_cap: { $ref: "#/components/schemas/FrequencyCap" }
    FloorConfig:
      type: object
      description: Per-device / per-geo / dayparting price floors for a placement.
      properties:
        device: { type: object, additionalProperties: { type: number }, description: device -> cpm floor }
        geo: { type: object, additionalProperties: { type: number }, description: country -> cpm floor }
        timezone: { type: string }
        dayparts:
          type: array
          items:
            type: object
            properties:
              days: { type: array, items: { type: integer }, description: "0=Sun..6=Sat; empty=every day" }
              start_hour: { type: integer }
              end_hour: { type: integer }
              floor: { type: number }
    VideoConfig:
      type: object
      description: Video placement constraints (OpenRTB video object).
      properties:
        skippable: { type: boolean }
        skip_after: { type: integer }
        min_duration: { type: integer }
        max_duration: { type: integer }
        plcmt: { type: integer }
        linearity: { type: integer }
        w: { type: integer }
        h: { type: integer }
        mimes: { type: array, items: { type: string } }
        protocols: { type: array, items: { type: integer } }
    RevShareTier:
      type: object
      properties:
        min_impressions: { type: integer }
        max_impressions: { type: integer, description: "0 = unlimited" }
        fee_pct: { type: number }
    TranscodeProfile:
      type: object
      description: Target encoding profile for ad conditioning.
      properties:
        container: { type: string, enum: [ts, cmaf] }
        audio_only: { type: boolean }
        vcodec: { type: string, enum: [h264, hevc] }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        vbitrate_kbps: { type: integer }
        acodec: { type: string, example: aac }
        asample_rate: { type: integer }
        abitrate_kbps: { type: integer }
        seg_dur_sec: { type: integer }
    Conditioned:
      type: object
      properties:
        creative_id: { type: string }
        profile_hash: { type: string }
        cached: { type: boolean }
        duration: { type: number }
        init_uri: { type: string, description: fMP4 init URL (empty for TS) }
        segments:
          type: array
          items:
            type: object
            properties:
              uri: { type: string }
              duration: { type: number }
    QueryParams:
      type: object
      required: [table]
      properties:
        table:
          type: string
          enum: [impressions, clicks, conversions, auctions, views, media_events]
        metrics:
          type: array
          description: >-
            Base metrics aggregate columns of the chosen table; media_starts /
            media_completes are filtered counts on media_events. Derived
            metrics (ecpm, ctr, fill_rate, viewability_rate, completion_rate,
            net_revenue) are computed server-side by the metrics engine from
            their source tables.
          items:
            type: string
            enum: [count, sum_cost, avg_cost, sum_revenue, avg_duration_ms, sum_bids, sum_viewable, media_starts, media_completes, ecpm, ctr, fill_rate, viewability_rate, completion_rate, net_revenue]
        dimensions:
          type: array
          description: >-
            deal_id (impressions) always scans raw rows — it is deliberately
            not in the rollup configs. event_type (start/firstQuartile/
            midpoint/thirdQuartile/complete/...) applies to media_events.
          items:
            type: string
            enum: [campaign_id, creative_id, placement_id, publisher_id, account_id, geo, device, channel, day, hour, deal_id, event_type]
        filters:
          type: object
          additionalProperties:
            type: string
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
        limit:
          type: integer
        order_by:
          type: string
        order_dir:
          type: string
          enum: [asc, desc]

    QueryResult:
      type: object
      properties:
        Columns:
          type: array
          items:
            type: string
        Rows:
          type: array
          items:
            type: array
            items: {}

    TraceTimeline:
      type: object
      description: >
        Render-ready, already-redacted trace flow returned by /v1/api/trace. The
        server builds it per the caller's account type; hidden fields are absent
        (not zeroed) so the client never receives them.
      properties:
        traceId:
          type: string
        note:
          type: string
          description: Human status/summary line for the header.
        steps:
          type: array
          description: The timeline rows, ordered by time.
          items:
            type: object
            properties:
              time:
                type: string
                description: Offset from the first event, e.g. "0ms", "+120ms".
              service:
                type: string
                description: exchange | dsp | adserver | tracker | reporting | billing
              cls:
                type: string
                description: Visual state class (active | warn | error | nobid).
              msg:
                type: string
              detail:
                type: string
        panels:
          type: array
          description: Summary cards (redacted — advertiser sees spend, publisher sees revenue, staff sees the full split).
          items:
            type: object
            properties:
              title: { type: string }
              value: { type: string }
              label: { type: string }
              cls: { type: string }

    ImpressionRow:
      type: object
      description: One recent impression for the /v1/api/impressions/recent drill-down.
      properties:
        trace_id: { type: string }
        timestamp: { type: string, format: date-time }
        campaign_id: { type: string }
        creative_id: { type: string }
        placement_id: { type: string }
        publisher_id: { type: string }
        bid_model: { type: string }
        clearing_price_usd: { type: number }
        deal_id: { type: string }

    BidRequest:
      type: object
      description: >
        OpenRTB 2.6 bid request. Beyond the core objects this carries the
        platform's transparency + privacy + identity signals: source.ext.schain
        (SupplyChain), source.ext.adcert (ads.cert signature), regs.ext
        (GDPR/US-Privacy/GPP/GPC), and user.eids (UID2 and other extended IDs).
      properties:
        id:
          type: string
        imp:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              tagid:
                type: string
                description: Placement UUID carried through for deal + reporting matching.
              banner:
                type: object
                properties:
                  w: { type: integer }
                  h: { type: integer }
              video:
                type: object
                description: Present for video impressions (VAST). Includes protocols, api (7=OMID), duration window, skip, ad-pod fields.
                properties:
                  mimes: { type: array, items: { type: string } }
                  protocols: { type: array, items: { type: integer } }
                  api:
                    type: array
                    items: { type: integer }
                    description: Supported frameworks — 7 = OMID (Open Measurement).
                  minduration: { type: integer }
                  maxduration: { type: integer }
              native:
                type: object
                description: Present for native impressions (OpenRTB Native 1.2).
                properties:
                  request:
                    type: string
                    description: The native request object, JSON-encoded as a string.
                  ver: { type: string }
              bidfloor:
                type: number
        site:
          type: object
          properties:
            domain: { type: string }
            page: { type: string }
            cat:
              type: array
              items: { type: string }
              description: IAB Content Taxonomy 1.0 category codes (IABxx).
            publisher:
              type: object
              properties:
                id: { type: string }
        app:
          type: object
          description: Present for in-app inventory (mutually exclusive with site).
          properties:
            bundle: { type: string }
            publisher:
              type: object
              properties:
                id: { type: string }
        device:
          type: object
          properties:
            devicetype:
              type: integer
            geo:
              type: object
              properties:
                country:
                  type: string
        user:
          type: object
          properties:
            id: { type: string }
            eids:
              type: array
              description: Extended identifiers (cookieless IDs). UID2 uses source "uidapi.com".
              items:
                type: object
                properties:
                  source: { type: string }
                  uids:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        atype:
                          type: integer
                          description: 1=device/cookie, 2=person-session, 3=person-persistent (UID2).
            ext:
              type: object
              properties:
                consent:
                  type: string
                  description: IAB TCF consent string.
                segments:
                  type: array
                  items: { type: string }
        regs:
          type: object
          description: Regulatory signals gating personalisation (see /pkg/privacy).
          properties:
            coppa: { type: integer }
            ext:
              type: object
              properties:
                gdpr: { type: integer }
                us_privacy:
                  type: string
                  description: IAB US Privacy ("CCPA") string, e.g. "1YNN".
                gpp:
                  type: string
                  description: IAB Global Privacy Platform consent string.
                gpp_sid:
                  type: string
                  description: GPP section ids present in the gpp string.
                gpc:
                  type: integer
                  description: Global Privacy Control signal (1 = do-not-sell/share).
        source:
          type: object
          description: Supply-chain + authenticity provenance.
          properties:
            fd: { type: integer }
            tid: { type: string }
            ext:
              type: object
              properties:
                schain:
                  type: object
                  description: IAB SupplyChain object (ver "1.0").
                  properties:
                    complete: { type: integer }
                    ver: { type: string }
                    nodes:
                      type: array
                      items:
                        type: object
                        properties:
                          asi: { type: string, description: advertising-system domain }
                          sid: { type: string, description: seller id within that system }
                          hp: { type: integer }
                          rid: { type: string }
                adcert:
                  type: string
                  description: ads.cert Ed25519 signature (base64) over the request's canonical fields + timestamp.
                adcert_ts:
                  type: integer
                  format: int64
                  description: Unix-seconds signing time, part of the signed payload (replay protection).
        tmax:
          type: integer
          description: Max response time (ms)

    BidResponse:
      type: object
      properties:
        id:
          type: string
        seatbid:
          type: array
          items:
            type: object
            properties:
              seat:
                type: string
              bid:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    impid:
                      type: string
                    price:
                      type: number
                    cid:
                      type: string
                    crid:
                      type: string
        cur:
          type: string
        nobid:
          type: boolean

    ServeRequest:
      type: object
      properties:
        trace_id:
          type: string
        campaign_id:
          type: string
        creative_id:
          type: string
        placement_id:
          type: string
        publisher_id:
          type: string
        advertiser_id:
          type: string
        clearing_price:
          type: number
        currency:
          type: string
        width:
          type: integer
        height:
          type: integer

    ServeResponse:
      type: object
      properties:
        html:
          type: string
        impression_url:
          type: string
        click_url:
          type: string
        viewability_url:
          type: string
        trace_id:
          type: string
        clearing_price:
          type: number

    Event:
      type: object
      properties:
        type:
          type: string
          enum: [impression, click, conversion, auction]
        impression:
          type: object
        click:
          type: object
        conversion:
          type: object
        auction:
          type: object
