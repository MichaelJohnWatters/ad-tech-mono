  # ============================================================
  # Operator API - Secrets (X-API-Key)
  # ============================================================
  /v1/api/secrets:
    get:
      tags: [Secrets]
      summary: List secrets (values previewed only)
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: include_revoked, in: query, schema: { type: string } }
      responses: { "200": { description: List; value_preview only, never the full value } }
    post:
      tags: [Secrets]
      summary: Create/store a secret (full value returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, purpose]
              properties:
                name: { type: string }
                purpose: { type: string }
                owner: { type: string, default: platform }
                status: { type: string, enum: [active, rotating, revoked], default: active }
                value: { type: string, description: auto-generated when absent }
      responses: { "201": { description: "Created; response value shown ONCE" } }
  /v1/api/secrets/{id}:
    patch:
      tags: [Secrets]
      summary: Update secret status (rotate/revoke)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, rotating, revoked] } } } } }
      responses: { "204": { description: Updated } }
    delete:
      tags: [Secrets]
      summary: Delete a revoked secret
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Deleted } }

  # ============================================================
  # Public API - Webhooks
  # ============================================================
  /v1/api/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
