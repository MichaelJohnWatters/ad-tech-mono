                guaranteed_min_cpm: { type: number }
                deal_type_modifiers: { type: object, additionalProperties: { type: number }, description: "deal_type -> modifier% (-100..100)" }
                payment_terms: { type: string, enum: [prepay, net_15, net_30, net_60, net_90] }
      responses: { "200": { description: Updated } }

