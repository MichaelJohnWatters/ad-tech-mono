openapi: "3.0.3"
info:
  title: Ad Tech Platform API
  description: |
    Programmatic advertising platform API.

    ## Authentication
    All `/v1/api/*` endpoints require a JWT Bearer token.
    Get a token from `POST /v1/auth/token`.

    In dev mode (no signing key configured), all requests are auto-authenticated as admin.

    ## Visibility
    - **Public API** - customer-facing endpoints through the gateway (:8080)
    - **Internal** - service-to-service endpoints (not exposed through gateway)
    - **Dev Tools** - development/debugging endpoints
  version: "1.0.0"
  contact:
    name: Ad Tech Platform

servers:
  - url: http://localhost:8080
    description: Gateway - all endpoints accessible here (proxied to internal services)

tags:
  - name: Auth
    description: Authentication and token management
  - name: Campaigns
    description: "[Customer] Campaign management (advertiser-facing)"
  - name: Placements
    description: "[Customer] Publisher placement management"
  - name: Reports
    description: "[Customer] Analytics and reporting queries"
  - name: Creatives
    description: "[Customer] Creative asset management"
  - name: OpenRTB - Exchange
    description: "[Partner] Auction endpoints - external SSPs send bid requests here"
  - name: OpenRTB - DSP
    description: "[Partner] Bidding endpoints - exchange calls external DSPs here"
  - name: OpenRTB - Notifications
    description: "[Partner] Win/loss notifications sent to DSPs after auction"
  - name: Tracker
    description: "[Partner] Event tracking pixels - fired by end-user browsers"
  - name: Ad Serving
    description: "[Internal] Creative serving and macro substitution"
  - name: SSP
    description: "[Internal] Supply-side bid request generation"
  - name: Dev Tools
    description: "[Dev] Debugging and simulation endpoints"

paths:
  # ============================================================
  # Public API - Auth
  # ============================================================
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue a JWT token
      description: Creates a JWT token for API access. In production, validates credentials against the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: adv-acme
                account_type:
                  type: string
                  enum: [advertiser, publisher, agency, staff, admin]
                  example: advertiser
                role:
                  type: string
                  enum: [owner, manager, analyst, finance, viewer, ad_ops]
                  example: owner
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                  account_type:
                    type: string
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string

  # ============================================================
  # Public API - Campaigns (proxied to DSP)
  # ============================================================
  /v1/api/campaigns/:
    get:
      tags: [Campaigns]
      summary: List campaigns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of campaigns
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - requires campaigns:read permission

  # ============================================================
  # Public API - Placements (proxied to SSP)
  # ============================================================
  /v1/api/placements/:
    get:
      tags: [Placements]
      summary: List publisher placements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of placements
        "401":
          description: Unauthorized

  /v1/api/identity-links:
    post:
      tags: [Identity]
      summary: Ingest identity-graph edges (UID2 ↔ other ids)
      description: >
        Links a UID2 token (or any identifier) to other identifiers in the
        platform identity graph so a cookieless user resolves to a person across
        devices/publishers. Operator-API-key auth. Accepts a UID2-centric shape
        ({uid2, links:[…]}) and/or explicit edges ({edges:[…]}).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid2: { type: string }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      source: { type: string }
                      link_type: { type: string }
                      confidence: { type: number }
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      user_id: { type: string }
                      linked_id: { type: string }
                      source: { type: string }
                      link_type: { type: string }
                      confidence: { type: number }
      responses:
        "200":
          description: Edges written
          content:
            application/json:
              schema:
                type: object
                properties:
                  links_written: { type: integer }
        "400":
          description: No valid edges
        "503":
          description: Identity store unavailable

  # ============================================================
  # Public API - Reports (proxied to Reporting)
  # ============================================================
  /v1/api/reports/:
    get:
      tags: [Reports]
      summary: List available reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available report templates

  /v1/reporting/query:
    post:
      tags: [Reports]
      summary: Query the analytics store
      description: |
        Execute an analytics query. Supports aggregation by dimensions,
        time range filtering, and multiple metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryParams"
            examples:
              total_impressions:
                summary: Total impressions and spend
                value:
                  table: impressions
                  metrics: [count, sum_cost]
              by_campaign:
                summary: Impressions grouped by campaign
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [campaign_id]
              by_geo_with_time:
                summary: Impressions by geo with time filter
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [geo]
                  time_from: "2024-06-15T00:00:00Z"
                  time_to: "2024-06-16T00:00:00Z"
              auction_stats:
                summary: Auction count and average latency
                value:
                  table: auctions
                  metrics: [count, avg_duration_ms]
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /v1/reporting/events:
    post:
      tags: [Reports]
      summary: Ingest events (standalone mode)
      description: Push events directly to the analytics store over HTTP. Used when NATS is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Event"
      responses:
        "204":
          description: Events ingested

  # ============================================================
  # Internal - OpenRTB (Exchange)
  # ============================================================
  /v1/openrtb/auction:
    post:
      tags: [OpenRTB - Exchange]
      summary: Submit bid request and run auction
      description: |
        Receives a bid request, fans out to all configured DSPs in parallel,
        runs a first-price auction, and returns the winning bid.
        Sends win/loss notifications to all participating DSPs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Auction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/bid:
    post:
      tags: [OpenRTB - DSP]
      summary: Evaluate bid request (DSP endpoint)
      description: Called by the Exchange. Evaluates all active campaigns against the bid request and returns the best bid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Bid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/win:
    get:
      tags: [OpenRTB - Notifications]
      summary: Win notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: price
          in: query
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  /v1/openrtb/loss:
    get:
      tags: [OpenRTB - Notifications]
      summary: Loss notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: integer
            enum: [100, 102, 103, 104]
            description: "100=below floor, 102=outbid, 103=blocked, 104=creative rejected"
        - name: clearing_price
          in: query
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Tracker
  # ============================================================
  /v1/t/imp:
    get:
      tags: [Tracker]
      summary: Impression pixel (1x1 GIF)
      description: Fired by the browser when an ad renders. Returns a 1x1 transparent GIF.
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
          description: Trace ID
        - name: cid
          in: query
          schema:
            type: string
          description: Campaign ID
        - name: crid
          in: query
          schema:
            type: string
          description: Creative ID
        - name: pid
          in: query
          schema:
            type: string
          description: Placement ID
        - name: pubid
          in: query
          schema:
            type: string
          description: Publisher ID
        - name: price
          in: query
          schema:
            type: number
          description: Clearing price
      responses:
        "200":
          description: 1x1 transparent GIF
          content:
            image/gif: {}

  /v1/t/click:
    get:
      tags: [Tracker]
      summary: Click redirect (302)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: redir
          in: query
          required: true
          schema:
            type: string
          description: Landing page URL
      responses:
        "302":
          description: Redirect to landing page

  /v1/t/view:
    get:
      tags: [Tracker]
      summary: Viewability beacon (204)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: dur
          in: query
          schema:
            type: integer
          description: Duration visible (ms)
        - name: pct
          in: query
          schema:
            type: integer
          description: Percent of ad visible
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Ad Server
  # ============================================================
  /v1/ad/serve:
    post:
      tags: [Ad Serving]
      summary: Serve an ad creative with macro substitution
      description: Called after auction win. Substitutes macros in creative HTML and generates tracking pixel URLs with full context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServeRequest"
      responses:
        "200":
          description: Rendered ad with tracking URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServeResponse"

  # ============================================================
  # Internal - SSP
  # ============================================================
  /v1/ssp/request:
    get:
      tags: [SSP]
      summary: Generate bid request for a placement
      parameters:
        - name: placement_id
          in: query
          schema:
            type: string
          example: pl-news-mpu
        - name: geo
          in: query
          schema:
            type: string
          example: GBR
        - name: device
          in: query
          schema:
            type: string
            enum: [mobile, desktop, tablet]
      responses:
        "200":
          description: Bid request sent to exchange, response returned

  # ============================================================
  # Dev Tools
  # ============================================================
  /v1/dsp/campaigns:
    get:
      tags: [Dev Tools]
      summary: List DSP campaigns (debug)
      responses:
        "200":
          description: All loaded campaigns

  /v1/dsp/shading:
    get:
      tags: [Dev Tools]
      summary: Win-rate shading data (debug)
      responses:
        "200":
          description: Per-placement win/loss stats

  /v1/ssp/placements:
    get:
      tags: [Dev Tools]
      summary: List SSP placements (debug)
      responses:
        "200":
          description: All loaded placements

  /v1/ad/creatives:
    get:
      tags: [Dev Tools]
      summary: List ad server creatives (debug)
      responses:
        "200":
          description: All loaded creatives

  /sellers.json:
    get:
      tags: [Transparency]
      summary: IAB sellers.json — the publishers this platform represents
      description: >
        IAB Tech Lab sellers.json. Served by the gateway from the publishers
        table; pairs with each publisher's ads.txt and the SupplyChain object on
        bid requests to form the transparency triad.
      responses:
        "200":
          description: sellers.json document
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact_email: { type: string }
                  version: { type: string }
                  sellers:
                    type: array
                    items:
                      type: object
                      properties:
                        seller_id: { type: string }
                        name: { type: string }
                        domain: { type: string }
                        seller_type: { type: string, enum: [PUBLISHER, INTERMEDIARY, BOTH] }

  /v1/adcert/key:
    get:
      tags: [Transparency]
      summary: The exchange's ads.cert Ed25519 public key
      description: >
        Published so DSPs can fetch (and pick up rotations of) the key used to
        verify signed bid requests, instead of hardcoding it. 404 when request
        signing isn't configured.
      responses:
        "200":
          description: Public verification key
          content:
            application/json:
              schema:
                type: object
                properties:
                  alg: { type: string, example: Ed25519 }
                  key: { type: string, description: base64 raw-url public key }
        "404":
          description: ads.cert signing not configured

  /v1/pubad/native:
    get:
      tags: [Ad Serving]
      summary: Render an OpenRTB Native 1.2 winner to an HTML card
      description: >
        Runs a native auction via the SSP (channel=native), parses the winning
        native markup, and returns a browser-viewable HTML fragment with signed
        impression/click trackers.
      parameters:
        - name: placement_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: HTML native ad fragment
          content:
            text/html:
              schema: { type: string }

  /v1/pubad/video/vast:
    get:
      tags: [Ad Serving]
      summary: VAST 4.2 document for a video winner
      description: >
        Runs a video auction via the SSP (channel=video) and returns a VAST 4.2
        document with signed trackers. Embeds OMID <AdVerifications> when
        publisher_adserver.omid_verification_url is configured.
      parameters:
        - name: placement_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: VAST 4.2 XML
          content:
            text/xml:
              schema: { type: string }

  /healthz:
    get:
      tags: [Dev Tools]
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      tags: [Dev Tools]
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    QueryParams:
      type: object
      required: [table]
      properties:
        table:
          type: string
          enum: [impressions, clicks, conversions, auctions]
        metrics:
          type: array
          items:
            type: string
            enum: [count, sum_cost, avg_cost, sum_revenue, avg_duration_ms, sum_bids]
        dimensions:
          type: array
          items:
            type: string
            enum: [campaign_id, creative_id, placement_id, publisher_id, account_id, geo, device, channel, day, hour]
        filters:
          type: object
          additionalProperties:
            type: string
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
        limit:
          type: integer
        order_by:
          type: string
        order_dir:
          type: string
          enum: [asc, desc]

    QueryResult:
      type: object
      properties:
        Columns:
          type: array
          items:
            type: string
        Rows:
          type: array
          items:
            type: array
            items: {}

    BidRequest:
      type: object
      description: >
        OpenRTB 2.6 bid request. Beyond the core objects this carries the
        platform's transparency + privacy + identity signals: source.ext.schain
        (SupplyChain), source.ext.adcert (ads.cert signature), regs.ext
        (GDPR/US-Privacy/GPP/GPC), and user.eids (UID2 and other extended IDs).
      properties:
        id:
          type: string
        imp:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              tagid:
                type: string
                description: Placement UUID carried through for deal + reporting matching.
              banner:
                type: object
                properties:
                  w: { type: integer }
                  h: { type: integer }
              video:
                type: object
                description: Present for video impressions (VAST). Includes protocols, api (7=OMID), duration window, skip, ad-pod fields.
                properties:
                  mimes: { type: array, items: { type: string } }
                  protocols: { type: array, items: { type: integer } }
                  api:
                    type: array
                    items: { type: integer }
                    description: Supported frameworks — 7 = OMID (Open Measurement).
                  minduration: { type: integer }
                  maxduration: { type: integer }
              native:
                type: object
                description: Present for native impressions (OpenRTB Native 1.2).
                properties:
                  request:
                    type: string
                    description: The native request object, JSON-encoded as a string.
                  ver: { type: string }
              bidfloor:
                type: number
        site:
          type: object
          properties:
            domain: { type: string }
            page: { type: string }
            cat:
              type: array
              items: { type: string }
              description: IAB Content Taxonomy 1.0 category codes (IABxx).
            publisher:
              type: object
              properties:
                id: { type: string }
        app:
          type: object
          description: Present for in-app inventory (mutually exclusive with site).
          properties:
            bundle: { type: string }
            publisher:
              type: object
              properties:
                id: { type: string }
        device:
          type: object
          properties:
            devicetype:
              type: integer
            geo:
              type: object
              properties:
                country:
                  type: string
        user:
          type: object
          properties:
            id: { type: string }
            eids:
              type: array
              description: Extended identifiers (cookieless IDs). UID2 uses source "uidapi.com".
              items:
                type: object
                properties:
                  source: { type: string }
                  uids:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        atype:
                          type: integer
                          description: 1=device/cookie, 2=person-session, 3=person-persistent (UID2).
            ext:
              type: object
              properties:
                consent:
                  type: string
                  description: IAB TCF consent string.
                segments:
                  type: array
                  items: { type: string }
        regs:
          type: object
          description: Regulatory signals gating personalisation (see /pkg/privacy).
          properties:
            coppa: { type: integer }
            ext:
              type: object
              properties:
                gdpr: { type: integer }
                us_privacy:
                  type: string
                  description: IAB US Privacy ("CCPA") string, e.g. "1YNN".
                gpp:
                  type: string
                  description: IAB Global Privacy Platform consent string.
                gpp_sid:
                  type: string
                  description: GPP section ids present in the gpp string.
                gpc:
                  type: integer
                  description: Global Privacy Control signal (1 = do-not-sell/share).
        source:
          type: object
          description: Supply-chain + authenticity provenance.
          properties:
            fd: { type: integer }
            tid: { type: string }
            ext:
              type: object
              properties:
                schain:
                  type: object
                  description: IAB SupplyChain object (ver "1.0").
                  properties:
                    complete: { type: integer }
                    ver: { type: string }
                    nodes:
                      type: array
                      items:
                        type: object
                        properties:
                          asi: { type: string, description: advertising-system domain }
                          sid: { type: string, description: seller id within that system }
                          hp: { type: integer }
                          rid: { type: string }
                adcert:
                  type: string
                  description: ads.cert Ed25519 signature (base64) over the request's canonical fields + timestamp.
                adcert_ts:
                  type: integer
                  format: int64
                  description: Unix-seconds signing time, part of the signed payload (replay protection).
        tmax:
          type: integer
          description: Max response time (ms)

    BidResponse:
      type: object
      properties:
        id:
          type: string
        seatbid:
          type: array
          items:
            type: object
            properties:
              seat:
                type: string
              bid:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    impid:
                      type: string
                    price:
                      type: number
                    cid:
                      type: string
                    crid:
                      type: string
        cur:
          type: string
        nobid:
          type: boolean

    ServeRequest:
      type: object
      properties:
        trace_id:
          type: string
        campaign_id:
          type: string
        creative_id:
          type: string
        placement_id:
          type: string
        publisher_id:
          type: string
        advertiser_id:
          type: string
        clearing_price:
          type: number
        currency:
          type: string
        width:
          type: integer
        height:
          type: integer

    ServeResponse:
      type: object
      properties:
        html:
          type: string
        impression_url:
          type: string
        click_url:
          type: string
        viewability_url:
          type: string
        trace_id:
          type: string
        clearing_price:
          type: number

    Event:
      type: object
      properties:
        type:
          type: string
          enum: [impression, click, conversion, auction]
        impression:
          type: object
        click:
          type: object
        conversion:
          type: object
        auction:
          type: object
