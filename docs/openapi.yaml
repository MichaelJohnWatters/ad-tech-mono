openapi: "3.0.3"
info:
  title: Ad Tech Platform API
  description: |
    Programmatic advertising platform API.

    ## Authentication
    All `/v1/api/*` endpoints require a JWT Bearer token.
    Get a token from `POST /v1/auth/token`.

    In dev mode (no signing key configured), all requests are auto-authenticated as admin.

    ## Visibility
    - **Public API** - customer-facing endpoints through the gateway (:8080)
    - **Internal** - service-to-service endpoints (not exposed through gateway)
    - **Dev Tools** - development/debugging endpoints
  version: "1.0.0"
  contact:
    name: Ad Tech Platform

servers:
  - url: http://localhost:8080
    description: Gateway - all endpoints accessible here (proxied to internal services)

tags:
  - name: Auth
    description: Authentication and token management
  - name: Campaigns
    description: "[Customer] Campaign management (advertiser-facing)"
  - name: Placements
    description: "[Customer] Publisher placement management"
  - name: Reports
    description: "[Customer] Analytics and reporting queries"
  - name: Creatives
    description: "[Customer] Creative asset management"
  - name: OpenRTB - Exchange
    description: "[Partner] Auction endpoints - external SSPs send bid requests here"
  - name: OpenRTB - DSP
    description: "[Partner] Bidding endpoints - exchange calls external DSPs here"
  - name: OpenRTB - Notifications
    description: "[Partner] Win/loss notifications sent to DSPs after auction"
  - name: Tracker
    description: "[Partner] Event tracking pixels - fired by end-user browsers"
  - name: Ad Serving
    description: "[Internal] Creative serving and macro substitution"
  - name: SSP
    description: "[Internal] Supply-side bid request generation"
  - name: Dev Tools
    description: "[Dev] Debugging and simulation endpoints"
  - name: Direct Line Items
    description: "[Customer] Publisher direct-sold line items"
  - name: Agency
    description: "[Customer] Agency act-as: managed advertiser accounts"
  - name: Billing
    description: "[Customer] Advertiser prepay balance + top-ups"
  - name: Deals
    description: "[Customer] Deal management (PMP/PG/preferred) with allowlists"
  - name: Revenue Share
    description: "[Staff] Per-publisher revenue-share configuration"
  - name: Payouts
    description: "[Customer] Publisher earnings and payouts"
  - name: Team
    description: "[Customer] Team / user management"
  - name: Secrets
    description: "[Operator] API secrets and key rotation"
  - name: Webhooks
    description: "[Customer] Webhook subscriptions"
  - name: Audit
    description: "[Staff] Audit log queries"
  - name: Moderation
    description: "[Staff] Creative review queue"
  - name: Quality
    description: "[Customer] Publisher quality controls (allow/blocklists)"
  - name: Fraud
    description: "[Staff] Fraud blocklists"
  - name: Identity
    description: "[Operator] Identity-graph edge ingestion"
  - name: SSAI
    description: "[Public] Server-side ad insertion (HLS/DASH stitching)"
  - name: Ops
    description: "[Staff] Stack ops console — pod matrix, restarts, cron triggers, log tails (ops:read / ops:deploy)"
  - name: Config
    description: "[Operator] Live config management + service registry (config:read / config:update)"
  - name: Conversions
    description: "[Customer] Advertiser conversion-event setup + S2S postback signing keys"
  - name: Notifications
    description: "[Customer] In-app notification feed (portal bell)"
  - name: Privacy
    description: "[Operator] User opt-out intake (levels 1-3)"
  - name: House Ads
    description: "[Staff] Platform fallback creatives served on a no-bid (support:read / support:update)"
  - name: Demos
    description: "[Staff] Guided end-to-end demos over isolated synthetic data (support:read / support:update)"

paths:
  # ============================================================
  # Public API - Auth
  # ============================================================
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue a JWT token
      description: Creates a JWT token for API access. In production, validates credentials against the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: adv-acme
                account_type:
                  type: string
                  enum: [advertiser, publisher, agency, staff, admin]
                  example: advertiser
                role:
                  type: string
                  enum: [owner, manager, analyst, finance, viewer, ad_ops]
                  example: owner
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                  account_type:
                    type: string
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string

  # ============================================================
  # Public API - Campaigns (proxied to DSP)
  # ============================================================
  /v1/api/campaigns/:
    get:
      tags: [Campaigns]
      summary: List campaigns
      description: Returns the caller's campaigns, denormalised with targeting, modifiers, attached creatives and spent-today.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of campaigns }
        "401": { description: Unauthorized }
        "403": { description: Forbidden (needs campaigns read permission) }
    post:
      tags: [Campaigns]
      summary: Create a campaign
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  account_id: { type: string }
                  status: { type: string, example: created }
        "400": { description: Invalid body }

  /v1/api/campaigns/{id}:
    patch:
      tags: [Campaigns]
      summary: Update a campaign (partial)
      description: Any omitted field is left unchanged; an empty array clears that targeting list.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpdate" }
      responses:
        "204": { description: Updated }
        "400": { description: Invalid body }
    delete:
      tags: [Campaigns]
      summary: Archive/delete a campaign
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }

  # ============================================================
  # Public API - Placements (proxied to SSP)
  # ============================================================
  /v1/api/placements/:
    get:
      tags: [Placements]
      summary: List publisher placements
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of placements }
        "401": { description: Unauthorized }
    post:
      tags: [Placements]
      summary: Create a placement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher_id, name, width, height]
              properties:
                publisher_id: { type: string, format: uuid }
                name: { type: string }
                format: { type: string, enum: [display, video, native, audio], default: display }
                width: { type: integer }
                height: { type: integer }
                floor_price: { type: number, default: 0 }
                page_url_pattern: { type: string }
                floor_config: { $ref: "#/components/schemas/FloorConfig" }
                video_config: { $ref: "#/components/schemas/VideoConfig" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, status: { type: string, example: created } } }

  /v1/api/placements/{id}:
    patch:
      tags: [Placements]
      summary: Update a placement (partial)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                floor_price: { type: number }
                status: { type: string, enum: [active, paused, archived] }
                floor_config: { $ref: "#/components/schemas/FloorConfig" }
                video_config: { $ref: "#/components/schemas/VideoConfig" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [Placements]
      summary: Delete a placement
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }

  /v1/api/identity-links:
    post:
      tags: [Identity]
      summary: Ingest identity-graph edges (UID2 ↔ other ids)
      description: >
        Links a UID2 token (or any identifier) to other identifiers in the
        platform identity graph so a cookieless user resolves to a person across
        devices/publishers. Operator-API-key auth. Accepts a UID2-centric shape
        ({uid2, links:[…]}) and/or explicit edges ({edges:[…]}).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid2: { type: string }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      source: { type: string }
                      link_type: { type: string }
                      confidence: { type: number }
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      user_id: { type: string }
                      linked_id: { type: string }
                      source: { type: string }
                      link_type: { type: string }
                      confidence: { type: number }
      responses:
        "200":
          description: Edges written
          content:
            application/json:
              schema:
                type: object
                properties:
                  links_written: { type: integer }
        "400":
          description: No valid edges
        "503":
          description: Identity store unavailable

  # ============================================================
  # Public API - Reports (proxied to Reporting)
  # ============================================================
  /v1/api/ara/reports:
    get:
      tags: [Reports]
      summary: Privacy Sandbox ARA reports (reporting-only overlay)
      description: >-
        Requires reports:read. Returns the caller account's Privacy Sandbox
        Attribution Reporting API (ARA) event-level reports plus a summary
        ({ event: <count> }). Aggregatable reports carry no per-user source id and
        are held in a platform quarantine, so they are never attributed per-account.
        This stream is a REPORTING-ONLY overlay — deliberately noised, aggregated
        and delayed by the browser, and NEVER billed. It is stored separately from
        the exact conversions stream. See docs/attribution-phase4-ara.md.
      security:
        - bearerAuth: []
      responses:
        "200": { description: The account's ARA reports + summary (note field explains the overlay) }
        "401": { description: Not authenticated }
        "403": { description: Missing reports:read }
  /v1/api/reports/:
    get:
      tags: [Reports]
      summary: List available reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available report templates
    post:
      tags: [Reports]
      summary: Run an analytics query (tenant-enforced proxy)
      description: >-
        Requires reports:read. Proxies the query body to the reporting
        service's /v1/reporting/query. The gateway REWRITES the filters for
        customer sessions (advertiser → account_id, publisher → validated
        publisher_id) before forwarding — the browser's filters are
        convenience, this rewrite is the tenant guarantee. Staff sessions
        pass through unscoped. Supports every table/metric/dimension of
        /v1/reporting/query, including media_events with media_starts /
        media_completes / completion_rate and the deal_id impressions
        dimension.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryParams"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /v1/api/reports/schema:
    get:
      tags: [Reports]
      summary: Report-builder schema (tables, metrics, dimensions)
      description: >-
        Requires reports:read. Returns the queryable tables and, per table, the
        valid metrics and group-by dimensions the custom report builder should
        offer — so the portal drives its Table / Metrics / Group-by dropdowns off
        the backend instead of hardcoding them. Includes the bid-shading savings
        table (sum_savings) alongside impressions/clicks/conversions/media_events.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "[{ name, label, metrics: [{value,label}], dimensions: [{value,label}] }]"

  /v1/api/shading:
    get:
      tags: [Reports]
      summary: Advertiser bid-shading transparency
      description: >-
        Requires reports:read; advertiser/agency session (or staff acting-as).
        Per placement the advertiser bids on: their OWN delivered impressions, the
        price THEY paid (avg clearing CPM), their win/loss, plus clearly-separated
        DSP-wide marketplace context — and the realized bid-shading savings
        (shading_savings_usd), sourced durably from ClickHouse (auction_shades).
        Account-forced; never cross-tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "{ account_id, window_days, placements: [...], your_totals: {...}, shading_savings_usd, explanations: {...} }"

  /v1/api/trace:
    get:
      tags: [Reports]
      summary: Inspect a request trace (scoped + redacted)
      description: |
        Reconstruct a single ad request's flow through the platform — auction,
        serve, impression, viewability, click/conversion, billing — as a
        render-ready timeline for the portal trace inspector.

        The response is REDACTED server-side by the caller's account type:
          - staff / admin: full detail (winning DSP, advertiser spend, publisher
            revenue, platform margin).
          - advertiser / agency: their spend only — no winner DSP, publisher
            revenue, platform margin, or other bidders. Scoped to the caller's
            account_id (injected from the session).
          - publisher: their revenue only — no advertiser identity or margin.
            Scoped to a gateway-VALIDATED publisher_id (see the param); a
            publisher can only inspect traces on its own inventory.

        A caller that does not own the trace (no matching impression) gets 404,
        indistinguishable from not-found — no cross-tenant existence leak.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: trace_id
          required: true
          schema: { type: string }
          description: The 32-hex OTel trace id (e.g. from a report or impressions row).
        - in: query
          name: publisher_id
          required: false
          schema: { type: string }
          description: |
            Publisher sessions only — which of the account's publishers to scope
            to. The gateway validates it against the session and forwards a
            trusted scope header; a client-supplied value is never trusted. If
            omitted and the account owns exactly one publisher, that one is used.
      responses:
        "200":
          description: Redacted flow timeline (steps + summary panels)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceTimeline"
        "400":
          description: trace_id required, or ambiguous publisher (several owned, none given)
        "403":
          description: Forbidden — unknown account type, or publisher_id not owned by the session
        "404":
          description: Trace not found or not owned by the caller

  /v1/api/impressions/recent:
    get:
      tags: [Reports]
      summary: List recent impressions (scoped) for the trace inspector
      description: |
        The caller's most recent impressions, newest first — the drill-down the
        portal hangs "View trace" off. Scoped like /v1/api/trace (advertiser →
        account_id; publisher → gateway-validated publisher_id; staff → unscoped).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 50, maximum: 500 }
        - in: query
          name: publisher_id
          required: false
          schema: { type: string }
          description: Publisher sessions only — validated by the gateway (see /v1/api/trace).
      responses:
        "200":
          description: Recent impressions
          content:
            application/json:
              schema:
                type: object
                properties:
                  impressions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImpressionRow"
        "403":
          description: Forbidden — unknown account type, or publisher scope unresolved

  /v1/reporting/query:
    post:
      tags: [Reports]
      summary: Query the analytics store
      description: |
        Execute an analytics query. Supports aggregation by dimensions,
        time range filtering, and multiple metrics.

        Tables: `impressions`, `auctions`, `clicks`, `conversions`, `views`,
        and `media_events` (video/audio playback lifecycle: start, quartiles,
        complete — rows carry campaign/creative/placement/publisher/account
        attribution, so the quartile funnel is queryable per campaign and
        tenant-scoped like every other table).

        Derived metrics (`ecpm`, `ctr`, `fill_rate`, `viewability_rate`,
        `completion_rate`, `net_revenue`) are computed server-side by the
        metrics engine from their source tables; `completion_rate` =
        media_completes / media_starts (percent, null when nothing started).
        `media_starts` / `media_completes` are filtered counts on
        media_events (event_type = start / complete).

        `deal_id` is a valid impressions dimension for per-deal breakdowns;
        it is deliberately absent from the rollup configs, so queries grouped
        by deal_id always scan raw impressions instead of the rollup fast
        path. media_events is hot-store only (ClickHouse), not exported to
        the cold lake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryParams"
            examples:
              total_impressions:
                summary: Total impressions and spend
                value:
                  table: impressions
                  metrics: [count, sum_cost]
              by_campaign:
                summary: Impressions grouped by campaign
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [campaign_id]
              by_geo_with_time:
                summary: Impressions by geo with time filter
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [geo]
                  time_from: "2024-06-15T00:00:00Z"
                  time_to: "2024-06-16T00:00:00Z"
              auction_stats:
                summary: Auction count and average latency
                value:
                  table: auctions
                  metrics: [count, avg_duration_ms]
              media_funnel:
                summary: Video/audio completion funnel per campaign
                value:
                  table: media_events
                  metrics: [media_starts, media_completes, completion_rate]
                  dimensions: [campaign_id, channel]
              by_deal:
                summary: Impressions and spend per deal (raw scan, no rollup)
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [deal_id]
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /v1/reporting/events:
    post:
      tags: [Reports]
      summary: Ingest events (standalone mode)
      description: Push events directly to the analytics store over HTTP. Used when NATS is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Event"
      responses:
        "204":
          description: Events ingested

  # ============================================================
  # Internal - OpenRTB (Exchange)
  # ============================================================
  /v1/openrtb/auction:
    post:
      tags: [OpenRTB - Exchange]
      summary: Submit bid request and run auction
      description: |
        Receives a bid request, fans out to all configured DSPs in parallel,
        runs a first-price auction, and returns the winning bid.
        Sends win/loss notifications to all participating DSPs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Auction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/bid:
    post:
      tags: [OpenRTB - DSP]
      summary: Evaluate bid request (DSP endpoint)
      description: Called by the Exchange. Evaluates all active campaigns against the bid request and returns the best bid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Bid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/win:
    get:
      tags: [OpenRTB - Notifications]
      summary: Win notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: price
          in: query
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  /v1/openrtb/loss:
    get:
      tags: [OpenRTB - Notifications]
      summary: Loss notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: integer
            enum: [100, 102, 103, 104]
            description: "100=below floor, 102=outbid, 103=blocked, 104=creative rejected"
        - name: clearing_price
          in: query
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Tracker
  # ============================================================
  /v1/t/imp:
    get:
      tags: [Tracker]
      summary: Impression pixel (1x1 GIF)
      description: Fired by the browser when an ad renders. Returns a 1x1 transparent GIF.
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
          description: Trace ID
        - name: cid
          in: query
          schema:
            type: string
          description: Campaign ID
        - name: crid
          in: query
          schema:
            type: string
          description: Creative ID
        - name: pid
          in: query
          schema:
            type: string
          description: Placement ID
        - name: pubid
          in: query
          schema:
            type: string
          description: Publisher ID
        - name: price
          in: query
          schema:
            type: number
          description: Clearing price
      responses:
        "200":
          description: 1x1 transparent GIF
          content:
            image/gif: {}

  /v1/t/click:
    get:
      tags: [Tracker]
      summary: Click redirect (302)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: redir
          in: query
          required: true
          schema:
            type: string
          description: Landing page URL
      responses:
        "302":
          description: Redirect to landing page

  /v1/t/view:
    get:
      tags: [Tracker]
      summary: Viewability beacon (204)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: dur
          in: query
          schema:
            type: integer
          description: Duration visible (ms)
        - name: pct
          in: query
          schema:
            type: integer
          description: Percent of ad visible
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Ad Server
  # ============================================================
  /v1/ad/serve:
    post:
      tags: [Ad Serving]
      summary: Serve an ad creative with macro substitution
      description: Called after auction win. Substitutes macros in creative HTML and generates tracking pixel URLs with full context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServeRequest"
      responses:
        "200":
          description: Rendered ad with tracking URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServeResponse"

  # ============================================================
  # Internal - SSP
  # ============================================================
  /v1/ssp/request:
    get:
      tags: [SSP]
      summary: Generate bid request for a placement
      parameters:
        - name: placement_id
          in: query
          schema:
            type: string
          example: pl-news-mpu
        - name: geo
          in: query
          schema:
            type: string
          example: GBR
        - name: device
          in: query
          schema:
            type: string
            enum: [mobile, desktop, tablet]
      responses:
        "200":
          description: Bid request sent to exchange, response returned

  # ============================================================
  # Dev Tools
  # ============================================================
  /v1/dsp/campaigns:
    get:
      tags: [Dev Tools]
      summary: List DSP campaigns (debug)
      responses:
        "200":
          description: All loaded campaigns

  /v1/dsp/shading:
    get:
      tags: [Dev Tools]
      summary: Win-rate shading data (debug)
      responses:
        "200":
          description: Per-placement win/loss stats

  /v1/ssp/placements:
    get:
      tags: [Dev Tools]
      summary: List SSP placements (debug)
      responses:
        "200":
          description: All loaded placements

  /v1/ad/creatives:
    get:
      tags: [Dev Tools]
      summary: List ad server creatives (debug)
      responses:
        "200":
          description: All loaded creatives

  /sellers.json:
    get:
      tags: [Transparency]
      summary: IAB sellers.json — the publishers this platform represents
      description: >
        IAB Tech Lab sellers.json. Served by the gateway from the publishers
        table; pairs with each publisher's ads.txt and the SupplyChain object on
        bid requests to form the transparency triad.
      responses:
        "200":
          description: sellers.json document
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact_email: { type: string }
                  version: { type: string }
                  sellers:
                    type: array
                    items:
                      type: object
                      properties:
                        seller_id: { type: string }
                        name: { type: string }
                        domain: { type: string }
                        seller_type: { type: string, enum: [PUBLISHER, INTERMEDIARY, BOTH] }

  /v1/adcert/key:
    get:
      tags: [Transparency]
      summary: The exchange's ads.cert Ed25519 public key
      description: >
        Published so DSPs can fetch (and pick up rotations of) the key used to
        verify signed bid requests, instead of hardcoding it. 404 when request
        signing isn't configured.
      responses:
        "200":
          description: Public verification key
          content:
            application/json:
              schema:
                type: object
                properties:
                  alg: { type: string, example: Ed25519 }
                  key: { type: string, description: base64 raw-url public key }
        "404":
          description: ads.cert signing not configured

  /v1/pubad/native:
    get:
      tags: [Ad Serving]
      summary: Render an OpenRTB Native 1.2 winner to an HTML card
      description: >
        Runs a native auction via the SSP (channel=native), parses the winning
        native markup, and returns a browser-viewable HTML fragment with signed
        impression/click trackers.
      parameters:
        - name: placement_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: HTML native ad fragment
          content:
            text/html:
              schema: { type: string }

  /v1/pubad/video/vast:
    get:
      tags: [Ad Serving]
      summary: VAST 4.2 document for a video winner
      description: >
        Runs a video auction via the SSP (channel=video) and returns a VAST 4.2
        document with signed trackers. Embeds OMID <AdVerifications> when
        publisher_adserver.omid_verification_url is configured.
      parameters:
        - name: placement_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: VAST 4.2 XML
          content:
            text/xml:
              schema: { type: string }

  # ============================================================
  # Public API - Creatives
  # ============================================================
  /v1/api/creatives:
    get:
      tags: [Creatives]
      summary: List creatives
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: List of creatives } }
    post:
      tags: [Creatives]
      summary: Upload a creative (enters review)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, format, landing_url]
              properties:
                name: { type: string }
                format: { type: string, enum: [display, video, native, audio, dynamic_product] }
                width: { type: integer }
                height: { type: integer }
                html_content: { type: string, description: "For format=dynamic_product this is a Go template the ad server assembles at render time from the advertiser's catalog + the user's carted SKUs ({{range .Products}}…{{else}}<static fallback>{{end}}); ad macros (${CLICK_URL} etc.) survive template execution. Validated at upload." }
                landing_url: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, review_status: { type: string, example: pending_review } } }

  # ============================================================
  # Public API - Direct-sold line items (publisher)
  # ============================================================
  /v1/api/direct-line-items:
    get:
      tags: [Direct Line Items]
      summary: List direct-sold line items
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: List } }
    post:
      tags: [Direct Line Items]
      summary: Create a direct-sold line item
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher_id, name, priority_tier]
              properties:
                publisher_id: { type: string, format: uuid }
                name: { type: string }
                demand_source: { type: string }
                priority_tier: { type: string, enum: [sponsorship, guaranteed, preferred, house] }
                placement_ids: { type: array, items: { type: string, format: uuid } }
                impressions_committed: { type: integer }
                delivery_start: { type: string, format: date }
                delivery_end: { type: string, format: date }
                cpm: { type: number }
                currency: { type: string }
                pacing_mode: { type: string, enum: [even, asap], default: even }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string } } } } }
  /v1/api/direct-line-items/{id}:
    patch:
      tags: [Direct Line Items]
      summary: Update a direct-sold line item
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                demand_source: { type: string }
                priority_tier: { type: string, enum: [sponsorship, guaranteed, preferred, house] }
                placement_ids: { type: array, items: { type: string } }
                impressions_committed: { type: integer }
                delivery_start: { type: string, format: date }
                delivery_end: { type: string, format: date }
                cpm: { type: number }
                pacing_mode: { type: string, enum: [even, asap] }
                status: { type: string, enum: [draft, active, paused, ended] }
      responses: { "200": { description: Updated } }

  # ============================================================
  # Public API - Agency act-as
  # ============================================================
  /v1/api/agency-accounts:
    get:
      tags: [Agency]
      summary: List managed advertiser accounts (or the agency roster)
      description: >-
        An agency session sees its own managed accounts; staff see all (filter
        with ?agency_id). With ?list=agencies (staff only) it instead returns
        the agency roster [{ id, name }] — the source for the staff assignment
        picker.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: agency_id, in: query, schema: { type: string, format: uuid } }
        - { name: list, in: query, schema: { type: string, enum: [agencies] }, description: "list=agencies returns all agency accounts [{ id, name }] (staff only)" }
      responses: { "200": { description: "List of managed-account rows (agency_id, agency_name, managed_account_id, managed_account_name); with ?list=agencies, [{ id, name }]" } }
    post:
      tags: [Agency]
      summary: Assign a managed account to an agency (staff)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agency_account_id, managed_account_id]
              properties:
                agency_account_id: { type: string, format: uuid }
                managed_account_id: { type: string, format: uuid }
      responses: { "201": { description: Assigned } }
    delete:
      tags: [Agency]
      summary: Unassign a managed account (staff)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: agency_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: managed_account_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { description: Unassigned } }

  # ============================================================
  # Public API - Billing top-up (advertiser prepay)
  # ============================================================
  /v1/api/billing/topup:
    get:
      tags: [Billing]
      summary: Balance + top-up history
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: "{ balance, currency, topups[] }" } }
    post:
      tags: [Billing]
      summary: Add prepay funds (idempotent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotency_key]
              properties:
                amount: { type: number, description: "0 < amount <= 10000" }
                currency: { type: string, default: USD }
                idempotency_key: { type: string }
      responses:
        "201":
          description: Top-up applied (or 200 on idempotent replay)
          content: { application/json: { schema: { type: object, properties: { id: { type: string }, amount: { type: number }, currency: { type: string }, status: { type: string }, balance: { type: number }, duplicate: { type: boolean } } } } }

  # ============================================================
  # Public API - Deals (publisher, with allowlists)
  # ============================================================
  /v1/api/deals:
    get:
      tags: [Deals]
      summary: List deals
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: List of deals } }
