openapi: "3.0.3"
info:
  title: Ad Tech Platform API
  description: |
    Programmatic advertising platform API.

    ## Authentication
    All `/v1/api/*` endpoints require a JWT Bearer token.
    Get a token from `POST /v1/auth/token`.

    In dev mode (no signing key configured), all requests are auto-authenticated as admin.

    ## Visibility
    - **Public API** - customer-facing endpoints through the gateway (:8080)
    - **Internal** - service-to-service endpoints (not exposed through gateway)
    - **Dev Tools** - development/debugging endpoints
  version: "1.0.0"
  contact:
    name: Ad Tech Platform

servers:
  - url: http://localhost:8080
    description: Gateway - all endpoints accessible here (proxied to internal services)

tags:
  - name: Auth
    description: Authentication and token management
  - name: Campaigns
    description: "[Customer] Campaign management (advertiser-facing)"
  - name: Placements
    description: "[Customer] Publisher placement management"
  - name: Reports
    description: "[Customer] Analytics and reporting queries"
  - name: Creatives
    description: "[Customer] Creative asset management"
  - name: OpenRTB - Exchange
    description: "[Partner] Auction endpoints - external SSPs send bid requests here"
  - name: OpenRTB - DSP
    description: "[Partner] Bidding endpoints - exchange calls external DSPs here"
  - name: OpenRTB - Notifications
    description: "[Partner] Win/loss notifications sent to DSPs after auction"
  - name: Tracker
    description: "[Partner] Event tracking pixels - fired by end-user browsers"
  - name: Ad Serving
    description: "[Internal] Creative serving and macro substitution"
  - name: SSP
    description: "[Internal] Supply-side bid request generation"
  - name: Dev Tools
    description: "[Dev] Debugging and simulation endpoints"

paths:
  # ============================================================
  # Public API - Auth
  # ============================================================
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue a JWT token
      description: Creates a JWT token for API access. In production, validates credentials against the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: adv-acme
                account_type:
                  type: string
                  enum: [advertiser, publisher, agency, staff, admin]
                  example: advertiser
                role:
                  type: string
                  enum: [owner, manager, analyst, finance, viewer, ad_ops]
                  example: owner
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_id:
                    type: string
                  account_type:
                    type: string
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string

  # ============================================================
  # Public API - Campaigns (proxied to DSP)
  # ============================================================
  /v1/api/campaigns/:
    get:
      tags: [Campaigns]
      summary: List campaigns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of campaigns
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - requires campaigns:read permission

  # ============================================================
  # Public API - Placements (proxied to SSP)
  # ============================================================
  /v1/api/placements/:
    get:
      tags: [Placements]
      summary: List publisher placements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of placements
        "401":
          description: Unauthorized

  # ============================================================
  # Public API - Reports (proxied to Reporting)
  # ============================================================
  /v1/api/reports/:
    get:
      tags: [Reports]
      summary: List available reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available report templates

  /v1/reporting/query:
    post:
      tags: [Reports]
      summary: Query the analytics store
      description: |
        Execute an analytics query. Supports aggregation by dimensions,
        time range filtering, and multiple metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryParams"
            examples:
              total_impressions:
                summary: Total impressions and spend
                value:
                  table: impressions
                  metrics: [count, sum_cost]
              by_campaign:
                summary: Impressions grouped by campaign
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [campaign_id]
              by_geo_with_time:
                summary: Impressions by geo with time filter
                value:
                  table: impressions
                  metrics: [count, sum_cost]
                  dimensions: [geo]
                  time_from: "2024-06-15T00:00:00Z"
                  time_to: "2024-06-16T00:00:00Z"
              auction_stats:
                summary: Auction count and average latency
                value:
                  table: auctions
                  metrics: [count, avg_duration_ms]
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /v1/reporting/events:
    post:
      tags: [Reports]
      summary: Ingest events (standalone mode)
      description: Push events directly to the analytics store over HTTP. Used when NATS is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Event"
      responses:
        "204":
          description: Events ingested

  # ============================================================
  # Internal - OpenRTB (Exchange)
  # ============================================================
  /v1/openrtb/auction:
    post:
      tags: [OpenRTB - Exchange]
      summary: Submit bid request and run auction
      description: |
        Receives a bid request, fans out to all configured DSPs in parallel,
        runs a first-price auction, and returns the winning bid.
        Sends win/loss notifications to all participating DSPs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Auction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/bid:
    post:
      tags: [OpenRTB - DSP]
      summary: Evaluate bid request (DSP endpoint)
      description: Called by the Exchange. Evaluates all active campaigns against the bid request and returns the best bid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidRequest"
      responses:
        "200":
          description: Bid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"

  /v1/openrtb/win:
    get:
      tags: [OpenRTB - Notifications]
      summary: Win notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: price
          in: query
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  /v1/openrtb/loss:
    get:
      tags: [OpenRTB - Notifications]
      summary: Loss notification
      parameters:
        - name: bid_id
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: integer
            enum: [100, 102, 103, 104]
            description: "100=below floor, 102=outbid, 103=blocked, 104=creative rejected"
        - name: clearing_price
          in: query
          schema:
            type: number
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Tracker
  # ============================================================
  /v1/t/imp:
    get:
      tags: [Tracker]
      summary: Impression pixel (1x1 GIF)
      description: Fired by the browser when an ad renders. Returns a 1x1 transparent GIF.
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
          description: Trace ID
        - name: cid
          in: query
          schema:
            type: string
          description: Campaign ID
        - name: crid
          in: query
          schema:
            type: string
          description: Creative ID
        - name: pid
          in: query
          schema:
            type: string
          description: Placement ID
        - name: pubid
          in: query
          schema:
            type: string
          description: Publisher ID
        - name: price
          in: query
          schema:
            type: number
          description: Clearing price
      responses:
        "200":
          description: 1x1 transparent GIF
          content:
            image/gif: {}

  /v1/t/click:
    get:
      tags: [Tracker]
      summary: Click redirect (302)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: redir
          in: query
          required: true
          schema:
            type: string
          description: Landing page URL
      responses:
        "302":
          description: Redirect to landing page

  /v1/t/view:
    get:
      tags: [Tracker]
      summary: Viewability beacon (204)
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            type: string
        - name: dur
          in: query
          schema:
            type: integer
          description: Duration visible (ms)
        - name: pct
          in: query
          schema:
            type: integer
          description: Percent of ad visible
      responses:
        "204":
          description: Acknowledged

  # ============================================================
  # Internal - Ad Server
  # ============================================================
  /v1/ad/serve:
    post:
      tags: [Ad Serving]
      summary: Serve an ad creative with macro substitution
      description: Called after auction win. Substitutes macros in creative HTML and generates tracking pixel URLs with full context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServeRequest"
      responses:
        "200":
          description: Rendered ad with tracking URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServeResponse"

  # ============================================================
  # Internal - SSP
  # ============================================================
  /v1/ssp/request:
    get:
      tags: [SSP]
      summary: Generate bid request for a placement
      parameters:
        - name: placement_id
          in: query
          schema:
            type: string
          example: pl-news-mpu
        - name: geo
          in: query
          schema:
            type: string
          example: GBR
        - name: device
          in: query
          schema:
            type: string
            enum: [mobile, desktop, tablet]
      responses:
        "200":
          description: Bid request sent to exchange, response returned

  # ============================================================
  # Dev Tools
  # ============================================================
  /v1/dsp/campaigns:
    get:
      tags: [Dev Tools]
      summary: List DSP campaigns (debug)
      responses:
        "200":
          description: All loaded campaigns

  /v1/dsp/shading:
    get:
      tags: [Dev Tools]
      summary: Win-rate shading data (debug)
      responses:
        "200":
          description: Per-placement win/loss stats

  /v1/ssp/placements:
    get:
      tags: [Dev Tools]
      summary: List SSP placements (debug)
      responses:
        "200":
          description: All loaded placements

  /v1/ad/creatives:
    get:
      tags: [Dev Tools]
      summary: List ad server creatives (debug)
      responses:
        "200":
          description: All loaded creatives

  /healthz:
    get:
      tags: [Dev Tools]
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      tags: [Dev Tools]
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    QueryParams:
      type: object
      required: [table]
      properties:
        table:
          type: string
          enum: [impressions, clicks, conversions, auctions]
        metrics:
          type: array
          items:
            type: string
            enum: [count, sum_cost, avg_cost, sum_revenue, avg_duration_ms, sum_bids]
        dimensions:
          type: array
          items:
            type: string
            enum: [campaign_id, creative_id, placement_id, publisher_id, account_id, geo, device, channel, day, hour]
        filters:
          type: object
          additionalProperties:
            type: string
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
        limit:
          type: integer
        order_by:
          type: string
        order_dir:
          type: string
          enum: [asc, desc]

    QueryResult:
      type: object
      properties:
        Columns:
          type: array
          items:
            type: string
        Rows:
          type: array
          items:
            type: array
            items: {}

    BidRequest:
      type: object
      properties:
        id:
          type: string
        imp:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              banner:
                type: object
                properties:
                  w:
                    type: integer
                  h:
                    type: integer
              bidfloor:
                type: number
        site:
          type: object
          properties:
            domain:
              type: string
            page:
              type: string
            cat:
              type: array
              items:
                type: string
        device:
          type: object
          properties:
            devicetype:
              type: integer
            geo:
              type: object
              properties:
                country:
                  type: string
        tmax:
          type: integer
          description: Max response time (ms)

    BidResponse:
      type: object
      properties:
        id:
          type: string
        seatbid:
          type: array
          items:
            type: object
            properties:
              seat:
                type: string
              bid:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    impid:
                      type: string
                    price:
                      type: number
                    cid:
                      type: string
                    crid:
                      type: string
        cur:
          type: string
        nobid:
          type: boolean

    ServeRequest:
      type: object
      properties:
        trace_id:
          type: string
        campaign_id:
          type: string
        creative_id:
          type: string
        placement_id:
          type: string
        publisher_id:
          type: string
        advertiser_id:
          type: string
        clearing_price:
          type: number
        currency:
          type: string
        width:
          type: integer
        height:
          type: integer

    ServeResponse:
      type: object
      properties:
        html:
          type: string
        impression_url:
          type: string
        click_url:
          type: string
        viewability_url:
          type: string
        trace_id:
          type: string
        clearing_price:
          type: number

    Event:
      type: object
      properties:
        type:
          type: string
          enum: [impression, click, conversion, auction]
        impression:
          type: object
        click:
          type: object
        conversion:
          type: object
        auction:
          type: object
