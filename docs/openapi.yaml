                amount: { type: number, description: "0 < amount <= 10000" }
                currency: { type: string, default: USD }
                idempotency_key: { type: string }
      responses:
        "201":
          description: Top-up applied (or 200 on idempotent replay)
          content: { application/json: { schema: { type: object, properties: { id: { type: string }, amount: { type: number }, currency: { type: string }, status: { type: string }, balance: { type: number }, duplicate: { type: boolean } } } } }

