# CI — build/vet/test + chart validation + UI design-system guardrails.
#
# Deliberately minimal: no services, no docker. Integration tests
# (testcontainers, -tags=integration), DuckDB (CGO), and e2e (full
# stack) stay local/manual — see the Makefile test-* targets.
#
# Born of two same-day incidents (2026-08-06): a chart committed without
# helm lint broke the next `helm upgrade` with the stack already down, and
# `go test | tail` in &&-chains masked failing tests into deploys three
# times. Everything here runs unpiped so exit codes actually gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # UI guardrails (UI plan F5): ratcheting budgets for inline styles,
  # confirm()/prompt()/alert(), and raw-hex Tailwind classes in
  # web/templates. See scripts/audit-ui.sh for the budgets.
  audit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make audit-ui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Chart sanity: helm lint catches template/YAML breakage (e.g. a comment
  # inside a {} flow mapping) BEFORE it lands on main and bricks the next
  # `helm upgrade`; kubeconform then schema-validates the rendered manifests
  # against upstream k8s schemas — no cluster needed (kubectl's client-side
  # dry-run still wants an API server for schema validation). The chart
  # renders only core kinds, so default schemas cover everything.
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: helm lint k8s/helm/adtech
      - run: helm template adtech k8s/helm/adtech | kubeconform -strict -summary

  # The duckdb-tagged reporting build is invisible to `go build ./...`
  # (build-tag-gated, CGO) — it once broke silently and every reporting
  # image rebuild failed for hours while the cluster kept serving a stale
  # binary. Compile it on every push so a broken tag fails CI, not Tilt.
  build-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=1 go build -tags duckdb ./cmd/reporting/ ./pkg/store/analytics/

  # Supply-chain scan (security hardening #74). Two Trivy passes:
  #   - config: Dockerfile misconfigurations (root user, missing USER, etc.)
  #   - fs:     known CVEs in Go module deps (go.sum) + the pinned base images
  # `ignore-unfixed` means we only fail on ACTIONABLE HIGH/CRITICAL findings
  # (a fix is available upstream) — otherwise a newly-disclosed unfixable CVE
  # would wedge every unrelated PR. Bump/patch the dep to clear a failure.
  supply-chain-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned (v0.36.0): the action's old un-prefixed tags (0.28.0)
      # were removed upstream and broke resolution — and a supply-chain
      # gate should not itself trust a movable tag.
      - name: Trivy — Dockerfile misconfig
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # YAML ignorefile (per-path suppressions — reporting's root-user
          # exemption) via env, NOT the action's `trivyignores` input: that
          # input concatenates files assuming the plain format.
          TRIVY_IGNOREFILE: build/.trivyignore.yaml
        with:
          scan-type: config
          scan-ref: build
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy — dependency CVEs (fixable only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
