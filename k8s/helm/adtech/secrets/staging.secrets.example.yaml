# Staging secrets overlay — EXAMPLE / template.
#
# This is a plain Helm values overlay holding ONLY the secret values the chart
# consumes (DB passwords + real-S3 credentials). It is layered LAST at deploy
# time so its values win:
#   helm upgrade adtech k8s/helm/adtech \
#     -f k8s/helm/adtech/values-staging.yaml \
#     -f <(sops -d k8s/helm/adtech/secrets/staging.secrets.enc.yaml)
#
# WORKFLOW (never commit the plaintext — .gitignore blocks *.secrets.yaml; only
# the encrypted *.enc.yaml is committed):
#   cp k8s/helm/adtech/secrets/staging.secrets.example.yaml \
#      k8s/helm/adtech/secrets/staging.secrets.yaml
#   # fill in the REPLACE-* values, then encrypt (see .sops.yaml for key setup):
#   make secrets-encrypt ENV=staging      # → staging.secrets.enc.yaml (commit this)
#   make secrets-edit    ENV=staging      # edit in place later (sops opens $EDITOR)
#
# App-level SIGNING keys (jwt_signing, hmac_tracker, hmac_conversion, pgp_private,
# adcert_ed25519) are NOT here — they live in the Postgres `secrets` table and are
# provisioned by `make seed` (dev-deterministic) or by inserting real values after
# first boot. To pin the secrets-at-rest cipher or the gateway JWT bootstrap key,
# add them as service extraEnv in THIS overlay, e.g.:
#   services:
#     gateway:
#       extraEnv:
#         - { name: SECRETS_ENCRYPTION_KEY, value: REPLACE-openssl-rand-hex-32 }

global:
  # Real object-storage credentials (endpoint/region/useSSL are non-secret and
  # live in values-staging.yaml; only the keys are secret).
  s3:
    accessKey: REPLACE-s3-access-key
    secretKey: REPLACE-s3-secret-key

infra:
  # In-cluster Postgres/ClickHouse passwords — staging must NOT reuse the local
  # dev password. The chart templates these into the postgres-credentials Secret
  # and the ClickHouse env.
  postgres:
    credentials:
      password: REPLACE-postgres-password
  clickhouse:
    password: REPLACE-clickhouse-password
