{{- /*
Gateway service account + namespace Role for the staff ops console
(/v1/api/ops/*, pkg/kubeops): pod matrix + log tails, rollout restarts,
cronjob run-now (Job create from the jobTemplate), and the PVC card.
Namespace-scoped only — the console never reads outside its own namespace.
Only the gateway deployment mounts this account (services.gateway.
serviceAccountName in values); every other pod keeps the default account.
*/ -}}
{{- $ns := include "adtech.namespace" . -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: {{ $ns }}
  labels:
    app: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-ops
  namespace: {{ $ns }}
  labels:
    app: gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-ops
  namespace: {{ $ns }}
  labels:
    app: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-ops
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: {{ $ns }}
