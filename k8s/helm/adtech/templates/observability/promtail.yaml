{{- $ns := include "adtech.namespace" . -}}
{{- $pt := .Values.observability.promtail }}
{{- if $pt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ $ns }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      # hostPath (volume below): survives container restarts, so a bounced
      # promtail RESUMES tailing instead of re-shipping every file.
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.{{ $ns }}.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      # Static file glob over the kubelet pod-log layout
      # (/var/log/pods/<ns>_<pod>_<uid>/<container>/N.log — symlinks into
      # /var/lib/docker/containers, hence both volume mounts below).
      # Deliberately NOT kubernetes_sd: our slog lines already carry the
      # service name in their JSON, so the Grafana Loki↔Jaeger pivots
      # ({service, trace_id}) come straight from the log body — no k8s
      # metadata, RBAC, or discovery edge cases needed. Pod identity is
      # recovered from the file path.
      - job_name: pod-logs
        static_configs:
          - targets: [localhost]
            labels:
              namespace: {{ $ns }}
              __path__: /var/log/pods/{{ $ns }}_*/*/*.log
        pipeline_stages:
          # moby runtime writes docker-JSON envelopes; unwrap, then parse
          # the app's slog JSON.
          - docker: {}
          - regex:
              source: filename
              expression: '/var/log/pods/[^_]+_(?P<pod>[^_]+)_[^/]+/'
          - json:
              expressions:
                service: service
                level: level
          # trace_id is deliberately NOT a label: labels define STREAMS, and
          # a per-request id means a stream per request — the 2026-07-19 load
          # runs minted ~340k streams, hit Loki's stream limit, and ALL
          # ingestion 429'd. Grafana's Loki→Jaeger pivot regexes trace_id out
          # of the log CONTENT (derivedFields), which still works.
          - labels:
              service:
              pod:
              level:
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: {{ $ns }}
---
# Promtail uses kubernetes_sd_configs to attach pod metadata to log lines.
# Without this Role, every reconcile logs a noisy
# `pods is forbidden: User "system:serviceaccount:adtech:default" cannot
# list resource "pods"` warning.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ $ns }}
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: {{ $pt.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yaml
          # /ready on the http_listen_port (9080, config above): reports 200
          # once the Loki client + file targets are up. Without probes a
          # wedged shipper stays "Running" while logs silently stop flowing.
          # Liveness must NOT use /ready: it reflects Loki-push backpressure,
          # so a throttled Loki got promtail KILLED, which (with pod-local
          # positions) made it re-ship everything and throttle harder — a
          # self-amplifying crashloop. /metrics answers while the process
          # lives; /ready stays on the readiness probe only.
          livenessProbe:
            httpGet: { path: /metrics, port: 9080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 9080 }
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /run/promtail
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            {{- toYaml $pt.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}
