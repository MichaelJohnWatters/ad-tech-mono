{{- $ns := include "adtech.namespace" . -}}
{{- $loki := .Values.observability.loki }}
{{- if $loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ $ns }}
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: {{ $loki.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
              name: http
          resources:
            {{- toYaml $loki.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ $ns }}
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
{{- end }}
