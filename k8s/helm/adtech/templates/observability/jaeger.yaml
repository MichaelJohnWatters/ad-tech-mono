{{- $ns := include "adtech.namespace" . -}}
{{- $jg := .Values.observability.jaeger }}
{{- if $jg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ $ns }}
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ $jg.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # In-memory storage is unbounded by default; with sample_ratio=1
            # a 200rps load run OOMKilled the pod in ~15min. Ring-buffer cap:
            # oldest traces evict, memory stays flat.
            - name: MEMORY_MAX_TRACES
              value: "20000"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 14268
              name: collector
          resources:
            {{- toYaml $jg.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ $ns }}
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 14268
      targetPort: 14268
      name: collector
{{- end }}
