{{- $ns := include "adtech.namespace" . -}}
{{- $prom := .Values.observability.prometheus }}
{{- if $prom.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ $ns }}
---
# Namespace-scoped: Prometheus only discovers targets in the chart namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ $ns }}
---
# Cluster-scoped: node discovery + the kubelet cadvisor proxy, so per-pod
# CPU/memory covers EVERY container (clickhouse/postgres/redis/TB/nats...),
# not just our Go processes' own collectors. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-nodes
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ $ns }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      # K8s pods scrape (container mode / production overlay where
      # services are deployed as K8s Deployments with prometheus.io/port
      # annotation). Opt-in: only pods that set `prometheus.io/scrape: "true"`
      # get scraped. Without this filter, Prometheus would hit every container
      # port — Redis 6379, NATS 4222/6222, Postgres 5432 — with HTTP /metrics
      # requests, which those daemons mistake for protocol attacks.
      # No-op in Tilt fast mode where services run on host.
      - job_name: 'adtech-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['{{ $ns }}']
        relabel_configs:
          # Drop everything that hasn't opted in.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # Replace the SD-default port with the annotated one.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          # Allow override of the metrics path.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: '(.+)'
            target_label: __metrics_path__
          # Conventional labels.
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Kubelet cadvisor via the API-server proxy: true per-container
      # CPU/memory for EVERY pod (infra included — the process collectors
      # above only cover our Go services). Whitelist-filtered: cadvisor is
      # high-cardinality, we keep only the two series the dashboards read.
      - job_name: 'kubernetes-cadvisor'
        # 60s (vs the global 15s): every scrape makes the kubelet walk+render
        # ALL cgroup stats (the relabel drop below happens Prometheus-side,
        # AFTER that work). Per-pod CPU/mem panels read fine at 60s; the k3s
        # process pays 4x less for them.
        scrape_interval: 60s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
            action: keep
          # This kubelet's cadvisor exposes POD-level cgroup rows (labels:
          # namespace+pod) plus hierarchy aggregates that carry only an `id`
          # (/, /kubepods, ...) — and NO `container` label at all (a drop
          # rule on `container` therefore drops EVERYTHING; learned live
          # 2026-08-06). Keep exactly the pod-attributed rows.
          - source_labels: [pod]
            regex: '.+'
            action: keep

  # Trust-the-graphs rules: a zero on a dashboard is ambiguous (real zero /
  # missing data / broken query). These alerts distinguish the cases so a dead
  # panel can't sit silently empty (the Bid-RPS panel did exactly that after a
  # label drift). No Alertmanager locally — they surface in the Prometheus UI
  # and Grafana's alert list, which is enough for a laptop stack.
  rules.yml: |
    groups:
      - name: observability-self-check
        rules:
          - alert: ScrapeTargetDown
            expr: up{job="adtech-pods"} == 0
            for: 2m
            annotations:
              summary: "{{`{{ $labels.pod }}`}} not scraped — its graphs will show gaps/zeros that are NOT real traffic drops"
          - alert: CoreMetricAbsent
            # Fires when the exchange's auction counter series vanish entirely:
            # either the exchange fleet is down (real incident) or a label/
            # query drift broke the metric pipeline (graphs lying). Both need
            # a human.
            expr: absent(adtech_grpc_requests_total{exported_service="exchange"}) and absent(adtech_http_requests_total{exported_service="exchange"})
            for: 5m
            annotations:
              summary: "exchange request counters absent — fleet down OR metrics/label drift; check ClickHouse auctions table for ground truth"
          - alert: ReportingConsumerBacklog
            # The event-bus layer's independent view: JetStream pending count
            # for reporting consumers. Sustained growth = dashboards behind
            # reality (ingest lag), even though serving is fine.
            expr: sum(jetstream_consumer_num_pending) > 50000
            for: 5m
            annotations:
              summary: "JetStream consumer backlog >50k — reporting/dashboard numbers lag live traffic"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ $ns }}
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ $prom.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $prom.retention }}
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml $prom.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ $ns }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
{{- end }}
