{{- $ns := include "adtech.namespace" . -}}
{{- $prom := .Values.observability.prometheus }}
{{- if $prom.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ $ns }}
---
# Namespace-scoped: Prometheus only discovers targets in the chart namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ $ns }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # K8s pods scrape (container mode / production overlay where
      # services are deployed as K8s Deployments with prometheus.io/port
      # annotation). Opt-in: only pods that set `prometheus.io/scrape: "true"`
      # get scraped. Without this filter, Prometheus would hit every container
      # port — Redis 6379, NATS 4222/6222, Postgres 5432 — with HTTP /metrics
      # requests, which those daemons mistake for protocol attacks.
      # No-op in Tilt fast mode where services run on host.
      - job_name: 'adtech-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['{{ $ns }}']
        relabel_configs:
          # Drop everything that hasn't opted in.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # Replace the SD-default port with the annotated one.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          # Allow override of the metrics path.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: '(.+)'
            target_label: __metrics_path__
          # Conventional labels.
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Host-network scrape — for Tilt fast mode, where every Go service
      # runs as a local_resource on the developer's machine. Prometheus
      # (in K8s) reaches the host via host.docker.internal (Colima sets
      # this up; Docker Desktop / Rancher Desktop also support it).
      # Production overlays should remove this whole job.
      - job_name: 'adtech-host-services'
        scrape_interval: 10s
        static_configs:
          - targets: ['host.docker.internal:8080']
            labels: {service: gateway}
          - targets: ['host.docker.internal:8081']
            labels: {service: exchange}
          - targets: ['host.docker.internal:8082']
            labels: {service: dsp, pod: dsp-internal-0}
          - targets: ['host.docker.internal:8083']
            labels: {service: tracker}
          - targets: ['host.docker.internal:8084']
            labels: {service: ssp}
          - targets: ['host.docker.internal:8085']
            labels: {service: adserver}
          - targets: ['host.docker.internal:8086']
            labels: {service: reporting}
          - targets: ['host.docker.internal:8089']
            labels: {service: dsp, pod: dsp-competitor1}
          - targets: ['host.docker.internal:8090']
            labels: {service: dsp, pod: dsp-competitor2}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ $ns }}
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ $prom.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $prom.retention }}
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml $prom.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ $ns }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
{{- end }}
