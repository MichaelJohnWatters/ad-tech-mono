{{- /*
Migration hook — CHART-ONLY addition (deviation from the kustomize source):
there is no migrate Job manifest in k8s/ today; Tilt runs `go run ./cmd/migrate`
on the host. As a helm-managed stack the migrations run in-cluster as a
POST-install/upgrade hook (pre-install would fire before postgres even
exists on a fresh cluster); the init container gates on postgres accepting
connections, and app pods that need the schema crashloop-then-recover
during the same window. Excluded from parity (`helm template --no-hooks`).
*/ -}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: adtech-migrate
  namespace: {{ include "adtech.namespace" . }}
  labels:
    app: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          imagePullPolicy: IfNotPresent
          env:
            {{- toYaml .Values.migrate.env | nindent 12 }}
{{- end }}
