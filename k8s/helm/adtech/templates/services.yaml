{{- /*
Generic app-service template: one Deployment + Service (+ optional Ingress)
per entry in .Values.services. Mirrors the per-service manifests in k8s/base/.
Probes default to /healthz (liveness) + /readyz (readiness) on the first
port; per-service values override them verbatim.
*/ -}}
{{- $ns := include "adtech.namespace" . -}}
{{- range $name, $svc := .Values.services }}
{{- if ne ($svc.enabled | default true) false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # Auto-registration with Prometheus (the 'adtech-pods' job keeps
        # only annotated pods) — every REPLICA becomes a scrape target, so
        # per-service "up" counts reflect real pod counts, not the retired
        # static host list (which showed 1 per service under multi-pod).
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ (first $svc.ports).port }}"
    spec:
      # K8s service-link env injection collides with pkg/config's env-var
      # fallback (see k8s/base/tracker/deployment.yaml) — off platform-wide.
      enableServiceLinks: false
      {{- with $svc.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: {{ $svc.containerName | default $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $svc.imagePullPolicy | default "IfNotPresent" }}
          ports:
            {{- range $svc.ports }}
            - containerPort: {{ .port }}
              name: {{ .name }}
            {{- end }}
          {{- with $svc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- toYaml $svc.env | nindent 12 }}
            {{- /* Global debug-endpoints toggle. debug.endpoints_enabled defaults
                   to true (dev); prod/staging set global.debugEndpoints=false to
                   turn OFF /debug/*, the dev token minter (/v1/auth/token) and the
                   /dev/* console cluster-wide. Injected only on an EXPLICIT false
                   (avoids the Sprig `default true` bool-false gotcha). */}}
            {{- if eq (toString (($.Values.global | default dict).debugEndpoints)) "false" }}
            - name: DEBUG_ENDPOINTS_ENABLED
              value: "false"
            {{- end }}
            {{- /* extraEnv is APPENDED (env is a list, which Helm replaces
                   wholesale on override — so overlays add vars here instead of
                   restating the whole env). */}}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /healthz
              port: {{ (first $svc.ports).port }}
            initialDelaySeconds: 5
            {{- end }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /readyz
              port: {{ (first $svc.ports).port }}
            periodSeconds: 2
            failureThreshold: 5
            {{- end }}
      {{- with $svc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    {{- range $svc.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
{{- if $svc.ingress }}
{{- $tls := $.Values.tls | default dict }}
{{- /* Ingress hostnames derive from ONE knob: global.domain (default adtech.local).
       ingress.subdomains: [gateway] → gateway.<domain>; ingress.apex: true → the
       bare <domain>; ingress.hosts: [...] → verbatim (override/back-compat). Prod
       sets global.domain=your-real-domain.com and every host follows. */}}
{{- $domain := (($.Values.global | default dict).domain | default "adtech.local") }}
{{- $hosts := list }}
{{- range ($svc.ingress.subdomains | default list) }}{{- $hosts = append $hosts (printf "%s.%s" . $domain) }}{{- end }}
{{- if $svc.ingress.apex }}{{- $hosts = append $hosts $domain }}{{- end }}
{{- range ($svc.ingress.hosts | default list) }}{{- $hosts = append $hosts . }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    {{- if $tls.enabled }}
    # TLS: terminate at Traefik's websecure (443) entrypoint. Same wiring in
    # every env — only where the CERT comes from differs (values.tls):
    #   local  → a pre-created mkcert secret (tls.secretName)
    #   prod   → cert-manager issues per-ingress (tls.certManager.clusterIssuer)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- if $tls.certManager }}
    cert-manager.io/cluster-issuer: {{ $tls.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if $tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      # cert-manager writes into a per-ingress secret; local uses the shared
      # mkcert secret. Either way the secret lives in this service's namespace.
      secretName: {{ if $tls.certManager }}{{ $name }}-tls{{ else }}{{ $tls.secretName | default "adtech-tls" }}{{ end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ (first $svc.ports).port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
