{{- /*
Generic app-service template: one Deployment + Service (+ optional Ingress)
per entry in .Values.services. Mirrors the per-service manifests in k8s/base/.
Probes default to /healthz (liveness) + /readyz (readiness) on the first
port; per-service values override them verbatim.
*/ -}}
{{- $ns := include "adtech.namespace" . -}}
{{- range $name, $svc := .Values.services }}
{{- if ne ($svc.enabled | default true) false }}
---
apiVersion: apps/v1
{{- /* A service with a `persistence:` block becomes a StatefulSet so each replica
       gets its OWN PVC (volumeClaimTemplates) that survives pod eviction/reschedule
       — used by the event-spool services (exchange/tracker/adserver) so an evicted
       pod doesn't lose un-drained money events while NATS is down. Without it, a
       plain Deployment (+ emptyDir) as before. NOTE: switching a service between
       kinds on a LIVE cluster needs the old object deleted first (helm can't patch
       across kinds) — enable persistence on a fresh install or delete the old
       Deployment during the upgrade. */}}
kind: {{ if $svc.persistence }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
spec:
  {{- if $svc.persistence }}
  serviceName: {{ $name }}
  {{- end }}
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # Auto-registration with Prometheus (the 'adtech-pods' job keeps
        # only annotated pods) — every REPLICA becomes a scrape target, so
        # per-service "up" counts reflect real pod counts, not the retired
        # static host list (which showed 1 per service under multi-pod).
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ (first $svc.ports).port }}"
    spec:
      # K8s service-link env injection collides with pkg/config's env-var
      # fallback (see k8s/base/tracker/deployment.yaml) — off platform-wide.
      enableServiceLinks: false
      {{- /* Hardened pod securityContext — gated behind global.hardenedContainers
             (default off; prod/staging set it true). REQUIRES the images to run
             as a non-root USER (build/Dockerfile* — a paired change validated on
             the first hardened deploy), else runAsNonRoot refuses to start the
             pod. Explicit-true check avoids the Sprig bool-false gotcha. */}}
      {{- if and (eq (toString (($.Values.global | default dict).hardenedContainers)) "true") (ne (toString $svc.hardenedExempt) "true") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- with $svc.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: {{ $svc.containerName | default $name }}
          image: {{ include "adtech.image" (dict "name" $svc.image "g" $.Values.global) }}
          imagePullPolicy: {{ $svc.imagePullPolicy | default "IfNotPresent" }}
          {{- if and (eq (toString (($.Values.global | default dict).hardenedContainers)) "true") (ne (toString $svc.hardenedExempt) "true") }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem intentionally omitted — several services
            # write scratch to / or /tmp; enabling it needs per-service emptyDir
            # mounts + validation. Do that as a follow-up once the above is proven.
          {{- end }}
          ports:
            {{- range $svc.ports }}
            - containerPort: {{ .port }}
              name: {{ .name }}
            {{- end }}
            {{- with $svc.grpcPort }}
            - containerPort: {{ . }}
              name: grpc
            {{- end }}
          {{- with $svc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- toYaml $svc.env | nindent 12 }}
            {{- /* Global debug-endpoints toggle. debug.endpoints_enabled defaults
                   to true (dev); prod/staging set global.debugEndpoints=false to
                   turn OFF /debug/*, the dev token minter (/v1/auth/token) and the
                   /dev/* console cluster-wide. Injected only on an EXPLICIT false
                   (avoids the Sprig `default true` bool-false gotcha). */}}
            {{- if eq (toString (($.Values.global | default dict).debugEndpoints)) "false" }}
            - name: DEBUG_ENDPOINTS_ENABLED
              value: "false"
            {{- end }}
            {{- /* extraEnv is APPENDED (env is a list, which Helm replaces
                   wholesale on override — so overlays add vars here instead of
                   restating the whole env). */}}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- /* Real object storage (staging/prod): when global.s3.endpoint is
                   set, inject the S3 endpoint + region + SSL + credentials so
                   every service talks to real S3 instead of the in-cluster Minio
                   (disabled in those envs). Injected LAST so it overrides each
                   service's per-service Minio S3_* defaults — k8s takes the last
                   value for a repeated env name. Per-service S3_BUCKET stays in
                   the base env. Local dev leaves global.s3.endpoint empty → no
                   injection → the Minio env is unchanged. accessKey/secretKey
                   come from the SOPS overlay; omitted-when-empty so a partial
                   overlay never blanks a value. */}}
            {{- $s3 := (($.Values.global | default dict).s3 | default dict) }}
            {{- if $s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ $s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ $s3.region | default "us-east-1" | quote }}
            - name: S3_USE_SSL
              value: {{ $s3.useSSL | default false | quote }}
            {{- with $s3.accessKey }}
            - name: S3_ACCESS_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with $s3.secretKey }}
            - name: S3_SECRET_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /healthz
              port: {{ (first $svc.ports).port }}
            initialDelaySeconds: 5
            {{- end }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /readyz
              port: {{ (first $svc.ports).port }}
            periodSeconds: 2
            failureThreshold: 5
            {{- end }}
      {{- /* Ephemeral volumes (emptyDir etc.). Skipped when persistence is on —
             the PVC volumeClaimTemplate below backs the same mount name instead. */}}
      {{- if not $svc.persistence }}
      {{- with $svc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
  {{- if $svc.persistence }}
  {{- /* One PVC per replica, bound to the same mount the emptyDir used (the first
         volumeMount — the event-spool dir). ReadWriteOnce is right: each pod owns
         its own spool. storageClass unset → the cluster default (local-path on
         k3s, gp3/pd-ssd in prod via the env's values). */}}
  volumeClaimTemplates:
    - metadata:
        name: {{ (first $svc.volumeMounts).name }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $svc.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $svc.persistence.size | default "512Mi" }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    {{- range $svc.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
{{- if $svc.grpcPort }}
---
# Headless twin for the internal gRPC port: clients dial
# grpc://<name>-grpc:<port> and pkg/grpcx resolves pod IPs via DNS
# (dns:///) with round_robin, spreading RPCs across replicas. A normal
# ClusterIP would pin each client's single multiplexed HTTP/2 conn to
# one pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-grpc
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
spec:
  clusterIP: None
  selector:
    app: {{ $name }}
  ports:
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: {{ $svc.grpcPort }}
{{- end }}
{{- if $svc.ingress }}
{{- $tls := $.Values.tls | default dict }}
{{- /* Ingress hostnames derive from ONE knob: global.domain (default adtech.local).
       ingress.subdomains: [gateway] → gateway.<domain>; ingress.apex: true → the
       bare <domain>; ingress.hosts: [...] → verbatim (override/back-compat). Prod
       sets global.domain=your-real-domain.com and every host follows. */}}
{{- $domain := (($.Values.global | default dict).domain | default "adtech.local") }}
{{- $hosts := list }}
{{- range ($svc.ingress.subdomains | default list) }}{{- $hosts = append $hosts (printf "%s.%s" . $domain) }}{{- end }}
{{- if $svc.ingress.apex }}{{- $hosts = append $hosts $domain }}{{- end }}
{{- range ($svc.ingress.hosts | default list) }}{{- $hosts = append $hosts . }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    {{- if $tls.enabled }}
    # TLS: terminate at Traefik's websecure (443) entrypoint. Same wiring in
    # every env — only where the CERT comes from differs (values.tls):
    #   local  → a pre-created mkcert secret (tls.secretName)
    #   prod   → cert-manager issues per-ingress (tls.certManager.clusterIssuer)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- if $tls.certManager }}
    cert-manager.io/cluster-issuer: {{ $tls.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if $tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      # cert-manager writes into a per-ingress secret; local uses the shared
      # mkcert secret. Either way the secret lives in this service's namespace.
      secretName: {{ if $tls.certManager }}{{ $name }}-tls{{ else }}{{ $tls.secretName | default "adtech-tls" }}{{ end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ (first $svc.ports).port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
