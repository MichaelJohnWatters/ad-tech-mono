{{- $ns := include "adtech.namespace" . -}}
{{- $pg := .Values.infra.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: {{ $pg.replicas }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: adtech
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "adtech"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "adtech"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $pg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None # headless for StatefulSet
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
type: Opaque
stringData:
  username: {{ $pg.credentials.username }}
  password: {{ $pg.credentials.password }} # plaintext for local, SOPS-encrypted in staging/prod
