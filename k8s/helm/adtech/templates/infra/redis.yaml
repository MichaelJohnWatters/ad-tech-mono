{{- $ns := include "adtech.namespace" . -}}
{{- $redis := .Values.infra.redis }}
{{- /* infra.redis.enabled=false → no in-cluster Redis; point services at a
       managed Redis via REDIS_URL. Redis is a cache — budget/pacing counters
       reconcile from Postgres — so cache loss is tolerable. Default true. */}}
{{- if ne (toString $redis.enabled) "false" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ $redis.image }}
          imagePullPolicy: IfNotPresent
          {{- /* --save "": RDB persistence OFF. This Redis is a pure cache
                 (no PVC — a restart was always a wipe): freq caps degrade
                 gracefully, budget/pacing counters reconcile from the stores,
                 the audience cache reconciles from Postgres. RDB bought no
                 durability but its fork-every-60s stalled the event loop
                 under load, which is exactly what tripped the probes. */}}
          args: ["--maxmemory", "{{ $redis.maxmemory }}", "--maxmemory-policy", "{{ $redis.maxmemoryPolicy }}", "--save", ""]
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml $redis.resources | nindent 12 }}
          {{- /* timeoutSeconds 5 (default 1): under load a redis-cli ping can
                 exceed 1s on a busy laptop VM; with failureThreshold 3 the
                 kubelet then KILLED a healthy loaded Redis mid-run (seen
                 2026-08-04: 3 restarts during a 150 rps load test, wiping
                 caps/budgets/pacing counters each time and spiking auction
                 latency with dial-timeouts). A truly wedged Redis still fails
                 3×5s probes and restarts. */}}
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ $ns }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
