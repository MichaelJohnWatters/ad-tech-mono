{{- $ns := include "adtech.namespace" . -}}
{{- $redis := .Values.infra.redis }}
{{- /* infra.redis.enabled=false → no in-cluster Redis; point services at a
       managed Redis via REDIS_URL. Redis is a cache — budget/pacing counters
       reconcile from Postgres — so cache loss is tolerable. Default true. */}}
{{- if ne (toString $redis.enabled) "false" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ $redis.image }}
          imagePullPolicy: IfNotPresent
          args: ["--maxmemory", "{{ $redis.maxmemory }}", "--maxmemory-policy", "{{ $redis.maxmemoryPolicy }}"]
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml $redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ $ns }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
