{{- /*
Docker Hub pull-through cache (NodePort 30500) — a local-dev concern; see
k8s/base/registry-mirror/deployment.yaml. Disable in staging/prod values.
*/ -}}
{{- $ns := include "adtech.namespace" . -}}
{{- $reg := .Values.infra.registryMirror }}
{{- if $reg.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-mirror-data
  namespace: {{ $ns }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $reg.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-mirror
  namespace: {{ $ns }}
  labels:
    app: registry-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry-mirror
  template:
    metadata:
      labels:
        app: registry-mirror
    spec:
      containers:
        - name: registry
          image: {{ $reg.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: {{ $reg.remoteURL }}
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            {{- toYaml $reg.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-mirror-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry-mirror
  namespace: {{ $ns }}
spec:
  type: NodePort
  selector:
    app: registry-mirror
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: {{ $reg.nodePort }}
      name: http
{{- end }}
