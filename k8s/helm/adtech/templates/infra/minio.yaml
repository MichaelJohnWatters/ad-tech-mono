{{- $ns := include "adtech.namespace" . -}}
{{- $minio := .Values.infra.minio }}
{{- /* infra.minio.enabled=false → no in-cluster Minio; point services at real S3
       via S3_ENDPOINT (+ creds). S3 is the durable object backbone (creatives,
       Parquet cold lake, reports, onboarding files). Default true (local). */}}
{{- if ne (toString $minio.enabled) "false" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ $minio.image }}
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ $minio.rootUser }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ $minio.rootPassword }}
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            {{- toYaml $minio.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: {{ $ns }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $minio.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ $ns }}
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
{{- end }}
