# Staging overrides.
#
# NOTE: k8s/overlays/staging does NOT exist in the repo (k8s/CLAUDE.md
# describes it, but it was never created). This file therefore translates the
# DOCUMENTED staging deltas — k8s/CLAUDE.md "Environment Differences" table and
# the "staging/prod overlays override..." comments in the base manifests —
# rather than a real overlay. Deltas applied:
#   - NATS back to the base 3-node JetStream cluster (local-only single node)
#   - serving-path services at 2 replicas ("HPA min 2")
#   - registry-mirror off (local pull-through cache for OrbStack/k3s only)
#   - Mailpit kept (staging uses "Mailpit or SES sandbox")
#
# Still required out-of-band for a real staging environment (values in the
# default values.yaml are LOCAL dev values):
#   - image tags from CI (build/Dockerfile with SERVICE=<name>) instead of the
#     Tilt-built local names
#   - real S3 endpoint/credentials + SOPS-managed postgres/clickhouse secrets
#     (override infra.*.credentials / the S3_* env entries per service — the
#     env lists replace wholesale)
#   - browser-facing URLs (ADSERVER_TRACKER_URL, PUBLISHER_ADSERVER_TRACKER_URL,
#     SSAI_PUBLIC_URL, TRANSCODER_PUBLIC_BASE, REPORT_RUNNER_PUBLIC_GATEWAY_URL)
#     pointed at the public staging gateway, not http://localhost:8080

# Turn OFF debug/dev endpoints (/debug/*, the /v1/auth/token dev minter, /dev/*)
# cluster-wide — staging shares prod's posture.
global:
  debugEndpoints: false
  # ONE domain knob: every ingress host + cert SAN derives from it
  # (templates/services.yaml). No registered domain? Point at the node IP with
  # sslip.io — `<node-ip>.sslip.io` resolves anywhere and Let's Encrypt HTTP-01
  # validates it, so staging needs no DNS purchase. Match the SSP/exchange
  # seller-domain extraEnv below to whatever you set here.
  domain: REPLACE.sslip.io        # e.g. 203-0-113-5.sslip.io, or adtech.staging.yourdomain.com
  # App images from the build-push workflow (ghcr.io/<owner>/adtech-<svc>:<tag>).
  # Owner must be lowercase. Pin tag to a sha-<hash> for reproducibility, or use
  # the moving `main` tag. Infra images (postgres/nats/…) are unaffected.
  image:
    registry: ghcr.io/REPLACE-owner
    tag: main
  # Real object storage (in-cluster Minio disabled below). endpoint/region/useSSL
  # are non-secret and set here; accessKey/secretKey come from the SOPS overlay
  # (k8s/helm/adtech/secrets/staging.secrets.enc.yaml). Works with AWS S3,
  # DigitalOcean Spaces, Cloudflare R2, Backblaze B2 — any S3-compatible endpoint.
  s3:
    endpoint: REPLACE-s3-endpoint    # e.g. s3.us-east-1.amazonaws.com, nyc3.digitaloceanspaces.com
    region: us-east-1
    useSSL: true

# TLS via cert-manager (Let's Encrypt staging issuer — avoids the LE rate limit
# while validating the pipeline). Install cert-manager + the issuer out-of-band.
tls:
  enabled: true
  certManager:
    clusterIssuer: letsencrypt-staging

infra:
  nats:
    replicas: 3
    cluster:
      enabled: true
  registryMirror:
    enabled: false
  # All data services stay IN-CLUSTER for staging (Postgres/Redis/NATS/ClickHouse
  # as pods) — only object storage goes to real S3, so disable the in-cluster
  # Minio and let global.s3 (above) + the SOPS creds take over. Postgres/
  # ClickHouse passwords come from the SOPS overlay too.
  minio:
    enabled: false

services:
  dsp-internal:
    # Autoscaled from base (global.autoscaling). spec.replicas is omitted for an
    # hpa'd service, so encode the staging floor as hpa.minReplicas — a plain
    # `replicas:` here would be dead.
    hpa: { minReplicas: 2, maxReplicas: 6 }
  dsp-competitor1:
    replicas: 2
  dsp-competitor2:
    replicas: 2
  ssp:
    hpa: { minReplicas: 2, maxReplicas: 6 }
    # Strict enforcement inherited from base; override the seller identity to the
    # staging platform domain (match global.domain).
    extraEnv:
      - name: SSP_SELLER_DOMAIN
        value: "REPLACE.sslip.io"   # ← match global.domain
  exchange:
    hpa: { minReplicas: 2, maxReplicas: 6 }
    # Durable event spool (survives pod eviction/reschedule on multi-node) — the
    # emptyDir in base values would lose un-drained money events if the pod moved
    # while NATS was down. Per-replica PVC via StatefulSet. storageClass unset →
    # cluster default; set it if you need a specific class.
    persistence:
      size: 512Mi
    extraEnv:
      - name: EXCHANGE_ADSTXT_SELLER_DOMAIN
        value: "REPLACE.sslip.io"   # ← match global.domain
      # EXCHANGE_ADCERT_SIGN_KEY: provision via the adcert_ed25519 secret
      # (seeded into the Postgres secrets table, or add as extraEnv in the SOPS
      # overlay). The exchange prefers the store key over the dev env fallback.
  adserver:
    hpa: { minReplicas: 2, maxReplicas: 6 }
    # Durable event spool (see exchange note above).
    persistence:
      size: 512Mi
    # PUBLIC browser-facing pixel base baked into served ad HTML — MUST be HTTPS
    # (mixed-content blocks http pixels) and match global.domain.
    extraEnv:
      - name: ADSERVER_TRACKER_URL
        value: "https://tracker.REPLACE.sslip.io"   # ← match global.domain
  publisher-adserver:
    hpa: { minReplicas: 2, maxReplicas: 5 }
    extraEnv:
      - name: PUBLISHER_ADSERVER_TRACKER_URL
        value: "https://tracker.REPLACE.sslip.io"   # ← match global.domain
      - name: PUBLISHER_ADSERVER_PUBLIC_URL
        value: "https://pubad.REPLACE.sslip.io"     # ← match global.domain
  tracker:
    hpa: { minReplicas: 3, maxReplicas: 8 }
    # Durable event spool (see exchange note above). Per-replica PVC — each tracker
    # pod keeps its own spool (min 3 — never below the readiness-flap floor).
    persistence:
      size: 512Mi
  gateway:
    hpa: { minReplicas: 2, maxReplicas: 6 }
    # Auth mandatory in staging too (mirror prod). extraEnv APPENDS.
    # public_tracker_url is baked into advertiser conversion pixels (HTTPS).
    extraEnv:
      - name: GATEWAY_REQUIRE_AUTH
        value: "true"
      - name: GATEWAY_PUBLIC_TRACKER_URL
        value: "https://tracker.REPLACE.sslip.io"   # ← match global.domain
  # Single-replica BY DESIGN (do not scale without code changes):
  # reporting (in-process billing Summary + spend-snapshot publisher),
  # identity-consumer (in-memory fingerprint buckets),
  # report-runner (boot-time stuck-job requeue).

# No localhost klipper-lb exposure outside local dev.
localExpose:
  enabled: false
