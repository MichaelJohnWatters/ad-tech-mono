# Production overrides.
#
# NOTE: k8s/overlays/prod does NOT exist in the repo (k8s/CLAUDE.md describes
# it, but it was never created). This file therefore translates the DOCUMENTED
# prod deltas — k8s/CLAUDE.md "Environment Differences" table ("HPA min 2,
# higher max", prod S3, SES/Sendgrid email, SOPS secrets, per-service Redis)
# and the "prod overlays..." comments in the base manifests. Deltas applied:
#   - NATS 3-node JetStream cluster (base topology)
#   - serving-path services at higher replica counts
#   - registry-mirror off (local-only), Mailpit off (prod uses SES/Sendgrid —
#     override REPORT_RUNNER_SMTP_HOST accordingly)
#   - TigerBeetle grid cache back toward its default (base shrinks it for the
#     local VM; see k8s/base/tigerbeetle/statefulset.yaml)
#
# Still required out-of-band for a real prod environment:
#   - CI-built image tags (values here keep the local names — override per
#     service, e.g. services.tracker.image: registry.example.com/adtech-tracker:vX)
#   - SOPS-managed postgres/clickhouse/minio credentials and real S3 endpoints
#   - public browser-facing URLs (ADSERVER_TRACKER_URL,
#     PUBLISHER_ADSERVER_TRACKER_URL, SSAI_PUBLIC_URL, TRANSCODER_PUBLIC_BASE,
#     REPORT_RUNNER_PUBLIC_GATEWAY_URL, REPORT_RUNNER_SMTP_HOST) — the env
#     lists replace wholesale, so restate the full list per service
#   - per-service Redis (docs) — the chart currently models the single shared
#     Redis the base ships; splitting it is future work

# ONE knob: your real registered domain. Every browser-facing ingress host
# (gateway.<domain>, adserver.<domain>, tracker.<domain>, ssp.<domain>,
# pubad.<domain>, the apex <domain>, …) + the cert SANs derive from it. Point
# your DNS A/AAAA (or Cloudflare CNAME) at the ingress LB IP for these hosts.
global:
  domain: adtech.example.com   # ← change to your domain
  # Turn OFF debug/dev endpoints cluster-wide: /debug/*, the dev token minter
  # (/v1/auth/token — mints admin JWTs with no credential), and the /dev/* console.
  # MUST stay false in prod.
  debugEndpoints: false

# TLS: real Let's Encrypt certs via cert-manager (install cert-manager + define
# the `letsencrypt-prod` ClusterIssuer out-of-band once). The Ingress template
# then requests a per-ingress cert automatically — same wiring as local, only
# the issuer differs. Point the ingress hosts at your real domain per service.
tls:
  enabled: true
  certManager:
    clusterIssuer: letsencrypt-prod
    # After installing cert-manager once, set createIssuers: true + your email and
    # the chart renders the letsencrypt-staging/prod ClusterIssuers for you
    # (templates/cert-issuers.yaml). Leave false to manage issuers out-of-band.
    createIssuers: false
    email: ""   # ← ops@yourdomain.com (required when createIssuers: true)

# ============================================================
# PERSISTENCE (the "fixed persistence layer" for prod).
#
# Recommended topology — bring-your-own MANAGED stores where it matters, keep
# the rest in-cluster on a DURABLE storageClass:
#   Postgres (source of truth) → MANAGED (RDS/CloudSQL). Set infra.postgres.enabled
#     =false and override DATABASE_URL (services + the migrate job) to the managed
#     endpoint (SOPS). Its automated snapshots/PITR replace the backup CronJob.
#   TigerBeetle (money ledger)  → in-cluster but CLUSTERED (replicas>=3) on a
#     durable class — data loss = lost ledger.
#   ClickHouse (analytics)      → managed/replicated, OR in-cluster on a durable
#     class (partially rebuildable from the S3 Parquet lake + NATS).
#   NATS (events)               → 3-node JetStream cluster (below) on a durable class.
#   Redis (cache)               → MANAGED, or in-cluster (cache loss tolerable —
#     budget/pacing counters reconcile from Postgres).
#   S3/object store             → REAL S3 (infra.minio.enabled=false + S3_ENDPOINT).
#
# The `enabled` + `storageClass` knobs below make each of those a values swap.
# storageClass values shown are AWS gp3 examples — set your cloud's SSD class.
infra:
  nats:
    replicas: 3
    cluster:
      enabled: true
    storageClass: gp3
  registryMirror:
    enabled: false
  mailpit:
    enabled: false
  # Managed Postgres example (uncomment + override DATABASE_URL via SOPS):
  # postgres:
  #   enabled: false
  # Managed Redis example:
  # redis:
  #   enabled: false
  postgres:
    storageClass: gp3
  clickhouse:
    storageClass: gp3
  minio:
    # In real prod prefer S3 (minio.enabled=false + S3_ENDPOINT); if kept, durable class:
    storageClass: gp3
  tigerbeetle:
    replicas: 3          # CLUSTERED for the money ledger (do not run 1 in prod)
    storageClass: gp3
    cacheGrid: 1GiB
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits: { cpu: "2", memory: "6Gi" }

# Postgres backup CronJob — only for the SELF-HOSTED-Postgres case. With managed
# Postgres, use its snapshots/PITR instead and leave this off. Override args to
# ship dumps offsite to S3.
backup:
  postgres:
    enabled: false
    schedule: "0 2 * * *"
    retentionDays: 14
    storageClass: gp3
    storage: 50Gi

services:
  dsp-internal:
    replicas: 3
  dsp-competitor1:
    replicas: 2
  dsp-competitor2:
    replicas: 2
  ssp:
    replicas: 3
  exchange:
    replicas: 3
  adserver:
    replicas: 3
    # PUBLIC browser-facing pixel base baked into served ad HTML. MUST be HTTPS
    # (an HTTPS publisher page blocks http pixels as mixed content) and match
    # global.domain. Points at the tracker's public ingress host.
    extraEnv:
      - name: ADSERVER_TRACKER_URL
        value: "https://tracker.adtech.example.com"   # ← match global.domain
  publisher-adserver:
    replicas: 2
    extraEnv:
      - name: PUBLISHER_ADSERVER_TRACKER_URL
        value: "https://tracker.adtech.example.com"   # ← match global.domain
      - name: PUBLISHER_ADSERVER_PUBLIC_URL
        value: "https://pubad.adtech.example.com"     # ← match global.domain
  tracker:
    replicas: 4
  gateway:
    replicas: 2
    # Auth is MANDATORY in prod: refuse to boot with the dev auth-bypass. Needs
    # an active jwt_signing secret (seeded/SOPS) or GATEWAY_JWT_SIGNING_KEY.
    # The public_tracker_url is baked into advertiser conversion pixels (HTTPS,
    # must resolve from the advertiser's own site). creatives_store_url → your
    # S3/CDN. extraEnv APPENDS (doesn't replace the base env list).
    extraEnv:
      - name: GATEWAY_REQUIRE_AUTH
        value: "true"
      - name: GATEWAY_PUBLIC_TRACKER_URL
        value: "https://tracker.adtech.example.com"   # ← match global.domain
      - name: GATEWAY_CREATIVES_STORE_URL
        value: "https://cdn.adtech.example.com/adtech-creatives/"  # ← your S3/CDN
  # Single-replica BY DESIGN (do not scale without code changes):
  # reporting, identity-consumer, report-runner — see the deployment comments
  # in k8s/base/*/deployment.yaml.

# No localhost klipper-lb exposure outside local dev.
localExpose:
  enabled: false
