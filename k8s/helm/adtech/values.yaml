      # demo sites. The localhost/bridge/e2e path (no such header) keeps using
      # PUBLISHER_ADSERVER_TRACKER_URL unchanged.
      - name: PUBLISHER_ADSERVER_PUBLIC_URL_SECURE
        value: "https://gateway.adtech.local"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8088 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8088 }
