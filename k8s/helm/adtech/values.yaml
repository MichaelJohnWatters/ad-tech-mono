  publisher-adserver:
    image: adtech-publisher-adserver
    replicas: 3
    hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70 }
    ports: [{ name: http, port: 8088 }]
    env:
      - name: POD_NAME
