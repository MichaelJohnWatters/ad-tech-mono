    volumes:
      - name: event-spool
        emptyDir: { sizeLimit: 512Mi }
    volumeMounts:
      - name: event-spool
        mountPath: /var/spool/adtech-events
    resources:
      requests: { cpu: 250m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8085 }
      initialDelaySeconds: 5
      periodSeconds: 10
