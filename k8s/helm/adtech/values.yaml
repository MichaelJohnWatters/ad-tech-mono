# Default values == the LOCAL dev environment. Staging/prod override via
# values-staging.yaml / values-prod.yaml.
#
# Provenance: derived from k8s/base + the Tiltfile's k8s_yaml set, with
# field-level parity proven at the cutover (scripts/helm-parity.sh, 91/91).
# The chart is now the SOURCE OF TRUTH and has deliberately diverged since
# (localExpose LB services, postgres max_connections, migrate hook);
# k8s/base is frozen history.

namespace: adtech
createNamespace: true

# ONE knob for the ingress domain. Every browser-facing host derives from it
# (services set ingress.subdomains / ingress.apex). Local = adtech.local (matches
# the mkcert wildcard + /etc/hosts). Prod overlays set global.domain to the real
# registered domain and every ingress host + cert follows automatically.
global:
  domain: adtech.local
  # Master switch for HorizontalPodAutoscalers. A service scales only if it BOTH
  # has an `hpa:` block AND this is not false. Needs metrics-server (ships with
  # k3s / Rancher Desktop). Set false in an env without it to fall back to the
  # fixed `replicas` counts. NOTE: env files (staging/prod) encode their floors as
  # hpa.minReplicas, not `replicas:`, so disabling autoscaling there falls back to
  # THIS file's base `replicas` (e.g. tracker → 3, not the prod min of 4). If you
  # run an env with autoscaling off, set an explicit `replicas:` per service too.
  # See templates/services.yaml + PLAN "Autoscaling (HPA)".
  autoscaling: true
  # Master switch for PodDisruptionBudgets. A PDB is emitted for every service that
  # is autoscaled OR runs >1 replica (never for singletons — a PDB on a 1-replica
  # workload would deadlock its own drain), default maxUnavailable:1. Set false to
  # skip them (e.g. a single-node cluster where a drain must be allowed to take a
  # service down). Per-service override: `pdb: {maxUnavailable: N}` / `{minAvailable: N}` / `false`.
  pdb: true
  # App-image source. EMPTY registry (local dev) = the bare locally-built image
  # names (adtech-<svc>) resolved from the node's docker engine — unchanged.
  # Staging/prod set these to the CI registry + a tag so every app image becomes
  # <registry>/adtech-<svc>:<tag> (see templates/_helpers.tpl "adtech.image").
  # Infra images (postgres/nats/…) are third-party and ignore this.
  image:
    registry: ""
    tag: ""
  # Object storage. EMPTY endpoint (local dev) = each service keeps its own
  # per-service S3_* env pointed at the in-cluster Minio — UNCHANGED. Staging/
  # prod set global.s3.endpoint (real S3 / Spaces / R2) + region + useSSL and the
  # template injects S3_ENDPOINT/S3_REGION/S3_USE_SSL/S3_ACCESS_KEY/S3_SECRET_KEY
  # into every service, overriding the Minio defaults (see templates/services.yaml).
  # accessKey/secretKey come from the SOPS-encrypted overlay — never committed.
  # Per-service S3_BUCKET stays in each service's own env.
  s3:
    endpoint: ""
    region: "us-east-1"
    useSSL: true
    accessKey: ""
    secretKey: ""
  # External demo publisher sites (cmd/demosite) as real in-cluster workloads in
  # their OWN `demosites` namespace, gated OFF by default so they never affect the
  # core stack. Enable with --set global.demosites=true (see templates/demosites.yaml
  # + the `demosites:` block below). Purely additive: a new namespace + 3
  # Deployments/Services/Ingresses (chronicle/gadget/primereel/soundwave/
  # twitchr/viewtube).
  demosites: false

  # OTEL trace sampling override for the WHOLE serving fleet, applied through
  # helm (injected LAST in templates/services.yaml → k8s takes the last value
  # for the repeated OTEL_SAMPLE_RATIO env). Empty (default) → each service
  # keeps its per-service default ("0.1"). Set to "1.0" to fully trace the
  # fleet for a demo/deep-debug: `helm upgrade --reuse-values --set
  # global.otelSampleRatio=1.0`. This is what `make demo-setup` now uses instead
  # of an out-of-band `kubectl set env` — the latter created a competing
  # field-manager that then broke every later `helm upgrade` (field conflict).
  otelSampleRatio: ""

# TLS for the browser-facing ingresses (gateway/adserver/tracker/ssp/pubad).
# Same Ingress wiring in every env (templates/services.yaml terminates at
# Traefik's websecure/443 entrypoint); only the cert SOURCE differs:
#   local → a pre-created mkcert secret (`adtech-tls`, made by `make stack-up`
#           from dev/tls/*.pem; wildcard *.adtech.local, trusted by the mkcert
#           local CA). No cert-manager needed locally.
#   prod  → set tls.certManager.clusterIssuer (see values-prod.yaml) and
#           cert-manager issues a real Let's Encrypt cert per ingress.
# Reach it on the host at https://<host>.adtech.local (Traefik LB is bound on
# localhost:443). Add the hostnames to /etc/hosts pointing at 127.0.0.1, e.g.:
#   127.0.0.1 gateway.adtech.local adserver.adtech.local tracker.adtech.local ssp.adtech.local pubad.adtech.local
tls:
  enabled: true
  secretName: adtech-tls

# External demo publisher sites (cmd/demosite). Only rendered when
# global.demosites=true (default off). Each entry in `sites` becomes a branded
# origin (DEMOSITE_SITE=<slug>) with its own Deployment + Service + Ingress at
# <slug>.<global.domain>. The demosite is a THIRD PARTY by design: its HTML hands
# the BROWSER these PUBLIC ingress URLs (cross-origin fetch), NEVER in-cluster DNS.
# urls.* default to <scheme>://{pubad,gateway}.<global.domain> — override for a real
# public domain. tls.crt/tls.key are the base64 PEM of the wildcard *.adtech.local
# dev cert, COPIED into the demosites namespace so the per-site Ingress can
# reference it (Ingress→Secret is same-namespace only); `make deploy-demosites`
# (or `DEMOSITES=1 make stack-up`) fills them with the base64 of dev/tls/*.pem —
# the same material as the core adtech-tls secret. Empty → the Ingress falls back
# to plain HTTP (:80).
demosites:
  namespace: demosites
  image: adtech-demosite
  imagePullPolicy: IfNotPresent
  port: 9000
  # Each site maps to its OWN seeded "DEMO SITE -" publisher + full placement set
  # (profiles/publishers/demosites.yaml) so ads serve and impressions attribute to
  # that distinct tenant, not the shared pub-simulator. slug = DEMOSITE_SITE +
  # ingress subdomain. (A bare slug string still works — legacy pub-simulator mode.)
  sites:
    - slug: chronicle
      siteName: "DEMO SITE - The Daily Chronicle"
      publisherId: pub-demosite-chronicle
      placements:
        display: pl-demosite-chronicle-display
        native: pl-demosite-chronicle-native
        video: pl-demosite-chronicle-video
        audio: pl-demosite-chronicle-audio
    - slug: gadget
      siteName: "DEMO SITE - Gadget Grotto"
      publisherId: pub-demosite-gadget
      placements:
        display: pl-demosite-gadget-display
        native: pl-demosite-gadget-native
        video: pl-demosite-gadget-video
        audio: pl-demosite-gadget-audio
    - slug: primereel
      siteName: "DEMO SITE - PrimeReel"
      publisherId: pub-demosite-primereel
      placements:
        display: pl-demosite-primereel-display
        native: pl-demosite-primereel-native
        video: pl-demosite-primereel-video
        audio: pl-demosite-primereel-audio
    # Spotify-style audio-only app (DEMO SITE - SoundWave). Only an audio
    # placement wired; the `soundwave` site slug shows the audio-only layout.
    - slug: soundwave
      siteName: "DEMO SITE - SoundWave"
      publisherId: pub-demosite-soundwave
      placements:
        audio: pl-demosite-soundwave-audio
    # Twitch-style SSAI/live app (DEMO SITE - Twitchr). The SSAI break auction
    # runs a video auction against this placement; the `twitchr` site slug shows
    # the live stitched-stream player page.
    - slug: twitchr
      siteName: "DEMO SITE - Twitchr"
      publisherId: pub-demosite-twitchr
      placements:
        video: pl-demosite-twitchr-ssai
    # YouTube-style UGC video app (DEMO SITE - ViewTube). Client-side VAST: the
    # player fetches the VAST tag and inserts the pre-roll itself (contrast with
    # Twitchr's server-side SSAI). Video pre-roll + a display companion banner.
    - slug: viewtube
      siteName: "DEMO SITE - ViewTube"
      publisherId: pub-demosite-viewtube
      placements:
        video: pl-demosite-viewtube-video
        display: pl-demosite-viewtube-display
  urls:
    pubad: ""   # default https://pubad.<domain>
    sdk: ""     # default https://gateway.<domain>/static/adtech.js
    media: ""   # default https://gateway.<domain>
    ssai: ""    # default https://gateway.<domain>/v1/ssai (browser→gateway proxy→ssai)
  tls:
    crt: ""     # base64 PEM cert (wildcard *.adtech.local), filled by dev loop
    key: ""     # base64 PEM key

# External demo ADVERTISER shop (cmd/demoadv) — the EARNED-audience demo. Only
# rendered when global.demosites=true (same gate as the demo publisher sites, so
# one knob lights up the whole browsable demo world and `make hosts` /
# `make deploy-demosites` pick it up). Deployed into the SAME `demosites`
# namespace (another external third-party origin) at shop.<global.domain>.
# A shopper browses it → the /v1/t/rt behaviour pixel enrolls them into the
# retargeting segment in REAL TIME (audience-rt) → the retargeting campaign chases
# them with the Dynamic Product Ad → a purchase (/convert → signed /v1/t/conv)
# suppresses them. Points at a REAL seeded advertiser (Ford Motors =
# adv-barkbox) so pixel tags match real retargeting rules, and hands the BROWSER
# only PUBLIC ingress URLs (tracker/sdk), cross-origin, never in-cluster DNS —
# the HTTPS/mixed-content lesson: the pixels must be ingress-reachable over HTTPS.
# TLS cert is COPIED into the demosites namespace exactly like demosites.tls.*.
demostore:
  enabled: true              # subordinate to global.demosites; set false to skip the shop while keeping the publisher sites
  namespace: demosites       # share the demo-origins namespace (reuses the copied *.adtech.local cert secret)
  image: adtech-demoadv
  imagePullPolicy: IfNotPresent
  port: 9200
  slug: shop                 # ingress subdomain → shop.<global.domain>
  # The REAL seeded advertiser the retargeting audience + catalog belong to.
  # adv-barkbox = "Ford Motors" (cmd/seed seedThemedSegments +
  # seedProductCatalog): has the f150-interest/checkout retargeting segments, the
  # cart-retargeting chase campaign (li-dogfood-cart-rt), and the Ford product
  # catalog. The UUID is idgen.Derive("account","adv-barkbox"). An empty string
  # falls back to the demoadv default ("demo-advertiser"), which fires pixels but
  # matches NO real rule — defeating the earned-audience demo.
  accountId: "d824fb61-8ad8-53d8-ad80-275a3bfde7e6"
  brand: "Ford"
  product: "F-150"
  sku: "FORD-F150"           # a real catalog SKU → the DPA chase renders the viewed product
  price: "38000"             # matches the seeded catalog price (F-150 $38,000)
  # Browser-reachable PUBLIC ingress URLs (cross-origin fetch). Default to the
  # HTTPS gateway/tracker ingress hosts so there is no mixed-content block.
  urls:
    tracker: ""   # default https://tracker.<domain>  (the /v1/t/* public base)
    sdk: ""       # default https://gateway.<domain>/static/adtech-adv.js
  tls:
    crt: ""       # base64 PEM cert (wildcard *.adtech.local), filled by dev loop
    key: ""       # base64 PEM key

# Traefik ingress controller (own `traefik` namespace). Rendered verbatim from
# files/traefik-install.yaml (a copy of k8s/base/traefik/install.yaml) because
# it is itself pre-rendered helm output pinned by the repo.
traefik:
  enabled: true

# Migration job — helm pre-install/pre-upgrade hook. NOTE: there is no k8s
# migrate manifest today (Tilt runs `go run ./cmd/migrate` on the host), so
# this is chart-only. Build the image via build/Dockerfile with SERVICE=migrate.
migrate:
  enabled: true
  image: adtech-migrate
  env:
    - name: DATABASE_URL
      value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"

# ============================================================
# App services — one Deployment + Service (+ optional Ingress) each,
# rendered by templates/services.yaml. Fields:
#   image, containerName (defaults to key), replicas (default 1),
#   ports [{name, port}], env (verbatim list), resources,
#   livenessProbe/readinessProbe (default /healthz + /readyz on first port),
#   volumes/volumeMounts, ingress.hosts.
# ============================================================
# Localhost exposure (templates/localhost-lb.yaml) — replaces Tilt's
# port_forwards via klipper-lb LoadBalancer services. port = host port,
# targetPort = container port (defaults to port). Off in staging/prod.
localExpose:
  enabled: true
  services:
    postgres: { ports: [{ name: pg, port: 5432 }] }
    nats: { ports: [{ name: client, port: 4222 }, { name: monitor, port: 8222 }] }
    redis: { ports: [{ name: redis, port: 6379 }] }
    minio: { ports: [{ name: s3, port: 9000 }, { name: console, port: 9001 }] }
    pipeline: { ports: [{ name: http, port: 8087 }] }
    clickhouse: { ports: [{ name: native, port: 9010, targetPort: 9000 }, { name: http, port: 8123 }] }
    tigerbeetle: { ports: [{ name: tb, port: 3033, targetPort: 3000 }] }
    grafana: { ports: [{ name: http, port: 3000 }] }
    prometheus: { ports: [{ name: http, port: 9090 }] }
    loki: { ports: [{ name: http, port: 3100 }] }
    jaeger: { ports: [{ name: ui, port: 16686 }, { name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }] }
    mailpit: { ports: [{ name: smtp, port: 1025 }, { name: ui, port: 8025 }] }
    gateway: { ports: [{ name: http, port: 8080 }, { name: https, port: 8443 }] }
    exchange: { ports: [{ name: http, port: 8081 }] }
    dsp-internal: { ports: [{ name: http, port: 8082 }] }
    tracker: { ports: [{ name: http, port: 8083 }] }
    ssp: { ports: [{ name: http, port: 8084 }] }
    adserver: { ports: [{ name: http, port: 8085 }] }
    reporting: { ports: [{ name: http, port: 8086 }] }
    pipeline: { ports: [{ name: http, port: 8087 }] }
    publisher-adserver: { ports: [{ name: http, port: 8088 }] }
    dsp-competitor1: { ports: [{ name: http, port: 8089 }] }
    dsp-competitor2: { ports: [{ name: http, port: 8090 }] }
    dsp-competitor3: { ports: [{ name: http, port: 8098 }] }
    dsp-competitor4: { ports: [{ name: http, port: 8100 }] }
    webhooks: { ports: [{ name: http, port: 8091 }] }
    identity-consumer: { ports: [{ name: http, port: 8092 }] }
    ssai: { ports: [{ name: http, port: 8093 }] }
    transcoder: { ports: [{ name: http, port: 8094 }] }
    report-runner: { ports: [{ name: http, port: 8095 }] }
    notifications: { ports: [{ name: http, port: 8096 }] }
    audience-rt: { ports: [{ name: http, port: 8097 }] }

services:
  dsp-internal:
    image: adtech-dsp
    replicas: 3
    # Stateless bidder (budgets/pacing/freq-caps are atomic Redis ops, shared
    # across replicas) → CPU-autoscale safe. Competitors stay fixed (test fixtures).
    hpa: { minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    containerName: dsp
    ports: [{ name: http, port: 8082 }]
    grpcPort: 8182
    env:
      - name: POD_NAME
        value: "dsp-internal-0"
      - name: DSP_PROFILE
        value: "internal"
      - name: DSP_PORT
        value: "8082"
      # ads.cert: fetch + refresh the exchange's signing keyset so the DSP can
      # verify signed bid requests. Harmless until dsp.adcert_enforcement != off
      # (live). Prod-shaped default; also what makes the adcert e2e test possible.
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      # ads.cert enforcement: no-bid bid requests the exchange didn't Ed25519-sign
      # (forged/unsigned). Strict by default so local == prod; the exchange's
      # public key is fetched from DSP_ADCERT_KEY_URL above. Seeded per-pod from
      # this env at boot (pkg/config registry), so it survives restarts.
      - name: DSP_ADCERT_ENFORCEMENT
        value: "strict"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      requests: { cpu: 250m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8082 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8082 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp, dsp-int]

  dsp-competitor1:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8089 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor1-0"
      - name: DSP_PROFILE
        value: "competitor1"
      # SLOWPOKE scenario (see profiles/dsps/competitor1.yaml): jittered
      # ±25% around 500ms, straddling exchange.bid_timeout — most calls time
      # out, so the SmartRouter's timeout-rate skip engages after warm-up
      # every run. Live key: zero dsp.response_delay on this pod to watch
      # the ε-probe + recency window rehabilitate it in minutes.
      - name: DSP_RESPONSE_DELAY
        value: "500ms"
      - name: DSP_PORT
        value: "8089"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      # ads.cert enforcement: no-bid bid requests the exchange didn't Ed25519-sign
      # (forged/unsigned). Strict by default so local == prod; the exchange's
      # public key is fetched from DSP_ADCERT_KEY_URL above. Seeded per-pod from
      # this env at boot (pkg/config registry), so it survives restarts.
      - name: DSP_ADCERT_ENFORCEMENT
        value: "strict"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      # 100m: this is a SCENARIO DSP (slowpoke/deadbeat — see its profile
      # yaml). Its latency/no-bid behaviour is artificial, so CPU weight
      # doesn't shape the market; the competitive fan-out weight lives on
      # dsp-competitor3 (250m, same as a dsp-internal pod — the c840cf6
      # cpu.weight finding).
      requests: { cpu: 100m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8089 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8089 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp1]

  dsp-competitor2:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8090 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor2-0"
      - name: DSP_PROFILE
        value: "competitor2"
      - name: DSP_PORT
        value: "8090"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      # ads.cert enforcement: no-bid bid requests the exchange didn't Ed25519-sign
      # (forged/unsigned). Strict by default so local == prod; the exchange's
      # public key is fetched from DSP_ADCERT_KEY_URL above. Seeded per-pod from
      # this env at boot (pkg/config registry), so it survives restarts.
      - name: DSP_ADCERT_ENFORCEMENT
        value: "strict"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      # 100m: this is a SCENARIO DSP (slowpoke/deadbeat — see its profile
      # yaml). Its latency/no-bid behaviour is artificial, so CPU weight
      # doesn't shape the market; the competitive fan-out weight lives on
      # dsp-competitor3 (250m, same as a dsp-internal pod — the c840cf6
      # cpu.weight finding).
      requests: { cpu: 100m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8090 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8090 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp2]

  # The HEALTHY scenario competitor (see profiles/dsps/competitor3.yaml):
  # fast, bids 92% of the time — the market maker the SmartRouter keeps in
  # every fan-out while it skips the slowpoke (comp1) and deadbeat (comp2).
  dsp-competitor3:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8098 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor3-0"
      - name: DSP_PROFILE
        value: "competitor3"
      - name: DSP_PORT
        value: "8098"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      - name: DSP_ADCERT_ENFORCEMENT
        value: "strict"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      # Full competitive weight (the c840cf6 cpu.weight finding): this pod
      # absorbs the whole fan-out rate single-replica, like dsp-internal
      # pods do at 250m each.
      requests: { cpu: 250m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8098 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8098 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp3]

  # COINFLIP scenario (see profiles/dsps/competitor4.yaml): fast, bids ~50%
  # — mediocre but far above the skip line; must ALWAYS stay in the fan-out.
  dsp-competitor4:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8100 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor4-0"
      - name: DSP_PROFILE
        value: "competitor4"
      - name: DSP_PORT
        value: "8100"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      - name: DSP_ADCERT_ENFORCEMENT
        value: "strict"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      # Full fan-out rate lands on this single replica (like competitor3).
      requests: { cpu: 250m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8100 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8100 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp4]

  ssp:
    image: adtech-ssp
    replicas: 3
    hpa: { minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    ports: [{ name: http, port: 8084 }]
    env:
      - name: REDIS_URL
        value: "redis:6379"
      - name: POD_NAME
        value: "ssp-0"
      # grpc:// scheme = internal gRPC twin (pkg/grpcx), dialled via the
      # headless -grpc service so RPCs round-robin across replicas. Flip
      # back to http://exchange:8081 / http://adserver:8085 to roll back —
      # it's a config value, not a deploy.
      - name: SSP_EXCHANGE_URL
        value: "grpc://exchange-grpc:8181"
      - name: SSP_ADSERVER_URL
        value: "grpc://adserver-grpc:8185"
      # Supply chain (schain): the SSP originates the first SupplyChain node on
      # every outbound bid request (asi=seller_domain). ssp.seller_domain is a
      # STATIC-tier key (env-only), so setting it here is durable. Required for
      # the exchange's schain_enforcement=strict to have something to validate.
      - name: SSP_SELLER_DOMAIN
        value: "adtech.local"
      - name: SSP_SELLER_ID
        value: "adtech-ssp"
      # Build the identity graph from serves: publish per-request identity signals
      # (publisher_user_id, uid2, hashed_email, ifa, IP+UA) to the
      # identity-consumer. STATIC-tier (env-only) so set here durably. Required for
      # cross-site / cross-device identity — the publisher half of the bridge
      # view-through attribution resolves across.
      - name: SSP_IDENTITY_OBSERVE_ENABLED
        value: "true"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      requests: { cpu: 250m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8084 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8084 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [ssp]

  exchange:
    image: adtech-exchange
    replicas: 3
    # Auctions are request-scoped; the smart router learns in-memory per replica
    # (warm-started from analytics, converges independently) — scale safe.
    hpa: { minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    ports: [{ name: http, port: 8081 }]
    grpcPort: 8181
    env:
      - name: POD_NAME
        value: "exchange-0"
      # Our own DSP rides the internal gRPC twin; the competitor DSPs stay
      # OpenRTB HTTP deliberately — they stand in for third-party demand,
      # so the industry-standard path is exercised in every auction.
      # ;notify= declares the HTTP base for win/loss notices (OpenRTB
      # nurl/lurl stay HTTP by design) — required whenever the bid edge
      # is grpc://, or notices are undeliverable and budget caps break.
      - name: EXCHANGE_DSP_ENDPOINTS
        value: "grpc://dsp-internal-grpc:8182;notify=http://dsp-internal:8082,http://dsp-competitor1:8089,http://dsp-competitor2:8090,http://dsp-competitor3:8098,http://dsp-competitor4:8100"
      - name: EXCHANGE_ADSERVER_URL
        value: "http://adserver:8085"
      # Routing warm-start + cross-replica reseed source. Without this the
      # key defaults to localhost:8086 and both silently no-op in-cluster.
      - name: EXCHANGE_REPORTING_URL
        value: "http://reporting:8086"
      # Anti-spoof enforcement (prod-shaped default; local == prod). All TierLive
      # keys are seeded per-pod from these env values at boot (pkg/config
      # registry), so enforcement SURVIVES pod restarts instead of reverting to
      # the off/warn code default.
      #   ads.txt : no-bid sellers whose ads.txt doesn't authorise us.
      #   schain  : no-bid requests with a missing/malformed SupplyChain.
      # The seller identity below is the ads.txt line publishers must list
      # (adtech.local, adtech-exchange, DIRECT). cmd/seed authorises every seeded
      # publisher; the e2e harness authorises each world it builds.
      - name: EXCHANGE_ADSTXT_ENFORCEMENT
        value: "strict"
      - name: EXCHANGE_SCHAIN_ENFORCEMENT
        value: "strict"
      - name: EXCHANGE_ADSTXT_SELLER_DOMAIN
        value: "adtech.local"
      - name: EXCHANGE_ADSTXT_SELLER_ID
        value: "adtech-exchange"
      # ads.cert Ed25519 signing key (fallback to the secrets-store key if one is
      # provisioned). Local dev key — staging/prod override via SOPS secret.
      - name: EXCHANGE_ADCERT_SIGN_KEY
        value: "2NJwLroe2MI9bzeybevvfM6gW6PJXKyeG74694z0T9dtZw48XO2f03TC-Hx_NzaiGF0QqCb_QLh8WP49pdKHcA"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
      - name: EVENT_SPOOL_DIR
        value: "/var/spool/adtech-events"
    volumes:
      - name: event-spool
        emptyDir: { sizeLimit: 512Mi }
    volumeMounts:
      - name: event-spool
        mountPath: /var/spool/adtech-events
    resources:
      requests: { cpu: 400m, memory: 96Mi }
      limits: { cpu: 3000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8081 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8081 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [exchange]

  adserver:
    image: adtech-adserver
    replicas: 3
    hpa: { minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    ports: [{ name: http, port: 8085 }]
    grpcPort: 8185
    env:
      - name: POD_NAME
        value: "adserver-0"
      - name: ADSERVER_TRACKER_URL
        value: "http://localhost:8080"
      # Bandit warm-start source (ADR 0003 part C). Without this the key
