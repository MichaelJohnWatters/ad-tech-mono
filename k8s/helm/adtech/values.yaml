      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
    resources:
      requests: { cpu: 150m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8080 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8080 }
      periodSeconds: 2
      failureThreshold: 5
