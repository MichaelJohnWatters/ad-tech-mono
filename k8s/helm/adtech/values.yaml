      - name: GATEWAY_SSAI_URL
        value: "http://ssai:8093"
      - name: GATEWAY_JAEGER_URL
        value: "http://jaeger:16686"
      - name: GATEWAY_CREATIVES_STORE_URL
        value: "http://minio:9000/adtech-creatives/"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      # Owner/superuser URL for the dev-only reset-and-reseed endpoint (TRUNCATE
      # + cross-tenant seed) the least-privilege adtech_app role cannot do under
      # RLS (security #77). Prod: unset / same as the migrate owner URL.
      - name: DATABASE_ADMIN_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
