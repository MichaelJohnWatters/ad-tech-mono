      failureThreshold: 5
    ingress:
      subdomains: [pubad]

  tracker:
    image: adtech-tracker
    replicas: 3
    # Highest-volume, internet-facing. Min 3: a single-replica tracker
    # readiness-flapped under load (the old ~1% impression slippage), so never
    # scale below 3. Higher ceiling than the rest.
    hpa: { minReplicas: 3, maxReplicas: 8, targetCPU: 70 }
    ports: [{ name: http, port: 8083 }]
    env:
      - name: TRACKER_SIGNATURE_VALIDATION
        value: "true"
      # Prod-shaped per-advertiser conversion posture (G7): a conversion billed
      # to an advertiser validates ONLY against that advertiser's own key, so the
      # shared platform key can't forge another advertiser's CPA. Seeded keys
      # (SeedAdvertiserConversionKeys) + DevConversionKey signing keep local
      # traffic working under it.
      - name: TRACKER_CONVERSION_STRICT_ADVERTISER_KEY
        value: "true"
      - name: POD_NAME
        value: "tracker-0"
      - name: TRACKER_NATS_URL
        value: "nats://nats:4222"
      - name: TRACKER_REPORTING_URL
        value: "http://reporting:8086"
      - name: REDIS_URL
        value: "redis:6379"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # Explicit here (tracker already defaults 0.1 in code) so the request-
      # LOG sampler (pkg/logger, follows OTEL_SAMPLE_RATIO) covers the beacon
      # firehose too — highest log volume in the fleet.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
      - name: EVENT_SPOOL_DIR
        value: "/var/spool/adtech-events"
    volumes:
      - name: event-spool
        emptyDir: { sizeLimit: 512Mi }
    volumeMounts:
      - name: event-spool
        mountPath: /var/spool/adtech-events
    resources:
      requests: { cpu: 150m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8083 }
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8083 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [tracker]

  gateway:
    image: adtech-gateway
    replicas: 3
    hpa: { minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    # Named service account (gateway-rbac.yaml) so the staff ops console can
