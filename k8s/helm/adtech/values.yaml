# Default values == the LOCAL dev environment. Staging/prod override via
# values-staging.yaml / values-prod.yaml.
#
# Provenance: derived from k8s/base + the Tiltfile's k8s_yaml set, with
# field-level parity proven at the cutover (scripts/helm-parity.sh, 91/91).
# The chart is now the SOURCE OF TRUTH and has deliberately diverged since
# (localExpose LB services, postgres max_connections, migrate hook);
# k8s/base is frozen history.

namespace: adtech
createNamespace: true

# ONE knob for the ingress domain. Every browser-facing host derives from it
# (services set ingress.subdomains / ingress.apex). Local = adtech.local (matches
# the mkcert wildcard + /etc/hosts). Prod overlays set global.domain to the real
# registered domain and every ingress host + cert follows automatically.
global:
  domain: adtech.local

# TLS for the browser-facing ingresses (gateway/adserver/tracker/ssp/pubad).
# Same Ingress wiring in every env (templates/services.yaml terminates at
# Traefik's websecure/443 entrypoint); only the cert SOURCE differs:
#   local → a pre-created mkcert secret (`adtech-tls`, made by `make stack-up`
#           from dev/tls/*.pem; wildcard *.adtech.local, trusted by the mkcert
#           local CA). No cert-manager needed locally.
#   prod  → set tls.certManager.clusterIssuer (see values-prod.yaml) and
#           cert-manager issues a real Let's Encrypt cert per ingress.
# Reach it on the host at https://<host>.adtech.local (Traefik LB is bound on
# localhost:443). Add the hostnames to /etc/hosts pointing at 127.0.0.1, e.g.:
#   127.0.0.1 gateway.adtech.local adserver.adtech.local tracker.adtech.local ssp.adtech.local pubad.adtech.local
tls:
  enabled: true
  secretName: adtech-tls

# Traefik ingress controller (own `traefik` namespace). Rendered verbatim from
# files/traefik-install.yaml (a copy of k8s/base/traefik/install.yaml) because
# it is itself pre-rendered helm output pinned by the repo.
traefik:
  enabled: true

# Migration job — helm pre-install/pre-upgrade hook. NOTE: there is no k8s
# migrate manifest today (Tilt runs `go run ./cmd/migrate` on the host), so
# this is chart-only. Build the image via build/Dockerfile with SERVICE=migrate.
migrate:
  enabled: true
  image: adtech-migrate
  env:
    - name: DATABASE_URL
      value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"

# ============================================================
# App services — one Deployment + Service (+ optional Ingress) each,
# rendered by templates/services.yaml. Fields:
#   image, containerName (defaults to key), replicas (default 1),
#   ports [{name, port}], env (verbatim list), resources,
#   livenessProbe/readinessProbe (default /healthz + /readyz on first port),
#   volumes/volumeMounts, ingress.hosts.
# ============================================================
# Localhost exposure (templates/localhost-lb.yaml) — replaces Tilt's
# port_forwards via klipper-lb LoadBalancer services. port = host port,
# targetPort = container port (defaults to port). Off in staging/prod.
localExpose:
  enabled: true
  services:
    postgres: { ports: [{ name: pg, port: 5432 }] }
    nats: { ports: [{ name: client, port: 4222 }, { name: monitor, port: 8222 }] }
    redis: { ports: [{ name: redis, port: 6379 }] }
    minio: { ports: [{ name: s3, port: 9000 }, { name: console, port: 9001 }] }
    clickhouse: { ports: [{ name: native, port: 9010, targetPort: 9000 }, { name: http, port: 8123 }] }
    tigerbeetle: { ports: [{ name: tb, port: 3033, targetPort: 3000 }] }
    grafana: { ports: [{ name: http, port: 3000 }] }
    prometheus: { ports: [{ name: http, port: 9090 }] }
    loki: { ports: [{ name: http, port: 3100 }] }
    jaeger: { ports: [{ name: ui, port: 16686 }, { name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }] }
    mailpit: { ports: [{ name: smtp, port: 1025 }, { name: ui, port: 8025 }] }
    gateway: { ports: [{ name: http, port: 8080 }, { name: https, port: 8443 }] }
    exchange: { ports: [{ name: http, port: 8081 }] }
    dsp-internal: { ports: [{ name: http, port: 8082 }] }
    tracker: { ports: [{ name: http, port: 8083 }] }
    ssp: { ports: [{ name: http, port: 8084 }] }
    adserver: { ports: [{ name: http, port: 8085 }] }
    reporting: { ports: [{ name: http, port: 8086 }] }
    pipeline: { ports: [{ name: http, port: 8087 }] }
    publisher-adserver: { ports: [{ name: http, port: 8088 }] }
    dsp-competitor1: { ports: [{ name: http, port: 8089 }] }
    dsp-competitor2: { ports: [{ name: http, port: 8090 }] }
    webhooks: { ports: [{ name: http, port: 8091 }] }
    identity-consumer: { ports: [{ name: http, port: 8092 }] }
    ssai: { ports: [{ name: http, port: 8093 }] }
    transcoder: { ports: [{ name: http, port: 8094 }] }
    report-runner: { ports: [{ name: http, port: 8095 }] }
    notifications: { ports: [{ name: http, port: 8096 }] }

services:
  dsp-internal:
    image: adtech-dsp
    replicas: 3
    containerName: dsp
    ports: [{ name: http, port: 8082 }]
    grpcPort: 8182
    env:
      - name: POD_NAME
        value: "dsp-internal-0"
      - name: DSP_PROFILE
        value: "internal"
      - name: DSP_PORT
        value: "8082"
      # ads.cert: fetch + refresh the exchange's signing keyset so the DSP can
      # verify signed bid requests. Harmless until dsp.adcert_enforcement != off
      # (live). Prod-shaped default; also what makes the adcert e2e test possible.
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8082 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8082 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp, dsp-int]

  dsp-competitor1:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8089 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor1-0"
      - name: DSP_PROFILE
        value: "competitor1"
      - name: DSP_PORT
        value: "8089"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8089 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8089 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp1]

  dsp-competitor2:
    image: adtech-dsp
    containerName: dsp
    ports: [{ name: http, port: 8090 }]
    env:
      - name: POD_NAME
        value: "dsp-competitor2-0"
      - name: DSP_PROFILE
        value: "competitor2"
      - name: DSP_PORT
        value: "8090"
      - name: DSP_ADCERT_KEY_URL
        value: "http://exchange:8081/v1/adcert/key"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8090 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8090 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [dsp-comp2]

  ssp:
    image: adtech-ssp
    replicas: 3
    ports: [{ name: http, port: 8084 }]
    env:
      - name: REDIS_URL
        value: "redis:6379"
      - name: POD_NAME
        value: "ssp-0"
      # grpc:// scheme = internal gRPC twin (pkg/grpcx), dialled via the
      # headless -grpc service so RPCs round-robin across replicas. Flip
      # back to http://exchange:8081 / http://adserver:8085 to roll back —
      # it's a config value, not a deploy.
      - name: SSP_EXCHANGE_URL
        value: "grpc://exchange-grpc:8181"
      - name: SSP_ADSERVER_URL
        value: "grpc://adserver-grpc:8185"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8084 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8084 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [ssp]

  exchange:
    image: adtech-exchange
    replicas: 3
    ports: [{ name: http, port: 8081 }]
    grpcPort: 8181
    env:
      - name: POD_NAME
        value: "exchange-0"
      # Our own DSP rides the internal gRPC twin; the competitor DSPs stay
      # OpenRTB HTTP deliberately — they stand in for third-party demand,
      # so the industry-standard path is exercised in every auction.
      # ;notify= declares the HTTP base for win/loss notices (OpenRTB
      # nurl/lurl stay HTTP by design) — required whenever the bid edge
      # is grpc://, or notices are undeliverable and budget caps break.
      - name: EXCHANGE_DSP_ENDPOINTS
        value: "grpc://dsp-internal-grpc:8182;notify=http://dsp-internal:8082,http://dsp-competitor1:8089,http://dsp-competitor2:8090"
      - name: EXCHANGE_ADSERVER_URL
        value: "http://adserver:8085"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 100m, memory: 96Mi }
      limits: { cpu: 3000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8081 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8081 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [exchange]

  adserver:
    image: adtech-adserver
    replicas: 3
    ports: [{ name: http, port: 8085 }]
    grpcPort: 8185
    env:
      - name: POD_NAME
        value: "adserver-0"
      - name: ADSERVER_TRACKER_URL
        value: "http://localhost:8080"
      - name: REDIS_URL
        value: "redis:6379"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      - name: S3_ENDPOINT
        value: "http://minio:9000"
      - name: S3_BUCKET
        value: "adtech-creatives"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8085 }
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8085 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [adserver]

  publisher-adserver:
    image: adtech-publisher-adserver
    replicas: 3
    ports: [{ name: http, port: 8088 }]
    env:
      - name: POD_NAME
        value: "publisher-adserver-0"
      - name: PUBLISHER_ADSERVER_SSP_URL
        value: "http://ssp:8084"
      - name: PUBLISHER_ADSERVER_ADSERVER_URL
        value: "http://adserver:8085"
      - name: PUBLISHER_ADSERVER_TRACKER_URL
        value: "http://localhost:8080"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8088 }
      initialDelaySeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8088 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [pubad]

  tracker:
    image: adtech-tracker
    replicas: 3
    ports: [{ name: http, port: 8083 }]
    env:
      - name: TRACKER_SIGNATURE_VALIDATION
        value: "true"
      - name: POD_NAME
        value: "tracker-0"
      - name: TRACKER_NATS_URL
        value: "nats://nats:4222"
      - name: TRACKER_REPORTING_URL
        value: "http://reporting:8086"
      - name: REDIS_URL
        value: "redis:6379"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 2000m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8083 }
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8083 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    ingress:
      subdomains: [tracker]

  gateway:
    image: adtech-gateway
    replicas: 3
    # Named service account (gateway-rbac.yaml) so the staff ops console can
    # list pods / restart deployments / trigger cronjobs in-namespace.
    serviceAccountName: gateway
    ports:
      - { name: http, port: 8080 }
      - { name: https, port: 8443 }
    volumeMounts:
      - { name: tls, mountPath: /tls, readOnly: true }
    volumes:
      - name: tls
        secret:
          secretName: gateway-tls
          optional: true
    env:
      - name: TLS_CERT_FILE
        value: "/tls/cert.pem"
      - name: TLS_KEY_FILE
        value: "/tls/key.pem"
      - name: POD_NAME
        value: "gateway-0"
      - name: PLATFORM_ROOT_PASSWORD
        value: "dev-root-password"
      - name: GATEWAY_DSP_URL
        value: "http://dsp-internal:8082"
      - name: GATEWAY_SSP_URL
        value: "http://ssp:8084"
      # ADR 0008: audience-ingest completion emails (inline uploads) via Mailpit.
      - name: GATEWAY_SMTP_HOST
        value: "mailpit:1025"
      - name: GATEWAY_EXCHANGE_URL
        value: "http://exchange:8081"
      - name: GATEWAY_TRACKER_URL
        value: "http://tracker:8083"
      - name: GATEWAY_REPORTING_URL
        value: "http://reporting:8086"
      - name: GATEWAY_PIPELINE_URL
        value: "http://pipeline:8087"
      - name: GATEWAY_ADSERVER_URL
        value: "http://adserver:8085"
      - name: GATEWAY_PUBLISHER_ADSERVER_URL
        value: "http://publisher-adserver:8088"
      - name: GATEWAY_SSAI_URL
        value: "http://ssai:8093"
      - name: GATEWAY_JAEGER_URL
        value: "http://jaeger:16686"
      - name: GATEWAY_CREATIVES_STORE_URL
        value: "http://minio:9000/adtech-creatives/"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: REDIS_URL
        value: "redis:6379"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8080 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8080 }
      periodSeconds: 2
      failureThreshold: 5
    ingress:
      subdomains: [gateway]
      apex: true

  pipeline:
    image: adtech-pipeline
    ports: [{ name: http, port: 8087 }]
    env:
      - name: POD_NAME
        value: "pipeline-0"
      - name: PIPELINE_NATS_URL
        value: "nats://nats:4222"
      # ADR 0008: audience-ingest completion emails (async worker) via Mailpit.
      - name: PIPELINE_SMTP_HOST
        value: "mailpit:1025"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_SSL
        value: "false"
      - name: PIPELINE_DATALAKE_BUCKET
        value: "adtech-datalake-hotcold"
      - name: PIPELINE_DATALAKE_FLUSH_INTERVAL
        value: "10s"
      - name: PIPELINE_ONBOARDING_POLL_INTERVAL
        value: "10s"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 1Gi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8087 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8087 }
      periodSeconds: 2
      failureThreshold: 3

  webhooks:
    image: adtech-webhooks
    replicas: 3
    ports: [{ name: http, port: 8091 }]
    env:
      - name: POD_NAME
        value: "webhooks-0"
      - name: WEBHOOKS_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8091 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8091 }
      periodSeconds: 2
      failureThreshold: 3

  identity-consumer:
    image: adtech-identity-consumer
    replicas: 3
    ports: [{ name: http, port: 8092 }]
    env:
      - name: IDENTITY_CONSUMER_REDIS_URL
        value: "redis:6379"
      - name: POD_NAME
        value: "identity-consumer-0"
      - name: IDENTITY_CONSUMER_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8092 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8092 }
      periodSeconds: 2
      failureThreshold: 3

  report-runner:
    image: adtech-report-runner
    replicas: 3
    ports: [{ name: http, port: 8095 }]
    env:
      - name: POD_NAME
        value: "report-runner-0"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: REPORT_RUNNER_REPORTING_URL
        value: "http://reporting:8086"
      - name: REPORT_RUNNER_NATS_URL
        value: "nats://nats:4222"
      - name: REPORT_RUNNER_SMTP_HOST
        value: "mailpit:1025"
      - name: REPORT_RUNNER_PUBLIC_GATEWAY_URL
        value: "http://localhost:8080"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8095 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8095 }
      periodSeconds: 2
      failureThreshold: 3

  # In-app notification builder: consumes account-scoped business events from
  # NATS and writes per-account rows for the portal bell. Single replica — the
  # consumer is queue-grouped so extra replicas would only load-balance, and one
  # is plenty for this write volume.
  notifications:
    image: adtech-notifications
    replicas: 1
    ports: [{ name: http, port: 8096 }]
    env:
      - name: POD_NAME
        value: "notifications-0"
      - name: NOTIFICATIONS_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8096 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8096 }
      periodSeconds: 2
      failureThreshold: 3

  ssai:
    image: adtech-ssai
    replicas: 3
    ports: [{ name: http, port: 8093 }]
    env:
      - name: POD_NAME
        value: "ssai-0"
      - name: SSAI_SSP_URL
        value: "http://ssp:8084"
      - name: SSAI_TRACKER_URL
        value: "http://tracker:8083"
      - name: SSAI_PUBLIC_URL
        value: "http://localhost:8080"
      - name: SSAI_TRANSCODER_URL
        value: "http://transcoder:8094"
      - name: S3_ENDPOINT
        value: "http://minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 500m, memory: 128Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8093 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8093 }
      periodSeconds: 2
      failureThreshold: 5

  transcoder:
    image: adtech-transcoder
    ports: [{ name: http, port: 8094 }]
    env:
      - name: POD_NAME
        value: "transcoder-0"
      - name: S3_ENDPOINT
        value: "http://minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: TRANSCODER_BUCKET
        value: "adtech-creatives"
      - name: TRANSCODER_PUBLIC_BASE
        value: "http://localhost:8080/v1/creatives"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 200m, memory: 128Mi }
      limits: { cpu: "2", memory: 1Gi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8094 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8094 }
      periodSeconds: 5
      failureThreshold: 5

  reporting:
    image: adtech-reporting
    replicas: 3
    ports: [{ name: http, port: 8086 }]
    env:
      - name: POD_NAME
        valueFrom: { fieldRef: { fieldPath: metadata.name } }
      - name: REPORTING_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      - name: REDIS_URL
        value: "redis:6379"
      - name: REPORTING_ANALYTICS_BACKEND
        value: "clickhouse"
      - name: REPORTING_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: REPORTING_CLICKHOUSE_BATCH_CONSUMER
        value: "true"
      - name: REPORTING_SHARED_PACING_COUNTER
        value: "true"
      - name: REPORTING_ROLLUP_ENABLED
        value: "true"
      - name: REPORTING_COLD_STORE_ENABLED
        value: "true"
      - name: REPORTING_HOT_WINDOW
        # How far back ClickHouse (the HOT store) is authoritative; older
        # reads fall to the keep-forever Delta lake and are merged. NOT a
        # data cap — a 30d query returns 30d (hot slice + cold history).
        # 14d: the portal dashboards query 'today' + 'last 7d', so a 14d
        # hot window keeps ALL of them wholly on the fast hot tier with a
        # week of margin (a 7d window put them exactly on the boundary,
        # risking a slower hot+cold split). TTL (30d) still leaves 16d of
        # slack before ClickHouse deletes.
        value: "336h"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_SSL
        value: "false"
      - name: PIPELINE_DATALAKE_BUCKET
        value: "adtech-datalake-hotcold"
      - name: BILLING_LEDGER_BACKEND
        value: "tigerbeetle"
      - name: BILLING_TIGERBEETLE_ADDRESSES
        value: "tigerbeetle:3000"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 2000m, memory: 768Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8086 }
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8086 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    # No ingress: k8s/base/reporting/ingress.yaml exists but the Tiltfile
    # never applies it, so the deployed local stack has none. Add
    # `ingress: {hosts: [reporting.adtech.local]}` to restore it.

# ============================================================
# Infrastructure
# ============================================================
infra:
  postgres:
    image: postgres:16-alpine
    replicas: 1
    storage: 20Gi
    # Dev credentials, plaintext — same mechanism as the kustomize base
    # (k8s/base/postgres/statefulset.yaml ships this Secret with the same
    # values). Staging/prod must supply real secrets out-of-band (SOPS).
    credentials:
      username: adtech
      password: adtech-local-dev
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { cpu: "2000m", memory: "4Gi" }

  nats:
    image: nats:2.10-alpine
    # Local runs a SINGLE standalone JetStream node (see
    # k8s/overlays/local/nats-single.yaml for the raft-on-one-host rationale).
    # Staging/prod flip cluster.enabled=true + replicas=3 (the base topology).
    replicas: 1
    cluster:
      enabled: false
      name: adtech-nats
      connectRetries: 30
    jetstream:
      maxMem: 256MB
      maxFile: 4GB
    storage: 5Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }

  redis:
    image: redis:7-alpine
    maxmemory: 1gb
    maxmemoryPolicy: allkeys-lru
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  minio:
    # Pinned by digest — see k8s/base/minio/deployment.yaml for rationale.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    rootUser: adtech
    rootPassword: adtech-local-dev
    storage: 20Gi
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.43
    replicas: 1
    cacheGrid: 256MiB
    storage: 1Gi
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "4Gi" }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    db: adtech
    user: adtech
    password: adtech-local-dev
    storage: 10Gi
    resources:
      requests: { cpu: "200m", memory: "512Mi" }
      limits: { cpu: "1", memory: "2Gi" }

  registryMirror:
    # Docker Hub pull-through cache at NodePort 30500 — local-only concern.
    enabled: true
    image: registry:2
    remoteURL: https://registry-1.docker.io
    storage: 20Gi
    nodePort: 30500
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  mailpit:
    enabled: true
    image: axllent/mailpit:v1.20
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "128Mi" }

# ============================================================
# Observability
# ============================================================
observability:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.53.0
    retention: 7d
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }

  grafana:
    enabled: true
    image: grafana/grafana:11.6.0
    adminUser: admin
    adminPassword: admin
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  loki:
    enabled: true
    image: grafana/loki:3.1.0
    # Sized for the REAL log firehose: once promtail actually shipped
    # (2026-07-18 fix), a 200rps load run CPU-throttled the 500m limit until
    # the internal ingester failed healthchecks and the pod flapped.
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits: { cpu: "1500m", memory: "1Gi" }

  promtail:
    enabled: true
    image: grafana/promtail:3.1.0
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }

  jaeger:
    enabled: true
    image: jaegertracing/all-in-one:1.58
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      # See k8s/base/jaeger/deployment.yaml for the 1536Mi rationale.
      limits: { cpu: "500m", memory: "1536Mi" }

# ============================================================
# CronJobs (schedules verbatim from k8s/cronjobs/*)
# ============================================================
cronjobs:
  batch-conductor:
    image: adtech-batch-conductor
    schedule: "10 * * * *"
    component: data-chain
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 1
    activeDeadlineSeconds: 1800
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "batch-conductor"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: BATCH_CONDUCTOR_NATS_URL
        value: "nats://nats:4222"
      - name: BATCH_CONDUCTOR_PIPELINE_URL
        value: "http://pipeline:8087"
      - name: BATCH_CONDUCTOR_REPORTING_URL
        value: "http://reporting:8086"
      - name: BATCH_CONDUCTOR_DATALAKE_BUCKET
        value: "adtech-datalake-hotcold"
      - name: REPORTING_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      # ADR 0006 phase 2: profile-builder step reads behaviour/profile signals
      # from ClickHouse (server-side GROUP BY) instead of Arrow-reading the lake
      # (the OOM fix). Empty/unreachable addr → silent fallback to lake reads, so
      # this MUST point at the in-cluster ClickHouse, not the localhost default.
      - name: BATCH_CONDUCTOR_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: PRIVACY_DELETE_PIPELINE_URL
        value: "http://pipeline:8087"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_SSL
        value: "false"
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "1", memory: "512Mi" }

  dayboundary:
    image: adtech-dayboundary
    schedule: "5 0 * * *"
    component: lifecycle
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 600
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "dayboundary"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }

  # invoice-runner bills the calendar month that just closed: sums billed
  # committed spend per campaign into one invoice + per-campaign line items per
  # advertiser account. Idempotent (keyed on account + period), so a re-run is
  # safe. 02:00 on the 1st gives the day-boundary/rollup chain time to settle
  # the final day of the month before it's billed.
  invoice-runner:
    image: adtech-invoice-runner
    schedule: "0 2 1 * *"
    component: billing
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 600
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "invoice-runner"
      - name: DATABASE_URL
        value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
