      - name: PLATFORM_ROOT_PASSWORD
        value: "dev-root-password"
      - name: GATEWAY_DSP_URL
        value: "http://dsp-internal:8082"
      - name: GATEWAY_SSP_URL
        value: "http://ssp:8084"
      # ADR 0008: audience-ingest completion emails (inline uploads) via Mailpit.
      - name: GATEWAY_SMTP_HOST
        value: "mailpit:1025"
      - name: GATEWAY_EXCHANGE_URL
        value: "http://exchange:8081"
      - name: GATEWAY_TRACKER_URL
