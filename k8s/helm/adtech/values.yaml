  # In-app notification builder: consumes account-scoped business events from
  # NATS and writes per-account rows for the portal bell. Single replica — the
  # consumer is queue-grouped so extra replicas would only load-balance, and one
  # is plenty for this write volume.
  notifications:
    image: adtech-notifications
    replicas: 1
    ports: [{ name: http, port: 8096 }]
    env:
      - name: POD_NAME
        value: "notifications-0"
      - name: NOTIFICATIONS_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8096 }
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet: { path: /readyz, port: 8096 }
      periodSeconds: 2
      failureThreshold: 3

  ssai:
    image: adtech-ssai
    replicas: 3
    hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70 }
    ports: [{ name: http, port: 8093 }]
    env:
      - name: POD_NAME
        value: "ssai-0"
      - name: SSAI_SSP_URL
        value: "http://ssp:8084"
      - name: SSAI_TRACKER_URL
        value: "http://tracker:8083"
      - name: SSAI_PUBLIC_URL
        value: "http://localhost:8080"
      - name: SSAI_TRANSCODER_URL
        value: "http://transcoder:8094"
      # Ad server the stitcher RECORDs the freq cap against on stitch (video
      # impressions count at stitch time, not at the SSP serve decision which only
      # PEEKs). HTTP — cross-service, not the internal gRPC twin.
      - name: SSAI_ADSERVER_URL
        value: "http://adserver:8085"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 500m, memory: 128Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8093 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8093 }
      periodSeconds: 2
      failureThreshold: 5

  transcoder:
    image: adtech-transcoder
    ports: [{ name: http, port: 8094 }]
    env:
      - name: POD_NAME
        value: "transcoder-0"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: TRANSCODER_BUCKET
        value: "adtech-creatives"
      - name: TRANSCODER_PUBLIC_BASE
        value: "http://localhost:8080/v1/creatives"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "2", memory: 1Gi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8094 }
      initialDelaySeconds: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8094 }
      periodSeconds: 5
      failureThreshold: 5

  reporting:
    image: adtech-reporting
    replicas: 3
    # Exempt from global.hardenedContainers: the tigerbeetle-go CGO ledger client
    # SIGSEGVs under runAsNonRoot + drop-ALL-caps + seccomp. Runs as root, no
    # securityContext (its baseline). Revisit with a tuned seccomp profile.
    hardenedExempt: true
    ports: [{ name: http, port: 8086 }]
    env:
      - name: POD_NAME
        valueFrom: { fieldRef: { fieldPath: metadata.name } }
      - name: REPORTING_NATS_URL
        value: "nats://nats:4222"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
      - name: OTEL_ENDPOINT
        value: "jaeger:4318"
      # 0.1: high-QPS fleet exports every span at 1.0 — real CPU+network on
      # the serving path. TraceIDRatioBased is deterministic per trace ID, so
      # the SAME 10% of auctions stay fully traced end-to-end (Loki pivots
      # work for those). Set 1.0 when deep-debugging a specific flow.
      - name: OTEL_SAMPLE_RATIO
        value: "0.1"
      - name: REDIS_URL
        value: "redis:6379"
      - name: REPORTING_ANALYTICS_BACKEND
        value: "clickhouse"
      - name: REPORTING_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: REPORTING_CLICKHOUSE_BATCH_CONSUMER
        value: "true"
      - name: REPORTING_SHARED_PACING_COUNTER
        value: "true"
      - name: REPORTING_ROLLUP_ENABLED
        value: "true"
      - name: REPORTING_COLD_STORE_ENABLED
        value: "true"
      - name: REPORTING_HOT_WINDOW
        # How far back ClickHouse (the HOT store) is authoritative; older
        # reads fall to the keep-forever Delta lake and are merged. NOT a
        # data cap — a 30d query returns 30d (hot slice + cold history).
        # 14d: the portal dashboards query 'today' + 'last 7d', so a 14d
        # hot window keeps ALL of them wholly on the fast hot tier with a
        # week of margin (a 7d window put them exactly on the boundary,
        # risking a slower hot+cold split). TTL (30d) still leaves 16d of
        # slack before ClickHouse deletes.
        value: "336h"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_SSL
        value: "false"
      - name: PIPELINE_DATALAKE_BUCKET
        value: "adtech-datalake-hotcold"
      - name: BILLING_LEDGER_BACKEND
        value: "tigerbeetle"
      - name: BILLING_TIGERBEETLE_ADDRESSES
        value: "tigerbeetle:3000"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 2000m, memory: 768Mi }
    livenessProbe:
      httpGet: { path: /healthz, port: 8086 }
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: /readyz, port: 8086 }
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 5
    # No ingress: k8s/base/reporting/ingress.yaml exists but the Tiltfile
    # never applies it, so the deployed local stack has none. Add
    # `ingress: {hosts: [reporting.adtech.local]}` to restore it.

# ============================================================
# Infrastructure
# ============================================================
infra:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    replicas: 1
    storage: 20Gi
    # Dev credentials, plaintext — same mechanism as the kustomize base
    # (k8s/base/postgres/statefulset.yaml ships this Secret with the same
    # values). Staging/prod must supply real secrets out-of-band (SOPS).
    credentials:
      username: adtech
      password: adtech-local-dev
    resources:
      requests: { cpu: "300m", memory: "1Gi" }
      limits: { cpu: "2000m", memory: "4Gi" }

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    # Local runs a SINGLE standalone JetStream node (see
    # k8s/overlays/local/nats-single.yaml for the raft-on-one-host rationale).
    # Staging/prod flip cluster.enabled=true + replicas=3 (the base topology).
    replicas: 1
    cluster:
      enabled: false
      name: adtech-nats
      connectRetries: 30
    jetstream:
      maxMem: 256MB
      maxFile: 4GB
    storage: 5Gi
    resources:
      # 250m request (was 500m): the 2000m LIMIT below is what fixed the
      # throttled ack path; the request only sets cpu.weight. At 500m the
      # weight dilution starved tracker/gateway under saturation (their Go
      # sched p99 jumped 10ms -> 117ms bucket at 110rps, 2026-08-06) and
      # every post-bump run regressed 2-5x on tail latencies. 250m keeps
      # 2.5x the pre-bump weight for the ack path.
      requests: { cpu: "250m", memory: "256Mi" }
      # 2Gi memory: the JetStream boot restore after a heavy bench day peaked
      # >1Gi (2026-08-06: 1.09M-msg stream restore re-OOMed 17x in a crash-loop).
      # CPU 2000m (was 500m): at 200rps the platform publishes ~2.5k durable
      # msgs/s + fans out to ~150 consumers — half a core throttled the ack
      # path, publishers hit their deadlines, and ~1.6M events took the disk
      # spool detour (lossless but late; 2026-08-06 sweep-2 finding).
      limits: { cpu: "2000m", memory: "2Gi" }

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    maxmemory: 1gb
    maxmemoryPolicy: allkeys-lru
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  minio:
    # Pinned by digest — see k8s/base/minio/deployment.yaml for rationale.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    rootUser: adtech
    rootPassword: adtech-local-dev
    storage: 20Gi
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.43@sha256:aac07eea19a720580a54cbfaba4bf5f90b7c53bfc0805996860bf0c6c26b6ce7
    replicas: 1
    cacheGrid: 256MiB
    # development=true shrinks TB's static allocations (batch/journal/caches):
    # ~2.4GiB anon → a few hundred MiB. On the 12GiB laptop VM that 2.4GiB was
    # the single biggest RAM block and pushed the node into page-cache thrash
    # (pgmajfault storms → 10-250ms stalls in EVERY service) under load.
    # Flipping this requires a REFORMAT (delete the PVC) — batch size is baked
    # into the data file at format time. tigerbeetle-go (same 0.16.x) negotiates
    # batch size at connect; money invariants re-proven via `simulator --verify`.
    # Prod overrides its whole tigerbeetle block and never sets this → off.
    development: true
    storage: 1Gi
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "2Gi" }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    db: adtech
    user: adtech
    password: adtech-local-dev
    storage: 10Gi
    resources:
      requests: { cpu: "100m", memory: "512Mi" }
      limits: { cpu: "1", memory: "2Gi" }

  registryMirror:
    # Docker Hub pull-through cache at NodePort 30500 — local-only concern.
    enabled: true
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    remoteURL: https://registry-1.docker.io
    storage: 20Gi
    nodePort: 30500
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  mailpit:
    enabled: true
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "128Mi" }

# ============================================================
# Observability
# ============================================================
observability:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    retention: 7d
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi" }

  grafana:
    enabled: true
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    adminUser: admin
    adminPassword: admin
    resources:
      requests: { cpu: "25m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

  loki:
    enabled: true
    image: grafana/loki:3.1.0@sha256:d947e68a84d9e44915dfa08c3bec27e2124efd5ba6c83443eb53578101ec69e3
    # Sized for the REAL log firehose: once promtail actually shipped
    # (2026-07-18 fix), a 200rps load run CPU-throttled the 500m limit until
    # the internal ingester failed healthchecks and the pod flapped.
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits: { cpu: "1500m", memory: "1Gi" }

  promtail:
    enabled: true
    # 3.1.0's tailer accumulated a busy-spin after load-run log rotations —
    # pinned at its 200m limit at IDLE (198m vs 11m freshly restarted,
    # 2026-08-06); 3.5.x carries the file-tailer fixes from the 3.2-3.5 line.
    image: grafana/promtail:3.5.3@sha256:698c3357886c886bb9a862da36062e130c20bf359d956148e67ee36141ef6f17
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }

  # VM-level pressure metrics (CPU modes / MemAvailable / disk+net) — the
  # "is it code or is it the VM" half of the Stack-pressure dashboard row.
  nodeExporter:
    enabled: true
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    resources:
      requests: { cpu: "25m", memory: "32Mi" }
      limits: { cpu: "100m", memory: "128Mi" }

  jaeger:
    enabled: true
    image: jaegertracing/all-in-one:1.58@sha256:f015fb34e6742bb46b87c42cf83abfacfdd5dc39864a859a4ba942eb21c4b29c
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      # See k8s/base/jaeger/deployment.yaml for the 1536Mi rationale.
      limits: { cpu: "500m", memory: "1536Mi" }

# ============================================================
# CronJobs (schedules verbatim from k8s/cronjobs/*)
# ============================================================
cronjobs:
  batch-conductor:
    image: adtech-batch-conductor
    schedule: "10 * * * *"
    component: data-chain
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 1
    activeDeadlineSeconds: 1800
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "batch-conductor"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: BATCH_CONDUCTOR_NATS_URL
        value: "nats://nats:4222"
      - name: BATCH_CONDUCTOR_PIPELINE_URL
        value: "http://pipeline:8087"
      - name: BATCH_CONDUCTOR_REPORTING_URL
        value: "http://reporting:8086"
      - name: BATCH_CONDUCTOR_DATALAKE_BUCKET
        value: "adtech-datalake-hotcold"
      - name: REPORTING_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      # ADR 0006 phase 2: profile-builder step reads behaviour/profile signals
      # from ClickHouse (server-side GROUP BY) instead of Arrow-reading the lake
      # (the OOM fix). Empty/unreachable addr → silent fallback to lake reads, so
      # this MUST point at the in-cluster ClickHouse, not the localhost default.
      - name: BATCH_CONDUCTOR_CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: PRIVACY_DELETE_PIPELINE_URL
        value: "http://pipeline:8087"
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_SSL
        value: "false"
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "1", memory: "512Mi" }

  dayboundary:
    image: adtech-dayboundary
    schedule: "5 0 * * *"
    component: lifecycle
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 600
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "dayboundary"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: NATS_URL
        value: "nats://nats:4222"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }

  # invoice-runner bills the calendar month that just closed: sums billed
  # committed spend per campaign into one invoice + per-campaign line items per
  # advertiser account. Idempotent (keyed on account + period), so a re-run is
  # safe. 02:00 on the 1st gives the day-boundary/rollup chain time to settle
  # the final day of the month before it's billed.
  invoice-runner:
    image: adtech-invoice-runner
    schedule: "0 2 1 * *"
    component: billing
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 600
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "invoice-runner"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }

  # payout-runner pays the calendar month that just closed OUT to publishers —
  # the money-OUT mirror of invoice-runner. Sums each publisher's gross revenue
  # from ClickHouse, applies their rev-share contract to get the net owed, gates
  # on the publisher's minimum-payout threshold, and writes one idempotent
  # `payouts` row per (publisher, period). 03:00 (after invoice-runner at 02:00)
  # so settlement + invoicing have finished. Needs ClickHouse (the earnings
  # source) in addition to Postgres.
  payout-runner:
    image: adtech-payout-runner
    schedule: "0 3 1 * *"
    component: billing
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 600
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "payout-runner"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      - name: CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: CLICKHOUSE_USER
        value: "adtech"
      - name: CLICKHOUSE_PASSWORD
        value: "adtech-local-dev"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }

  # account-closeout finalizes account closures whose 30-day grace period has
  # elapsed (PLAN Phase 11, item 105): generates a final invoice, marks the
  # account closed, and schedules the (deferred) 90-day purge. Idempotent —
  # each closure flips grace→closed exactly once. Daily at 03:00, after the
  # invoice run's window.
  account-closeout:
    image: adtech-account-closeout
    schedule: "0 3 * * *"
    component: billing
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    # Wide enough for both passes: the 5-min closeout budget plus the purge's own
    # 30-min budget (slow ClickHouse mutations_sync deletes + S3 blob deletes).
    activeDeadlineSeconds: 2400
    restartPolicy: OnFailure
    env:
      - name: POD_NAME
        value: "account-closeout"
      - name: DATABASE_URL
        value: "postgres://adtech_app:adtech-app-local@postgres:5432/adtech?sslmode=disable"
      # ClickHouse for the publisher final-payout path (gross-revenue source) AND
      # the analytics half of the 90-day purge; if unreachable the run degrades to
      # advertiser-only + logs a deferral (purge retries the CH half next run).
      - name: CLICKHOUSE_ADDR
        value: "clickhouse:9000"
      - name: CLICKHOUSE_USER
        value: "adtech"
      - name: CLICKHOUSE_PASSWORD
        value: "adtech-local-dev"
      # Object storage — the purge deletes the account's export ZIP (a full copy of
      # its exported data) from the private reports bucket. Real S3 in staging/prod
      # is injected over these by the global.s3 template block.
      - name: S3_ENDPOINT
        value: "minio:9000"
      - name: S3_ACCESS_KEY
        value: "adtech"
      - name: S3_SECRET_KEY
        value: "adtech-local-dev"
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
