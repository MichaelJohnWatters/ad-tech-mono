apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: adtech
data:
  adtech-overview.json: |
    {
      "title": "Ad Tech Overview",
      "uid": "adtech-overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Pipeline Health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 1,
          "title": "Auction RPS",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "description": "Auctions per second hitting the exchange.",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",service=\"exchange\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval]))",
              "legendFormat": "auctions/s"
            }
          ]
        },
        {
          "id": 2,
          "title": "Auction Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "description": "Exchange auction handler p50/p95/p99 from the request_duration_seconds histogram.",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 3,
          "title": "Bid RPS by DSP pod",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "description": "OpenRTB bid requests per second per DSP pod. Each pod is a separate scrape target with a 'pod' label set in the Prometheus scrape config.",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",exported_service=\"dsp\",handler=~\"/v1/openrtb/bid|/adtech.internalrpc.InternalBidService/Bid\"}[$__rate_interval])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Impression RPS",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "description": "Tracker impression pixel hits per second.",
          "targets": [
            {
              "expr": "sum(rate(adtech_http_requests_total{service=\"tracker\",handler=\"/v1/t/imp\"}[$__rate_interval]))",
              "legendFormat": "impressions/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "Click RPS",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "description": "Tracker click redirects per second.",
          "targets": [
            {
              "expr": "sum(rate(adtech_http_requests_total{service=\"tracker\",handler=\"/v1/t/click\"}[$__rate_interval]))",
              "legendFormat": "clicks/s"
            }
          ]
        },
        {
          "id": 6,
          "title": "Bid latency p95 by DSP",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "description": "p95 OpenRTB bid handler latency per DSP pod. Spikes here are the leading indicator of fan-out timeouts on the exchange side.",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",exported_service=\"dsp\",handler=~\"/v1/openrtb/bid|/adtech.internalrpc.InternalBidService/Bid\"}[$__rate_interval])) by (pod, le))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "title": "Service Error Rate (5xx + 4xx)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "description": "HTTP errors per second by service+status. Built from adtech_http_requests_total with status=~\"[45]..\" \u2014 there's no separate errors counter. Adserver 429s are EXCLUDED here: they're almost always frequency caps working as designed and at load they drown every real error \u2014 they live in the dedicated '429 breakdown' panel to the right (which also splits caps from rate-limiter throttling).",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",status=~\"[45]..\",status!=\"429\"}[5m])) by (service, status)",
              "legendFormat": "{{service}} {{status}}"
            },
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",status=\"429\",exported_service!=\"adserver\"}[5m])) by (service, status)",
              "legendFormat": "{{service}} {{status}}"
            }
          ]
        },
        {
          "id": 23,
          "title": "Adserver 429 breakdown \u2014 freq caps vs rate limiter",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "description": "The adserver has TWO 429 sources with opposite meanings: frequency caps (product working \u2014 a household/user hit its impression limit) and the per-IP rate limiter (traffic being throttled). The generic error-rate panel can't tell them apart. freq-cap series come from the dedicated counter; 'rate limiter / other' is total 429s minus freq-cap blocks.",
          "targets": [
            {
              "expr": "sum(rate(adtech_adserver_freqcap_blocked_total[$__rate_interval])) by (scope)",
              "legendFormat": "freq cap \u2014 {{scope}}"
            },
            {
              "expr": "clamp_min(sum(rate(adtech_http_requests_total{exported_service=\"adserver\",status=\"429\"}[$__rate_interval])) - sum(rate(adtech_adserver_freqcap_blocked_total[$__rate_interval])), 0)",
              "legendFormat": "rate limiter / other 429s"
            }
          ]
        },
        {
          "id": 8,
          "title": "In-flight requests by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "description": "Number of concurrent HTTP requests being handled. A sustained climb usually means a downstream is slow + requests are pooling.",
          "targets": [
            {
              "expr": "sum(adtech_http_in_flight_requests) by (service)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Service up",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 25
          },
          "description": "1 = service is up (Prometheus successfully scraped its /metrics).",
          "targets": [
            {
              "expr": "sum(adtech_up) by (service)",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "value": 0,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 10,
          "title": "Goroutines",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 25
          },
          "description": "Live goroutine count per service. A monotonic climb is a leak signal.",
          "targets": [
            {
              "expr": "go_goroutines",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "Go heap (MiB)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 25
          },
          "description": "Go runtime total memory classes (heap + stacks + metadata + \u2026). On macOS the Linux process_resident_memory_bytes isn't emitted, so this is the closest proxy.",
          "targets": [
            {
              "expr": "go_memory_classes_total_bytes / 1024 / 1024",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "MiB",
              "decimals": 1
            }
          }
        },
        {
          "id": 12,
          "title": "Auction outcomes (fill rate)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "description": "adtech_auctions_total broken down by result. The winner share over total = fill rate.",
          "targets": [
            {
              "expr": "sum(rate(adtech_auctions_total[$__rate_interval])) by (result)",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 13,
          "title": "Fill rate %",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 29
          },
          "description": "winner share of all auctions over the last minute. 100% = every request filled.",
          "targets": [
            {
              "expr": "sum(rate(adtech_auctions_total{result=\"winner\"}[$__rate_interval])) / sum(rate(adtech_auctions_total[$__rate_interval]))",
              "legendFormat": "fill"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  {
                    "value": 0,
                    "color": "red"
                  },
                  {
                    "value": 0.3,
                    "color": "yellow"
                  },
                  {
                    "value": 0.7,
                    "color": "green"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 14,
          "title": "Revenue/min (USD)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 29
          },
          "description": "Sum of clearing prices over the last minute. rate() x 60 turns the per-second counter rate into per-minute.",
          "targets": [
            {
              "expr": "rate(adtech_auction_clearing_price_usd_total[$__rate_interval]) * 60",
              "legendFormat": "$/min"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 15,
          "title": "Total revenue (last hour)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 33
          },
          "targets": [
            {
              "expr": "increase(adtech_auction_clearing_price_usd_total[1h])",
              "legendFormat": "$ 1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 16,
          "title": "Bids dropped below floor",
          "type": "timeseries",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 33
          },
          "description": "Bids that arrived but were below the placement's effective floor. High here = floors set too high for available demand.",
          "targets": [
            {
              "expr": "sum(rate(adtech_bids_below_floor_total[$__rate_interval])) by (placement_id)",
              "legendFormat": "{{placement_id}}"
            }
          ]
        },
        {
          "id": 17,
          "title": "Bids / Wins / No-bids by DSP",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "description": "Per-DSP bid behaviour: bids submitted, no-bids returned, auctions won. dsp_endpoint label is the URL the exchange fans out to (one per DSP pod). Bids = bids_received with decision=bid. No-bids = same counter, decision=no_bid. Wins = auctions_won_total. Loss rate = bids - wins.",
          "targets": [
            {
              "expr": "sum(rate(adtech_bids_received_total{decision=\"bid\"}[$__rate_interval])) by (dsp_endpoint)",
              "legendFormat": "bids \u2014 {{dsp_endpoint}}"
            },
            {
              "expr": "sum(rate(adtech_bids_received_total{decision=\"no_bid\"}[$__rate_interval])) by (dsp_endpoint)",
              "legendFormat": "no-bids \u2014 {{dsp_endpoint}}"
            },
            {
              "expr": "sum(rate(adtech_auctions_won_total[$__rate_interval])) by (dsp_endpoint)",
              "legendFormat": "wins \u2014 {{dsp_endpoint}}"
            }
          ]
        },
        {
          "id": 18,
          "title": "Scrape targets down",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 45
          },
          "description": "Graph-trust self-check 1/3: pods Prometheus could NOT scrape. When this is >0, zeros and gaps on other panels may be missing data, not real traffic drops.",
          "targets": [
            {
              "expr": "count(up{job=\"adtech-pods\"} == 0) OR on() vector(0)",
              "legendFormat": "targets down"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 19,
          "title": "Auction flow — two independent layers",
          "type": "timeseries",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 6,
            "y": 45
          },
          "description": "Graph-trust self-check 2/3: app-layer auction rate (exchange counters) vs event-bus layer (JetStream append rate). They track each other when telemetry is honest; one flatlining while the other flows = graphs are lying (scrape gap, label drift, or publish loss). ClickHouse's auctions table is the final arbiter.",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",exported_service=\"exchange\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval]))",
              "legendFormat": "app layer: exchange auctions/s"
            },
            {
              "expr": "sum(rate(jetstream_stream_last_seq[$__rate_interval]))",
              "legendFormat": "bus layer: JetStream events appended/s"
            }
          ]
        },
        {
          "id": 20,
          "title": "Reporting consumer backlog",
          "type": "timeseries",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 45
          },
          "description": "Graph-trust self-check 3/3: JetStream messages pending across consumers. Sustained growth = reporting/dashboards lag live traffic (numbers are late, not wrong).",
          "targets": [
            {
              "expr": "sum(jetstream_consumer_num_pending)",
              "legendFormat": "pending events"
            }
          ]
        },
        {
          "id": 21,
          "title": "Service CPU (cores) by pod",
          "type": "timeseries",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 51
          },
          "description": "App-process CPU from the services' own /metrics (adtech_process_cpu_seconds_total) — no cadvisor in this stack, so this is the only per-pod CPU view Prometheus has. The 2026-08 throughput hunts needed exactly this and it existed unused.",
          "targets": [
            {
              "expr": "sum(rate(adtech_process_cpu_seconds_total[$__rate_interval])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 22,
          "title": "Service RSS (MiB) by pod",
          "type": "timeseries",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 51
          },
          "description": "Resident memory per app pod (adtech_process_resident_memory_bytes). The VM has 12GiB total: watch for creep — page-cache thrash starts when the node's available memory runs out (see 2026-08-04 fill collapse).",
          "targets": [
            {
              "expr": "adtech_process_resident_memory_bytes / 1048576",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Per-pod — spot the sick replica",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 55 }
        },
        {
          "id": 27,
          "title": "Auction RPS by exchange pod",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 56 },
          "description": "Same data as Auction RPS, split per pod. Healthy = three near-identical lines (round-robin). One line sagging = that pod is slow/unready; one at zero = it's out of rotation.",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",exported_service=\"exchange\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 28,
          "title": "Auction latency p95 by exchange pod",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 56 },
          "description": "Per-pod auction p95. The aggregate panel hides a single degraded replica (2 fast pods + 1 slow one averages 'fine'); this one names it.",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",exported_service=\"exchange\",handler=~\"/v1/openrtb/auction|/adtech.internalrpc.InternalAuctionService/RunAuction\"}[$__rate_interval])) by (pod, le))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "row",
          "title": "Phase profiling — where the milliseconds go",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 57 }
        },
        {
          "id": 24,
          "title": "Exchange auction phases (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 58 },
          "description": "Per-phase auction latency p95: gates (decode+adstxt/schain/sign), routing (DSP selection), fanout (bid collection — usually dominant), dealeval (deal match + winner), finalize (records + response encode). Mirrors the Jaeger span boundaries. A latency spike now names its phase.",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(adtech_auction_phase_duration_seconds_bucket[$__rate_interval])) by (phase, le))",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 25,
          "title": "DSP bid phases (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 58 },
          "description": "Per-phase bid-handler latency p95: parse (decode+privacy), audience (private/household segment lookups), campaign_loop (eligibility over the whole catalog — the phase that scales with campaign count; the O(campaigns) budget-read bug lived here), encode. All 3 local DSP deployments run this binary; external DSPs are outside-in only (dsp_calls).",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(adtech_bid_phase_duration_seconds_bucket[$__rate_interval])) by (phase, le))",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 26,
          "title": "SSP serve phases (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 58 },
          "description": "Per-phase serve latency p95: pre_auction (placement/segment/household work), auction (exchange round-trip), render (adserve + response build).",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(adtech_ssp_serve_phase_duration_seconds_bucket[$__rate_interval])) by (phase, le))",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 29,
          "title": "Adserver serve phases (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 66 },
          "description": "Per-phase adserver serve latency p95: freqcap (Redis cap check, user+household), creative (resolver: L1/L2/object store), assemble (macro substitution + signed tracking URLs + response encode). Decomposes the SSP render leg — the biggest owned phase left after the 2026-08-05 auction-speed push.",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(adtech_adserver_serve_phase_duration_seconds_bucket[$__rate_interval])) by (phase, le))",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 30,
          "title": "Go scheduler latency p99 by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 66 },
          "description": "Time goroutines sit RUNNABLE waiting for a core (go_sched_latencies). This is the 'is it code or is it the VM' discriminator: when phase p95s inflate while this climbs, the fix is cores/replicas, not code. Idle stacks read microseconds; the 8-vCPU VM under 110rps load reads ~10ms p99.",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(go_sched_latencies_seconds_total_bucket{service=~\"exchange|dsp-internal|ssp|adserver|tracker\"}[$__rate_interval])))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 31,
          "title": "Fleet CPU (cores) by service + node non-idle",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 66 },
          "description": "Per-service CPU from each Go process's own counter (adtech_process_cpu_seconds_total — no cadvisor in this stack) plus the node's total non-idle line from node-exporter. When the node line saturates (~8 cores), every latency graph above it is suspect.",
          "targets": [
            {
              "expr": "sum by (service) (rate(adtech_process_cpu_seconds_total[$__rate_interval]))",
              "legendFormat": "{{service}}"
            },
            {
              "expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[$__rate_interval]))",
              "legendFormat": "node non-idle (total)"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none" } }
        },
        {
          "type": "row",
          "title": "Stack pressure — node CPU / memory (correlate with everything above)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 74 }
        },
        {
          "id": 32,
          "title": "Node CPU by mode",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 75 },
          "description": "node-exporter CPU seconds by mode. The 2026-08-04 thrash diagnosis signals, now on a graph instead of /proc spelunking: iowait spikes = page-cache thrash / disk stalls; irq+softirq ~23% at 150rps = the virtio-net ceiling; idle ~0 = saturation (phase p95s above are then queueing, not code).",
          "targets": [
            {
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!=\"idle\"}[$__rate_interval]))",
              "legendFormat": "{{mode}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "custom": { "stacking": { "mode": "normal" } } } }
        },
        {
          "id": 33,
          "title": "Memory: service RSS (stacked) + node MemAvailable",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 75 },
          "description": "Per-service resident memory (process collector) stacked, with the node's MemAvailable overlaid. MemAvailable approaching ~1.5GiB is the page-cache-thrash danger zone (2026-08-04: kernel evicted executable pages → random 10-250ms stalls fleet-wide; fixed by TB --development + trimming, but the fleet keeps growing).",
          "targets": [
            {
              "expr": "sum by (service) (adtech_process_resident_memory_bytes)",
              "legendFormat": "{{service}}"
            },
            {
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "node MemAvailable"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "row",
          "title": "Service Detail",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 83
          }
        },
        {
          "id": 1,
          "title": "Request Rate by handler",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 49
          },
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",service=~\"$service\"}[$__rate_interval])) by (handler, method)",
              "legendFormat": "{{method}} {{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Request Latency (p50/p95/p99)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 49
          },
          "description": "Latency histogram quantiles across all handlers for the selected service.",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",service=~\"$service\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",service=~\"$service\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",service=~\"$service\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 3,
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 57
          },
          "description": "Errors per second derived from adtech_http_requests_total with status=~\"[45]..\" (we don't keep a separate counter).",
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"adtech_http_requests_total|adtech_grpc_requests_total\",service=~\"$service\",status=~\"[45]..\"}[$__rate_interval])) by (status, handler)",
              "legendFormat": "{{status}} {{handler}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "p95 Latency by handler",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 57
          },
          "description": "Breaks down latency per handler so you can spot which endpoint is causing the service-wide tail.",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate({__name__=~\"adtech_http_request_duration_seconds_bucket|adtech_grpc_request_duration_seconds_bucket\",service=~\"$service\"}[$__rate_interval])) by (handler, le))",
              "legendFormat": "{{handler}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 5,
          "title": "In-flight requests",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 65
          },
          "targets": [
            {
              "expr": "adtech_http_in_flight_requests{service=~\"$service\"}",
              "legendFormat": "in-flight"
            }
          ]
        },
        {
          "id": 6,
          "title": "Goroutines + memory",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 65
          },
          "description": "Goroutine count and Go runtime total memory (in MiB). Goroutines climbing without coming down = leak. Memory climbing alongside RPS is fine; alongside no RPS is leak.",
          "targets": [
            {
              "expr": "go_goroutines{service=~\"$service\"}",
              "legendFormat": "goroutines"
            },
            {
              "expr": "go_memory_classes_total_bytes{service=~\"$service\"} / 1024 / 1024",
              "legendFormat": "memory (MiB)"
            }
          ]
        },
        {
          "type": "row",
          "title": "NATS / Event Bus",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 73
          }
        },
        {
          "title": "Consumer lag (num_pending) \u2014 events building up",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 74
          },
          "targets": [
            {
              "expr": "jetstream_consumer_num_pending > 0",
              "legendFormat": "{{consumer_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "title": "Ack pending (delivered, unacked)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 83
          },
          "targets": [
            {
              "expr": "jetstream_consumer_num_ack_pending > 0",
              "legendFormat": "{{consumer_name}}"
            }
          ]
        },
        {
          "title": "Redeliveries/s (at-least-once retries firing)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 83
          },
          "targets": [
            {
              "expr": "rate(jetstream_consumer_num_redelivered[5m]) > 0",
              "legendFormat": "{{consumer_name}}"
            }
          ]
        },
        {
          "title": "Stream messages held",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 91
          },
          "targets": [
            {
              "expr": "jetstream_stream_total_messages",
              "legendFormat": "{{stream_name}}"
            }
          ]
        },
        {
          "title": "Stream bytes held",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 91
          },
          "targets": [
            {
              "expr": "jetstream_stream_total_bytes",
              "legendFormat": "{{stream_name}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Audience Cache Writer",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 92 }
        },
        {
          "id": 19,
          "title": "Change-log backlog (un-drained rows)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 93 },
          "description": "Rows in audience_membership_changelog not yet applied by the single writer. Steady ~0 is healthy; a sustained climb means the writer can't keep up — shard it.",
          "targets": [
            { "expr": "adtech_audience_cache_changelog_backlog{service=\"pipeline\"}", "legendFormat": "backlog rows" }
          ]
        },
        {
          "id": 20,
          "title": "Change-log lag (oldest un-drained row, s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 93 },
          "description": "Age of the oldest pending change. This is the audience-cache staleness ceiling; the writer WARNs past audience.changelog_lag_warn (30s). Sustained high lag = time to shard the writer.",
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 30 } ] } } },
          "targets": [
            { "expr": "adtech_audience_cache_changelog_lag_seconds{service=\"pipeline\"}", "legendFormat": "oldest lag (s)" }
          ]
        },
        {
          "id": 21,
          "title": "Writer drain age (liveness, s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 93 },
          "description": "Seconds since the writer last drained. Should stay near the poll interval (3s). A rising value means the single writer is stalled/dead.",
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "adtech_audience_cache_drain_age_seconds{service=\"pipeline\"}", "legendFormat": "drain age (s)" }
          ]
        }
      ]
    }
  all-logs.json: |
    {
      "title": "Ad Tech All Logs",
      "uid": "adtech-logs",
      "tags": [
        "adtech",
        "logs"
      ],
      "timezone": "utc",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "title": "Filtered logs",
          "type": "logs",
          "gridPos": {
            "h": 24,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "description": "All service logs in one stream. Filter via the template vars at the top. Service+level are multi-select (default = all). trace_id + search are textboxes (default empty = no filter). Examples: trace_id=ea14... + search empty \u2192 all log lines for that trace across services. service=dsp + level=WARN + search=\"audience\" \u2192 DSP warnings about the audience store. To extend in-panel without editing this dashboard: click the panel title \u2192 Edit, then append more LogQL clauses (e.g. | campaign=\"abc-123\").",
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "{service=~\"${service:regex}\"} | json | level=~\"${level:regex}\" | trace_id=~\".*${trace_id}.*\" |~ \"${search}\"",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Quick filters (copy a query into the panel above)",
          "type": "text",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "options": {
            "mode": "markdown",
            "content": "**Common LogQL shortcuts** \u2014 append these clauses to the panel query (Panel \u2192 Edit) when the top-bar filters aren't enough:\n\n- All **ERRORs** across services: set level=ERROR in the dropdown above.\n- **One trace end-to-end**: paste the trace_id into the textbox; the query auto-wraps with `trace_id=~\".*<id>.*\"`.\n- **Exchange auctions only**: set service=exchange, then search `auction complete` or `no_bids`.\n- **DSP bid submissions** with campaign + price: `service=dsp, search=\"bid submitted\"`.\n- **Slow paths**: in the panel query add `| duration_ms > 100` (works if the service slog'd a duration_ms field on that line).\n- **Audience preload heartbeats**: `service=~\".+\", search=\"audience preload\"` \u2014 confirms warm cache is pumping every 30s.\n- **Win/loss notify trace**: `service=dsp, search=\"win notification\"|\"loss notification\"`.\n\n**Why some fields show 'no extracted labels'**: a log line without a JSON field for that key (e.g. an INFO without a trace_id) won't match `| trace_id=~\".+\"`. With the default `.*` we use here, empty / missing fields still pass through."
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({service=~\".+\"}, service)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "level",
            "type": "custom",
            "query": "INFO,WARN,ERROR,DEBUG",
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID (substring)",
            "current": {
              "text": "",
              "value": ""
            }
          },
          {
            "name": "search",
            "type": "textbox",
            "label": "Free-text search (regex)",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      }
    }
