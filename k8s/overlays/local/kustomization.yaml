apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Local overlay: full observability stack, debug logging.
# Same as staging/prod topology EXCEPT NATS, which runs as a single standalone
# node here — a 3-node JetStream cluster can't hold a stable raft leader on one
# OrbStack host (see nats-single.yaml).

patchesStrategicMerge:
  - nats-single.yaml
