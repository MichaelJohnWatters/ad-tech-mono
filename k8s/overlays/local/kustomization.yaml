apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Local overlay: full HA stack, debug logging
# Same as staging/prod topology for "works on my machine" guarantee

patchesStrategicMerge: []
# Patches will be added as services are built
# Example: single replica overrides, debug log levels, local storage paths
