# Local dev runs NATS as a SINGLE standalone JetStream node, not the base
# 3-node cluster. On a single OrbStack host the 3-node meta-raft can't hold a
# stable leader — disk fsync latency keeps tripping election timeouts, which
# surfaced as "context deadline exceeded" publish timeouts and dropped events
# during load. One node = no raft, no elections, no flapping. Base/staging/prod
# keep the 3-node cluster for HA (NATS node count is about failover, not client
# throughput — a single node serves thousands of client pods fine).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: adtech
spec:
  replicas: 1
---
# Drop the cluster{} block from the base config. A lone node would otherwise
# burn connect_retries chasing nats-1/nats-2 routes that don't exist. Standalone
# JetStream (streams are Replicas:1 here; NATS_STREAM_REPLICAS stays unset).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: adtech
data:
  nats.conf: |
    server_name: $SERVER_NAME
    listen: 0.0.0.0:4222
    http_port: 8222

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 4GB
    }
