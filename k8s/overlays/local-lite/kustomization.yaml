apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Lite overlay: minimal infra, no observability
# For constrained machines or quick smoke tests
# Usage: PROFILE=lite tilt up

patchesStrategicMerge:
  - postgres-single.yaml

# No Prometheus, Grafana, Loki, Jaeger in lite mode
