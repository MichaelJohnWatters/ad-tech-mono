apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: adtech
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: ui
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: adtech
spec:
  selector:
    app: mailpit
  ports:
    - port: 1025
      targetPort: 1025
      name: smtp
    - port: 8025
      targetPort: 8025
      name: ui
