apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ssp, namespace: adtech, annotations: { traefik.ingress.kubernetes.io/router.entrypoints: web } }
spec:
  ingressClassName: traefik
  rules:
    - host: ssp.adtech.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: ssp, port: { number: 8084 } } } }
