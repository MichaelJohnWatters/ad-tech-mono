# Pipeline — the data-lake BATCH layer. Consumes the event stream from NATS
# (its own consumer group, so it sees every event independently of reporting)
# and lands events as Parquet + a real Delta transaction log in object storage
# (Minio). This is what populates the COLD store the reporting HotColdStore reads.
# Background consumer (no external ingress); exposes /healthz, /readyz,
# /debug/datalake/snapshot on 8087. Image built via Tilt's docker_build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
  namespace: adtech
  labels:
    app: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      labels:
        app: pipeline
    spec:
      # See tracker/deployment.yaml — service-link env injection collides with
      # pkg/config's env-var fallback, so disable it platform-wide.
      enableServiceLinks: false
      containers:
        - name: pipeline
          image: adtech-pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: POD_NAME
              value: "pipeline-0"
            - name: PIPELINE_NATS_URL
              value: "nats://nats:4222"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: DATABASE_URL
              value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
            # Cold-store storage: Minio, host:port (no scheme) for both minio-go
            # (writer) and DuckDB delta_scan (reader).
            - name: S3_ENDPOINT
              value: "minio:9000"
            - name: S3_ACCESS_KEY
              value: "adtech"
            - name: S3_SECRET_KEY
              value: "adtech-local-dev"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_USE_SSL
              value: "false"
            # Fresh bucket for the hot/cold storage test (non-destructive; all real-Delta).
            - name: PIPELINE_DATALAKE_BUCKET
              value: "adtech-datalake-hotcold"
            # Flush fast so the lake is visible quickly during the test.
            - name: PIPELINE_DATALAKE_FLUSH_INTERVAL
              value: "10s"
            # Poll the onboarding drop-zone fast enough for e2e to observe
            # ingestion without a minute-long wait.
            - name: PIPELINE_ONBOARDING_POLL_INTERVAL
              value: "10s"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: OTEL_ENDPOINT
              value: "jaeger:4318"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8087
            periodSeconds: 2
            failureThreshold: 3
