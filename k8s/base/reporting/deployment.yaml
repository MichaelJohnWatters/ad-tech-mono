# Reporting — CGO-free pod (ADR 0004 P3). The default build (no `duckdb` tag)
# uses the pure-Go ClickHouse driver + memory fallback, so it builds like every
# other service via build/Dockerfile.dev with live_update. Analytics/billing
# config lives here in the env, using in-cluster service DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: adtech
  labels:
    app: reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      enableServiceLinks: false
      containers:
        - name: reporting
          image: adtech-reporting
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: REPORTING_NATS_URL
              value: "nats://nats:4222"
            - name: DATABASE_URL
              value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: OTEL_ENDPOINT
              value: "jaeger:4318"
            - name: REDIS_URL
              value: "redis:6379"
            # Analytics: ClickHouse event store + batched consumer + rollups
            - name: REPORTING_ANALYTICS_BACKEND
              value: "clickhouse"
            - name: REPORTING_CLICKHOUSE_ADDR
              value: "clickhouse:9000"
            - name: REPORTING_CLICKHOUSE_BATCH_CONSUMER
              value: "true"
            - name: REPORTING_ROLLUP_ENABLED
              value: "true"
            # Billing: durable TigerBeetle ledger
            - name: BILLING_LEDGER_BACKEND
              value: "tigerbeetle"
            - name: BILLING_TIGERBEETLE_ADDRESSES
              value: "tigerbeetle:3000"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8086 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8086 }
            periodSeconds: 2
            failureThreshold: 5
