# Reporting — CGO-free pod (ADR 0004 P3). The default build (no `duckdb` tag)
# uses the pure-Go ClickHouse driver + memory fallback, so it builds like every
# other service via build/Dockerfile.dev with live_update. Analytics/billing
# config lives here in the env, using in-cluster service DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: adtech
  labels:
    app: reporting
spec:
  # >1 replica is safe on the ClickHouse backend (below) with the shared pacing
  # counter enabled (REPORTING_SHARED_PACING_COUNTER) — the NATS consumer
  # load-balances ingestion and pacing stays correct across pods. DuckDB's
  # single-writer constraint does NOT apply here (analytics backend = clickhouse).
  replicas: 2
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      enableServiceLinks: false
      containers:
        - name: reporting
          image: adtech-reporting
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: REPORTING_NATS_URL
              value: "nats://nats:4222"
            - name: DATABASE_URL
              value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: OTEL_ENDPOINT
              value: "jaeger:4318"
            - name: REDIS_URL
              value: "redis:6379"
            # Analytics: ClickHouse event store + batched consumer + rollups
            - name: REPORTING_ANALYTICS_BACKEND
              value: "clickhouse"
            - name: REPORTING_CLICKHOUSE_ADDR
              value: "clickhouse:9000"
            - name: REPORTING_CLICKHOUSE_BATCH_CONSUMER
              value: "true"
            # Multi-replica pacing: store committed spend in a shared Redis
            # counter (additive across replicas) + periodic store reconcile,
            # so >1 reporting replica doesn't fragment DSP pacing. See
            # cmd/reporting/committed_counter.go.
            - name: REPORTING_SHARED_PACING_COUNTER
              value: "true"
            - name: REPORTING_ROLLUP_ENABLED
              value: "true"
            # COLD STORE (hot/cold storage test): read deep history from the Parquet/Delta
            # lake in Minio via DuckDB delta_scan. Requires the duckdb-tagged
            # image (build/Dockerfile.reporting.duckdb). hot_window is short so
            # data crosses the hot→cold boundary in ~15m for the test.
            - name: REPORTING_COLD_STORE_ENABLED
              value: "true"
            - name: REPORTING_HOT_WINDOW
              value: "15m"
            - name: S3_ENDPOINT
              value: "minio:9000"
            - name: S3_ACCESS_KEY
              value: "adtech"
            - name: S3_SECRET_KEY
              value: "adtech-local-dev"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_USE_SSL
              value: "false"
            - name: PIPELINE_DATALAKE_BUCKET
              value: "adtech-datalake-hotcold"
            # Billing: durable TigerBeetle ledger
            - name: BILLING_LEDGER_BACKEND
              value: "tigerbeetle"
            - name: BILLING_TIGERBEETLE_ADDRESSES
              value: "tigerbeetle:3000"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 2000m, memory: 768Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8086 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8086 }
            periodSeconds: 2
            failureThreshold: 5
