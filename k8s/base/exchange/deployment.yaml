apiVersion: apps/v1
kind: Deployment
metadata: { name: exchange, namespace: adtech, labels: { app: exchange } }
spec:
  replicas: 1
  selector: { matchLabels: { app: exchange } }
  template:
    metadata: { labels: { app: exchange } }
    spec:
      enableServiceLinks: false
      containers:
        - name: exchange
          image: adtech-exchange
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081, name: http }]
          env:
            # Stable pod_id so e2e tests target the pod's config row without
            # discovery (matches local-process POD_NAME=<service>-0 convention).
            - { name: POD_NAME, value: "exchange-0" }
            # Fan-out target list: 3 DSP Services by in-cluster DNS.
            # Matches cmd/exchange/config.go's exchange.dsp_endpoints key.
            - { name: EXCHANGE_DSP_ENDPOINTS, value: "http://dsp-internal:8082,http://dsp-competitor1:8089,http://dsp-competitor2:8090" }
            - { name: EXCHANGE_ADSERVER_URL, value: "http://adserver:8085" }
            - { name: DATABASE_URL, value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable" }
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: LOKI_URL, value: "http://loki:3100" }
            - { name: OTEL_ENDPOINT, value: "jaeger:4318" }
          resources: { requests: { cpu: 100m, memory: 96Mi }, limits: { cpu: 3000m, memory: 512Mi } }
          livenessProbe:  { httpGet: { path: /healthz, port: 8081 }, initialDelaySeconds: 5, timeoutSeconds: 3, failureThreshold: 5 }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, periodSeconds: 2, timeoutSeconds: 3, failureThreshold: 5 }
