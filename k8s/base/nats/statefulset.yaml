apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: adtech
data:
  nats.conf: |
    server_name: $SERVER_NAME
    listen: 0.0.0.0:4222
    http_port: 8222

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 4GB
    }

    cluster {
      name: adtech-nats
      listen: 0.0.0.0:6222
      routes: [
        nats-route://nats-0.nats.adtech.svc.cluster.local:6222
        nats-route://nats-1.nats.adtech.svc.cluster.local:6222
        nats-route://nats-2.nats.adtech.svc.cluster.local:6222
      ]
      connect_retries: 30
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: adtech
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - nats-server
            - --config
            - /etc/nats/nats.conf
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats
            - name: nats-data
              mountPath: /data/jetstream
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: adtech
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 6222
      targetPort: 6222
      name: cluster
    - port: 8222
      targetPort: 8222
      name: monitor
  clusterIP: None
  publishNotReadyAddresses: true  # DNS must work before pods are ready (cluster bootstrap)
