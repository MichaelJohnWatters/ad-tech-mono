apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adserver
  namespace: adtech
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: adserver.adtech.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adserver
                port:
                  number: 8085
