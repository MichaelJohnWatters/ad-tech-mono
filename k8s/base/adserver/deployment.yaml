# Adserver — second podified service. Same shape as tracker.
# See docs/PODS_MIGRATION.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adserver
  namespace: adtech
  labels:
    app: adserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adserver
  template:
    metadata:
      labels:
        app: adserver
    spec:
      enableServiceLinks: false  # see tracker deployment for rationale
      containers:
        - name: adserver
          image: adtech-adserver
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            # Stable pod_id — see tracker deployment for rationale.
            - name: POD_NAME
              value: "adserver-0"
            # Browser-reachable URL used to template impression / click /
            # viewability pixel hrefs into the served ad HTML. The
            # operator's (or end-user's) browser fetches these; cluster
            # DNS like `tracker:8083` is unreachable from a browser, so
            # we point at the gateway's /v1/t/* reverse proxy instead.
            # Gateway forwards to the in-cluster tracker (path preserved
            # so HMAC signatures still validate). Local dev: gateway is
            # port-forwarded to localhost:8080. Staging/prod overlays
            # override with the public gateway URL.
            - name: ADSERVER_TRACKER_URL
              value: "http://localhost:8080"
            - name: REDIS_URL
              value: "redis:6379"
            - name: DATABASE_URL
              value: "postgres://adtech:adtech-local-dev@postgres:5432/adtech?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: OTEL_ENDPOINT
              value: "jaeger:4318"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_BUCKET
              value: "adtech-creatives"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 2000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 5
