# Docker Hub pull-through cache.
# Configured as a containerd mirror in /etc/rancher/k3s/registries.yaml on
# the node, so every `docker.io/*` image pull from k3s lands here first.
# First pull populates the cache; subsequent pulls (including across
# `colima stop`/`start`) are served from disk and survive Docker Hub
# outages.
#
# Exposed as NodePort 30500 because containerd reads registries.yaml on
# the node — it can't resolve cluster-DNS service names. localhost:30500
# from the node hops through kube-proxy to this pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-mirror-data
  namespace: adtech
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-mirror
  namespace: adtech
  labels:
    app: registry-mirror
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry-mirror
  template:
    metadata:
      labels:
        app: registry-mirror
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-mirror-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry-mirror
  namespace: adtech
spec:
  type: NodePort
  selector:
    app: registry-mirror
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      name: http
