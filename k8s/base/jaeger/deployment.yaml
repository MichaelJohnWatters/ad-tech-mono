apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: adtech
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.58
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 14268
              name: collector
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              # 512Mi OOM-killed jaeger (exit 137) under the span volume of a
              # sustained load run; the all-in-one in-memory trace store fills up.
              # The OOM briefly blocked services' OTEL export → sim error bursts.
              # 1.5Gi holds it; alternatively lower otel.sample_ratio to cut spans.
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            # Jaeger's UI /healthz is slow under CPU load; a 1s liveness timeout
            # was crashlooping it, which in turn timed out every service's OTEL
            # span export (added latency + "otel sdk error" spam). Ride it out.
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: adtech
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 14268
      targetPort: 14268
      name: collector
