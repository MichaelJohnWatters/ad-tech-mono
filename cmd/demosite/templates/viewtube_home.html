{{define "viewtube_home.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{template "styles" .}}
<style>
  .vt-wrap { max-width:1100px; margin:0 auto; padding:24px 20px; }
  .vt-h { font-size:15px; font-weight:700; margin:0 0 16px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .vt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  @media (max-width:820px){ .vt-grid{ grid-template-columns:1fr; } }
  .vt-card { text-decoration:none; color:var(--ink); display:block; }
  .vt-thumb { position:relative; aspect-ratio:16/9; border-radius:12px; background:linear-gradient(135deg,#1f2937,#ff0000 220%); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .vt-thumb .play { font-size:44px; color:#fff; opacity:.9; }
  .vt-thumb .ads { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,.8); color:#fff; font-size:11px; font-weight:600; padding:3px 7px; border-radius:4px; }
  .vt-meta { display:flex; gap:12px; margin-top:12px; }
  .vt-avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .vt-title { font-size:15px; font-weight:600; line-height:1.3; margin:0 0 4px; }
  .vt-sub { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
{{template "nav" .}}
<div class="vt-wrap">
  <p class="vt-h">Recommended — each video shows a different ad load</p>
  <div class="vt-grid">
    {{range .VideoList}}
    <a class="vt-card" href="/watch/{{.ID}}">
      <div class="vt-thumb"><span class="play">▶</span><span class="ads">{{.BreaksLabel}}</span></div>
      <div class="vt-meta">
        <div class="vt-avatar">A</div>
        <div>
          <p class="vt-title">{{.Title}}</p>
          <div class="vt-sub">{{.Channel}} · {{.Views}}</div>
        </div>
      </div>
    </a>
    {{end}}
  </div>
</div>
{{template "consentBanner" .}}
{{template "sdkboot" .}}
</body>
</html>{{end}}
