<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1626"/>
      <stop offset="1" stop-color="#1a2540"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfd8dc"/>
      <stop offset="1" stop-color="#78909c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2c2c54"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="250" fill="url(#bg)" rx="6"/>
  <!-- stars -->
  <circle cx="40" cy="35" r="0.8" fill="white"/>
  <circle cx="260" cy="48" r="1" fill="white" opacity="0.7"/>
  <circle cx="220" cy="28" r="0.6" fill="white"/>
  <circle cx="80" cy="60" r="0.9" fill="white" opacity="0.6"/>
  <!-- road -->
  <rect x="0" y="180" width="300" height="70" fill="url(#road)"/>
  <line x1="40" y1="220" x2="80" y2="220" stroke="#f1c40f" stroke-width="2"/>
  <line x1="120" y1="220" x2="160" y2="220" stroke="#f1c40f" stroke-width="2"/>
  <line x1="200" y1="220" x2="240" y2="220" stroke="#f1c40f" stroke-width="2"/>
  <!-- car body -->
  <g transform="translate(40,110)">
    <path d="M0,55 Q5,45 18,42 L40,28 Q60,18 100,18 Q140,18 165,30 L195,42 Q210,45 215,55 L215,68 L0,68 Z" fill="url(#metal)" stroke="#37474f" stroke-width="1"/>
    <!-- windows -->
    <path d="M48,30 L65,22 Q90,18 130,18 Q160,18 168,30 L160,42 L52,42 Z" fill="#0d1117" opacity="0.6"/>
    <!-- headlight -->
    <ellipse cx="208" cy="50" rx="6" ry="3" fill="#fff9c4"/>
    <!-- wheels -->
    <circle cx="50" cy="70" r="14" fill="#1a1a1a"/>
    <circle cx="50" cy="70" r="6" fill="#9e9e9e"/>
    <circle cx="170" cy="70" r="14" fill="#1a1a1a"/>
    <circle cx="170" cy="70" r="6" fill="#9e9e9e"/>
  </g>
  <text x="150" y="28" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#f1c40f" letter-spacing="3" text-anchor="middle">THE 2026 MODEL</text>
  <text x="150" y="55" font-family="-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="1" text-anchor="middle">LUXAUTO M5</text>
  <text x="150" y="78" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="white" opacity="0.7" text-anchor="middle">Performance refined.</text>
</svg>
